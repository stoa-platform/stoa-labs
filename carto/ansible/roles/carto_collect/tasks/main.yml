---
- name: Compte de service dédié
  ansible.builtin.user:
    name: "{{ carto_user }}"
    system: true
    shell: /usr/sbin/nologin

- name: Répertoire d'installation
  ansible.builtin.file:
    path: "{{ carto_install_dir }}"
    state: directory
    owner: "{{ carto_user }}"
    mode: "0755"

- name: Dépôt du paquet — collecteur, rendu et marqueur d'import
  ansible.builtin.copy:
    src: "{{ carto_source_dir }}/{{ item }}"
    dest: "{{ carto_install_dir }}/carto/"
    owner: "{{ carto_user }}"
    mode: "0644"
  loop:
    - collect
    - render
    - __init__.py

- name: Script de publication Markdown — déposé exécutable
  # Posé seulement si la publication Markdown est demandée : un script de
  # poussée git installé sur un hôte qui n'en a pas l'usage est une surface
  # inutile. Mode 0755 et non 0644 : l'enveloppe l'invoque.
  ansible.builtin.copy:
    src: "{{ carto_source_dir }}/scripts/publier-markdown.sh"
    dest: "{{ carto_install_dir }}/publier-markdown.sh"
    owner: "{{ carto_user }}"
    mode: "0755"
  when: carto_pages_repo_url | length > 0

- name: Publication Markdown — le credential d'écriture est-il fourni ?
  # Échouer TÔT et EN NOMMANT ce qui manque. Sans ce contrôle, l'absence de
  # jeton ne se verrait qu'à la première exécution planifiée, la nuit, sous la
  # forme d'un échec de `git push` dans un journal que personne ne lit.
  ansible.builtin.assert:
    that:
      - carto_pages_user | length > 0
      - carto_pages_token | length > 0
    fail_msg: >-
      `carto_pages_repo_url` est renseigné mais le credential d'écriture ne
      l'est pas : `carto_pages_user` et/ou `carto_pages_token` sont vides. Ce
      couple n'a pas de valeur par défaut et n'en aura jamais — il est fourni à
      l'exécution depuis le coffre. Ce qu'il faut poser (dépôt dédié, compte de
      SERVICE avec droit d'écriture sur ce seul dépôt, jeton d'accès limité à
      ce dépôt) est décrit dans la section « GESTE EXPLOITANT » en tête de
      carto/scripts/publier-markdown.sh. Pour déployer sans publication
      Markdown, laisser `carto_pages_repo_url` vide.
  when: carto_pages_repo_url | length > 0

- name: Racine web de publication
  ansible.builtin.file:
    path: "{{ carto_web_root }}"
    state: directory
    owner: "{{ carto_user }}"
    mode: "0755"

- name: Enveloppe d'exécution
  ansible.builtin.template:
    src: carto-collect.sh.j2
    dest: "{{ carto_install_dir }}/carto-collect.sh"
    owner: "{{ carto_user }}"
    mode: "0700"
  no_log: true          # le gabarit porte les identifiants

- name: Planification quotidienne
  ansible.builtin.cron:
    name: carto-collect
    user: "{{ carto_user }}"
    hour: "{{ carto_schedule_hour }}"
    minute: "{{ carto_schedule_minute }}"
    # Le script se place lui-meme dans {{ carto_install_dir }} (voir le
    # gabarit) : plus besoin d'un `cd` porte par la ligne de planification.
    job: "{{ carto_install_dir }}/carto-collect.sh"

- name: Vérification — la chaîne tourne en dry-run sans rien publier
  ansible.builtin.command:
    # Appelle l'enveloppe, pas `python3 -m carto.collect` directement : les
    # identifiants sont deja internes au script rendu (gabarit `no_log`
    # ci-dessus). Aucun `environment:` ici — passer WM_PASS par ce biais
    # l'exposerait en clair dans la trace EXEC du plugin de connexion des
    # qu'on relance la tache en -vvv, ce que `no_log` ne protege pas.
    cmd: "{{ carto_install_dir }}/carto-collect.sh --verify"
  become_user: "{{ carto_user }}"
  changed_when: false
  register: carto_verify

- name: Vérification — la collecte voit des APIs, du trafic et une fenêtre non nulle
  # Les trois assertions sont nécessaires. `apis=0` seul laisse passer le mode
  # de défaillance le plus sournois du produit (README, tableau de diagnostic) :
  # la policy `Log Invocation` inactive donne `apis=2 aretes=0
  # fenetre_couverte=0j` — l'inventaire est lu, aucun événement n'est trouvé, et
  # la carto publiée dit sans erreur que personne n'appelle personne. Ce mode-là
  # a survécu à la refonte du 2026-07-31 : ce n'est plus un motif d'index
  # erroné qui le déclenche (il n'y a plus d'index à écrire), c'est la gateway
  # qui n'écrit tout simplement aucun événement.
  ansible.builtin.assert:
    that:
      - "'apis=0' not in carto_verify.stdout"
      - "'aretes=0' not in carto_verify.stdout"
      - "'fenetre_couverte=0j' not in carto_verify.stdout"
    fail_msg: >-
      collecte dégradée ({{ carto_verify.stdout }}) : `apis=0` = identifiants ou
      chemins d'administration à revoir ; `aretes=0` et/ou `fenetre_couverte=0j`
      = aucun événement lu — vérifier l'activation de la policy système
      GlobalLogInvocationPolicy sur la gateway (voir carto/TERRAIN.md V3).

- name: Vérification — le trafic est rattaché à des consommateurs identifiés
  # Quatrième assertion, et la seule qui couvre le pire cas RÉELLEMENT MESURÉ.
  # Sur la gateway de mesure (carto/TERRAIN.md, V5), la collecte sort
  # `apis=2 aretes=3 fenetre_couverte=34j trafic_non_identifie=100.0%` : les
  # trois assertions ci-dessus passent, le déploiement est VERT, et seul le
  # bandeau de la page dira que la moitié du produit ne tient pas. Un rôle qui
  # se déclare satisfait pendant que la page crie est un rôle qui ment.
  #
  # Le seuil est celui du rendu (SEUIL_NON_IDENTIFIE dans index.html) : la
  # page et le déploiement doivent s'alarmer au même moment.
  #
  # CE QUE MESURE CE COMPTEUR A CHANGÉ LE 2026-08-07. Il portait la fenêtre
  # d90 ; il porte désormais la plus COURTE fenêtre qui compte du trafic servi
  # (`fenetre_de_porte=` le nomme dans la même ligne). Motif mesuré : 803
  # événements non identifiés du 2026-07-30 — le débris d'une campagne
  # d'investigation — tenaient le ratio d90 à 99,3 %, donc ce rôle en échec,
  # alors que les jours récents étaient identifiés à 2/2. Une porte qui
  # condamne 90 jours après la correction de la cause n'est plus une porte,
  # c'est un rouge permanent qu'on finit par ignorer. Le chiffre d90 reste
  # publié à côté (`trafic_non_identifie_90j=`) et reste visible dans la carto.
  vars:
    # Un `vars:` de tâche rend une CHAÎNE, même après `| float` : la
    # conversion doit être faite au point de comparaison, sinon Ansible
    # échoue sur « '<=' not supported between instances of 'str' and 'float' »
    # — une panne de rôle au lieu du diagnostic attendu. Vérifié.
    #
    # `default('', true)` : quand AUCUNE fenêtre ne porte de trafic servi, le
    # collecteur écrit `trafic_non_identifie=aucun` — volontairement pas un
    # nombre. `regex_search` rend alors `None`, et `| first` sur `None` ferait
    # planter le rôle sur une erreur de gabarit au lieu de dire ce qui se
    # passe. Le cas est traité explicitement ci-dessous.
    carto_fenetre_de_porte: >-
      {{ carto_verify.stdout | regex_search('fenetre_de_porte=(\w+)', '\1')
         | default([''], true) | first }}
    carto_part_non_identifiee: >-
      {{ carto_verify.stdout | regex_search('trafic_non_identifie=([0-9.]+)%', '\1')
         | default([''], true) | first }}
  ansible.builtin.assert:
    that:
      # D'abord la présence du compteur : un collecteur trop ancien pour le
      # porter doit être nommé comme tel, pas produire une erreur de gabarit.
      # L'ordre compte — `assert` s'arrête à la première condition fausse.
      - "'trafic_non_identifie=' in carto_verify.stdout"
      # Puis le cas « rien à imputer » : aucune fenêtre ne porte de trafic
      # servi. Ce n'est PAS un 0 % — on ne peut rien conclure sur la dimension
      # consommateur, et un vert obtenu par absence de mesure ressemblerait
      # trait pour trait à un vert mérité. C'est l'assertion « fenêtre
      # couverte » ci-dessus qui porte le diagnostic d'une collecte vide.
      - carto_fenetre_de_porte != 'aucune'
      - carto_part_non_identifiee | float <= carto_seuil_non_identifie_pct | float
    fail_msg: >-
      collecte publiable mais NON FIABLE sur la dimension consommateur
      ({{ carto_verify.stdout }}) : la part du trafic qui n'est rattachée à
      aucun consommateur identifié dépasse
      {{ carto_seuil_non_identifie_pct }} %. Concrètement, la réponse
      majoritaire à « qui consomme quoi » est « on ne sait pas » : le trafic
      s'agrège sur des nœuds « (inconnu) », les consommateurs réels basculent
      en « déclaré, inactif », et l'annuaire les annonce sans appel. Les
      inventaires d'APIs et d'Applications, eux, restent exacts.
      QUE VÉRIFIER : que l'appelant transmet bien sa clé API (en-tête
      `x-Gateway-APIKey`) et que l'Application qui la porte est déclarée
      consommatrice de l'API. L'identification est NATIVE sur webMethods 10.15
      — elle ne demande AUCUNE policy d'identification, et en ajouter une mal
      ajustée peut au contraire l'empêcher (mesure du 2026-08-06, encadré en
      tête de la section V5 de carto/TERRAIN.md ; l'ancien verdict « la
      gateway ne renseigne pas l'appelant, question ouverte à porter au
      support » est RÉFUTÉ — ne pas ouvrir de ticket éditeur sur cette base).
      Le chiffre porte la fenêtre nommée par `fenetre_de_porte=` ; comparez-le
      à `trafic_non_identifie_90j=` : si le second est bien plus haut, ce qui
      reste est un héritage en train de sortir de la fenêtre, pas une panne.
      Si ce message apparaît, la carto reste utile pour l'inventaire et la
      fenêtre, pas pour « qui appelle qui ».
