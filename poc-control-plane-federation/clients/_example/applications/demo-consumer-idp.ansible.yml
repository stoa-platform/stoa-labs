---
# demo-consumer-idp.ansible.yml — application consommatrice, AUTH mode IDP.
#
# L'IdP (ici Keycloak) est l'authorization server. Le client OAuth2 EXISTE DÉJÀ
# sur l'IdP (créé EN AMONT par l'IAM — hors périmètre de ce pipeline). Ce que Git
# porte, c'est LA CLAIM qui identifie l'application ; sur la gateway on ne crée que
# l'application + son identifier openIdClaims + la stratégie OAUTH2 → alias EXTERNE.
# L'audience de la stratégie = celle de l'API. AUCUN secret stocké (il vit sur l'IdP).
apim_ss_app:
  name: "demo-consumer-idp"
  api: "demo-selfservice"
  api_version: "1.0.0"
  description: "ADR-078 — consommateur OAuth2 mode IDP (claim depuis Git)"
  contact_emails: ["demo-idp@bank.invalid"]
  backend: { header: "apikey", value_template: "${backend_apikey}" }
  # L'opposabilité vient de la stratégie + de la claim (openIdClaims) — pas d'IP/cert ici.
  enforce: []

  auth:
    mode: "idp"
    # Alias auth-server EXTERNAL déjà posé sur la gateway (inbound.yml, par env :
    # même NOM, valeurs locales — portable, ADR-079). Ici la démo Keycloak.
    server_alias: "KeycloakStoaLab"
    # LA CLAIM d'identification — vit dans Git. C'est elle qui « crée » l'app côté
    # gateway (le client, lui, préexiste sur l'IdP). Le NOM de la claim (azp) est
    # ici invariant ; sa VALEUR peut changer par env (le client de l'IdP diffère
    # souvent entre dev et prod : realm/env distincts). Cf. per_env ci-dessous.
    claim: { name: "azp" }

  per_env:
    # MULTI-ENV. La fusion est RÉCURSIVE (racine ⊕ per_env) : ce que per_env pose
    # sous auth.* surcharge la racine, le reste est hérité. Ici la VALEUR de la
    # claim ET l'audience changent par env — le nom `azp` est hérité de la racine.
    # PROUVÉ live : dev → stratégie clientId=consumer-dev, int → consumer-int
    # (stratégie OAUTH2-<app>-<env>, une par env). L'audience = celle de l'API sur
    # CET env (issuer/jwks de l'alias EXTERNAL changent aussi par env, posés alias-first).
    dev:  { auth: { audience: "demo-selfservice", claim: { value: "consumer-dev" } } }
    rec:  { auth: { audience: "demo-selfservice", claim: { value: "consumer-rec" } } }
    int:  { auth: { audience: "demo-selfservice", claim: { value: "consumer-int" } } }
    prod: { auth: { audience: "demo-selfservice", claim: { value: "consumer-prod" } } }
