# =============================================================================
# PoC Control Plane Fédération — socle OSS (Phase 1)
#
# Fédère 3 runtimes hétérogènes sous un control plane assemblé sur briques OSS :
#   - WSO2 API Manager   (réel, OSS)        — gateway "neuf" souverain
#   - Apache APISIX      (réel, OSS)        — gateway OSS additionnel
#   - webMethods mock    (Go, local)        — legacy commercial (stand-in)
# + identité (Keycloak broker + Dex=mock Oracle), observabilité (otel-lgtm),
#   backend synthétique (Microcks).
#
# DoD Phase 1 : `docker compose -f docker-compose.poc.yml up -d` → tous healthy,
# Grafana (otel-lgtm) voit les 3 gateways via service.name.
#
# Tags d'images : voir .env (à confirmer au premier `up`).
# =============================================================================

name: stoa-labs-poc

networks:
  poc:
    driver: bridge

volumes:
  etcd-data:
  mongo-data:

services:

  # ---------------------------------------------------------------------------
  # Secrets — HashiCorp Vault (dev-mode) — ADR-074, concrétise le gap (d) d'ADR-072
  # Secrets centralisés, LUS À L'EXÉCUTION par labctl / onboarding-api / la CI
  # (au lieu des placeholders targets.yaml / env / credentials Jenkins). Dev-mode
  # = unsealed, KV v2 monté sous secret/, root token PoC JETABLE. Provisionné
  # idempotemment par scripts/setup-vault.sh. En prod : AppRole + rotation.
  # ---------------------------------------------------------------------------
  vault:
    image: ${VAULT_IMAGE:-hashicorp/vault:1.17}
    container_name: poc-vault
    ports:
      - "${PORT_VAULT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:?Variable VAULT_ROOT_TOKEN absente — définissez-la (voir poc-control-plane-federation/.env.example)}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [poc]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Gateway #1 — WSO2 API Manager (réel, OSS)
  # ---------------------------------------------------------------------------
  wso2am:
    image: ${WSO2AM_IMAGE}
    container_name: poc-wso2am
    ports:
      - "${PORT_WSO2_CONSOLE:-9443}:9443"   # Publisher / Devportal / Admin
      - "${PORT_WSO2_GATEWAY:-8243}:8243"   # Gateway data-plane (https)
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1536m"       # profil light (cf. Council #5)
    healthcheck:
      # WSO2 expose les services Carbon sur 9443 (TLS auto-signé).
      test: ["CMD-SHELL", "curl -sk https://localhost:9443/services/Version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks: [poc]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Gateway #2 — Apache APISIX (réel, OSS) + etcd
  # ---------------------------------------------------------------------------
  etcd:
    # Hardcoded to official CoreOS etcd (durable/supported). Bitnami removed the
    # public bitnami/etcd:3.5 tag (Broadcom 2025 → bitnamilegacy). The .env files
    # are permission-locked in this PoC and still carry a stale
    # ETCD_IMAGE=bitnami/etcd:3.5 (non-pullable) — that value is INTENTIONALLY
    # NOT referenced here so a fresh `up` always pulls a real image. Update the
    # stale .env line to quay.io/coreos/etcd:v3.5.21 when the files are unlocked.
    image: quay.io/coreos/etcd:v3.5.21
    container_name: poc-etcd
    # Official CoreOS etcd, single node, no auth (APISIX config store).
    # Env-var config (entrypoint-agnostic); name/peer left at single-node defaults.
    environment:
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCDCTL_API: "3"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [poc]
    restart: unless-stopped

  apisix:
    image: ${APISIX_IMAGE}
    container_name: poc-apisix
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "${PORT_APISIX:-9080}:9080"          # data-plane
      - "${PORT_APISIX_ADMIN:-9180}:9180"    # Admin API (labctl, Phase 2)
    volumes:
      - ./gateways/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    healthcheck:
      # The apache/apisix:*-debian image ships NO curl/wget/nc, but it has bash.
      # Probe the data-plane (9080) and admin (9180) listeners via bash /dev/tcp —
      # tool-free liveness that proves APISIX is serving and its config plane is up.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080 && exec 4<>/dev/tcp/127.0.0.1/9180"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [poc]
    restart: unless-stopped

  # APISIX Dashboard (UI) — viewer/éditeur cliquable au-dessus du MÊME etcd.
  # Pratique pour parcourir routes/plugins/consumers à la souris ; la source de
  # vérité reste Git/UAC + labctl. Login PoC jetable admin/admin.
  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    container_name: poc-apisix-dashboard
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "${PORT_APISIX_DASHBOARD:-9000}:9000"
    volumes:
      - ./gateways/apisix/dashboard-conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    networks: [poc]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Gateway #3 — webMethods mock (Go, local) — legacy commercial stand-in
  # ---------------------------------------------------------------------------
  webmethods-mock:
    build:
      context: ./mocks/webmethods
    image: stoa-labs/webmethods-mock:dev
    container_name: poc-webmethods
    ports:
      - "${PORT_WEBMETHODS:-8090}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      OTEL_SERVICE_NAME: "webmethods-mock"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTLP_ENDPOINT_HTTP:-otel-lgtm:4318}"
      # Phase 3: enable Keycloak Bearer JWT validation on the data-plane. iss is
      # the pinned KC_HOSTNAME (localhost:8480); JWKS is fetched over the compose
      # network from keycloak:8080 (the host/container split).
      JWT_ISSUER: "http://localhost:8480/realms/stoa-lab"
      JWT_JWKS_URL: "http://keycloak:8080/realms/stoa-lab/protocol/openid-connect/certs"
    healthcheck:
      test: ["CMD", "/webmethods-mock", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [poc]
    restart: unless-stopped
    depends_on:
      - otel-lgtm

  # ---------------------------------------------------------------------------
  # Identité — Dex (mock Oracle IdP, OIDC upstream)
  # ---------------------------------------------------------------------------
  dex:
    image: ${DEX_IMAGE}
    container_name: poc-dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "${PORT_DEX:-5556}:5556"
    volumes:
      - ./identity/dex/config.yaml:/etc/dex/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:5556/dex/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [poc]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Identité — Keycloak (broker : fédère Dex/Oracle, émet les tokens)
  # ---------------------------------------------------------------------------
  keycloak:
    # Hardcoded 26.3.4 (NOT ${KEYCLOAK_IMAGE} — .env est géré hors outillage
    # agent [deny-listé] et porte un 26.1.4 stale désormais NON consommé ;
    # même précédent que le port 8480 ci-dessous ; .env.example réaligné).
    # Le token exchange STANDARD (RFC 8693) est GA depuis KC 26.2 — requis
    # par la chaîne A « identité utilisateur → Vault » (ADR-077).
    image: quay.io/keycloak/keycloak:26.3.4
    container_name: poc-keycloak
    command: ["start-dev", "--import-realm"]
    depends_on:
      - dex
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # Phase 3: pin a deterministic issuer so EVERY token (service-account AND
      # the Oracle-brokered login, which rides the host URL) carries
      # iss=http://localhost:8480/realms/stoa-lab. BACKCHANNEL_DYNAMIC lets the
      # gateways still fetch JWKS over the compose network (keycloak:8080).
      KC_HOSTNAME: "http://localhost:8480"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      DEX_BROKER_CLIENT_SECRET: "${DEX_BROKER_CLIENT_SECRET:-keycloak-broker-secret-poc}"
    ports:
      # Hardcoded host 8480 (NOT 8081 — taken by another local stack,
      # docker-compose-stoa-gateway; and KC_HOSTNAME above pins iss to :8480).
      # The .env files are permission-locked and still carry a stale
      # PORT_KEYCLOAK=8081 — INTENTIONALLY NOT referenced here. Update that line
      # to 8480 when the files are unlocked.
      # Internal port stays 8080 — that's what `labctl subscribe` calls over the
      # compose network, so the host remap doesn't affect Phase 1/2.
      - "8480:8080"
    volumes:
      - ./identity/keycloak/realm-stoa-lab.json:/opt/keycloak/data/import/realm-stoa-lab.json:ro
    # No HEALTHCHECK: the Keycloak ubi9-micro image ships no shell/curl/wget for a
    # reliable in-container probe. KC starts well before WSO2 (180s) is healthy, so
    # `labctl subscribe` (Admin API over the compose network) finds it ready.
    # Manual readiness: http://localhost:8480/health/ready (KC_HEALTH_ENABLED=true).
    networks: [poc]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Observabilité — Grafana LGTM all-in-one (embarque l'OTel Collector)
  # ---------------------------------------------------------------------------
  otel-lgtm:
    image: ${OTEL_LGTM_IMAGE}
    container_name: poc-otel-lgtm
    ports:
      - "${PORT_GRAFANA:-3000}:3000"        # Grafana
      - "${PORT_OTLP_GRPC:-4317}:4317"      # OTLP gRPC
      - "${PORT_OTLP_HTTP:-4318}:4318"      # OTLP HTTP
    environment:
      # Lu par le provisioning datasource OpenSearch-Txn via $__env{...} (dépôt
      # public : la valeur ne vit plus dans le fichier de provisioning versionné).
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:?Variable OPENSEARCH_PASSWORD absente — définissez-la (voir poc-control-plane-federation/.env.example)}
    volumes:
      # Auto-provision the federation dashboard so /d/stoa-fed-overview exists on
      # a FRESH `up` (the image already provisions prometheus/tempo/loki datasources
      # with stable UIDs, which the dashboard JSON references). The provider yaml
      # sits in the image's dashboards provisioning dir; the bare dashboard JSON is
      # mounted into the sibling json/ dir the provider points at.
      - ./observability/grafana/provisioning/dashboards/stoa.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/stoa.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/json:ro
      # ADR-070 bridge: the OpenSearch-Txn datasource (plan GOUVERNANCE/AUDIT)
      # referenced by dashboard stoa-fed-otel-txn. type=elasticsearch because the
      # dedicated grafana-opensearch plugin is NOT bundled (air-gapped); OpenSearch
      # 2.x is wire-compatible with ES 7.10. The trace<->transaction correlation
      # (read-only Tempo source) is applied by provisioning/apply.sh, not a mount.
      - ./observability/grafana/provisioning/datasources/opensearch-txn.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/opensearch-txn.yaml:ro
    healthcheck:
      # The otel-lgtm image ships curl, not wget.
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [poc]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend synthétique — Microcks (mock depuis OpenAPI) + MongoDB
  # ---------------------------------------------------------------------------
  mongo:
    image: ${MONGO_IMAGE}
    container_name: poc-mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [poc]
    restart: unless-stopped

  microcks:
    image: ${MICROCKS_IMAGE}
    container_name: poc-microcks
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${PORT_MICROCKS:-8585}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: "uber,uber-async-minion"
      SPRING_DATA_MONGODB_URI: "mongodb://mongo:27017/microcks"
      KEYCLOAK_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [poc]
    restart: unless-stopped

# Note Phase 2/3 : Backstage (catalogue/portail/self-service) est ajouté via une
# app buildée (RHDH ou create-app) — pas une simple image à puller — donc câblé
# au moment où il est réellement utilisé (T7→T16/T17), pas dans ce socle.
