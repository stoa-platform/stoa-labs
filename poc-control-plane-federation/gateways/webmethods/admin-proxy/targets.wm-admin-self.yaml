# targets.wm-admin-self.yaml — SELF-PROXY de l'API d'admin (modèle CLIENT),
# appliqué sur le wM RÉEL par scripts/setup-wm-admin-self-proxy.sh.
#
# Chez le client, l'API d'admin de la gateway n'est pas exposée en direct aux
# outils : elle est PROXIFIÉE SUR LA GATEWAY ELLE-MÊME, avec OAuth2 devant.
# Ce manifest reproduit ce montage au lab (self-referencing proxy — prouvé au
# spike teams-scoping) :
#
#   data-plane  http://localhost:5555/gateway/wm-admin-self/1.0/rest/apigateway/...
#   → routé ${wm-admin-self}/${sys:resource_path} → http://localhost:5555 (ELLE-MÊME)
#   entrée : Bearer Keycloak (client_credentials ci-horsprod, scope admin:self)
#   sortie : Basic depuis le credential alias wm-admin-self-cred (valeurs Vault
#            secret/stoa/gateways/webmethods, injectées PAR LE SCRIPT — les
#            placeholders __FROM_VAULT__ ne sont JAMAIS commités en vrai)
#
# Même contrat ALLOWLIST que les proxies d'env (aucun DELETE, /users → 404).
apiVersion: labctl.stoa.io/v1
kind: FederationTarget
name: wm-admin-self

contract: ./wm-admin-proxy.openapi.yaml

# Informationnel : le routage effectif est l'${alias} ci-dessous (per-request).
backendUrl: http://localhost:5555

targets:
  - name: webmethods
    type: webmethods
    adminUrl: http://localhost:5555      # le wM RÉEL (host) — il porte le proxy…
    gatewayUrl: http://localhost:5555
    routing:
      endpointAlias:
        name: wm-admin-self
        url: http://localhost:5555       # …ET il est sa propre cible (localhost DANS le conteneur)
      credentialAlias:
        name: wm-admin-self-cred
    # OAuth2 entrant — mêmes horizons réseau Keycloak que les proxies d'env ;
    # audience/scope propres. ⚠ audience fail-OPEN sur le trial (LIVE FINDING
    # targets.yaml) : la barrière opposable est le SCOPE admin:self + l'azp.
    inboundAuth:
      issuer: http://localhost:8480/realms/stoa-lab
      jwksUri: http://keycloak:8080/realms/stoa-lab/protocol/openid-connect/certs
      aliasName: KeycloakStoaLab
      audience: wm-admin-self
      scope: admin:self
      clientId: ci-horsprod
      introspectionEndpoint: http://keycloak:8080/realms/stoa-lab/protocol/openid-connect/token/introspect
      introspectionClientId: poc-gateways
      introspectionClientSecret: poc-gateways-secret
      introspectionUser: Administrator
    credentials:
      # Admin du wM RÉEL — placeholders ; avec VAULT_ADDR, labctl les résout
      # depuis secret/stoa/gateways/webmethods (ADR-074).
      username: Administrator
      password: manage
      # Valeurs du credential alias (Basic SORTANT du proxy vers l'admin réel) —
      # substituées depuis Vault gateways/webmethods par le script de setup.
      backendUsername: __FROM_VAULT__
      backendPassword: __FROM_VAULT__
