# Dex — mock de l'IdP Oracle (OIDC upstream). "Oracle reste master" : Keycloak
# le broke et émet les tokens consommés par les 3 gateways.
# Données synthétiques uniquement. Mot de passe des users de démo : "password".
issuer: http://dex:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

telemetry:
  http: 0.0.0.0:5558

oauth2:
  skipApprovalScreen: true

# Client confidentiel utilisé par Keycloak comme broker OIDC upstream.
staticClients:
  - id: keycloak-broker
    name: "Keycloak Broker (STOA Lab)"
    secret: keycloak-broker-secret-poc
    redirectURIs:
      # Endpoint broker Keycloak (port hôte mappé pour le flux navigateur).
      # Host port 8480 (8081 était pris par un autre stack local).
      - http://localhost:8480/realms/stoa-lab/broker/oracle/endpoint

enablePasswordDB: true

# bcrypt de "password" (hash d'exemple public Dex).
staticPasswords:
  - email: "alice@bc.example"
    hash: "$2a$10$6EykdUs9Nj6.ibmWqAnDrugYK3mVYbDsqGXnatJagn8sTxrh8K.22"
    username: "alice"
    userID: "oracle-alice-001"
  - email: "bob@bc.example"
    hash: "$2a$10$6EykdUs9Nj6.ibmWqAnDrugYK3mVYbDsqGXnatJagn8sTxrh8K.22"
    username: "bob"
    userID: "oracle-bob-002"
  # Console Light — auditeur (viewer) et admin plateforme (cpi-admin)
  - email: "carol@bc.example"
    hash: "$2a$10$6EykdUs9Nj6.ibmWqAnDrugYK3mVYbDsqGXnatJagn8sTxrh8K.22"
    username: "carol"
    userID: "oracle-carol-003"
  - email: "dave@bc.example"
    hash: "$2a$10$6EykdUs9Nj6.ibmWqAnDrugYK3mVYbDsqGXnatJagn8sTxrh8K.22"
    username: "dave"
    userID: "oracle-dave-004"
