# config/site.ini — LES VALEURS DE SITE, posées par le CLIENT dans SON dépôt.
#
# À QUOI SERT CE FICHIER. La chaîne reçoit normalement ses valeurs de site par
# les propriétés globales du contrôleur Jenkins. Les poser exige le droit
# `Overall/RunScripts` : un exploitant qui ne l'a pas n'avait, jusqu'au
# 2026-09-17, AUCUNE voie. Ce fichier est cette voie. Il est lu par
# `ci/lib/site-env.sh`, sourcée en tête de chaque bloc `sh` des pipelines, et
# ses valeurs sont exportées vers les scripts de la chaîne.
#
# ⚠ CETTE COPIE, DANS LE DÉPÔT, NE PORTE AUCUNE VALEUR ACTIVE — et c'est
# délibéré. Une ligne `GIT_HOST=http://gitea:3000` livrée ici serait un défaut
# de laboratoire qu'AUCUNE des quatre portes ne voit : `ci/lint-config-knobs.sh`
# n'inspecte que les Jenkinsfile et les scripts shell, jamais un fichier de
# données. Ce serait exactement le défaut silencieux que le dépôt a passé deux
# jours à retirer de `FORGE_KIND` puis de `GIT_HOST`. Ce qui suit est donc un
# CATALOGUE commenté : le client décommente et renseigne ce dont il a besoin.
#
# PRÉCÉDENCE : une variable déjà posée dans l'environnement (une globale
# Jenkins, si le site a un admin) l'emporte TOUJOURS sur ce fichier. Les deux
# voies coexistent, celle du fichier ne casse jamais celle de l'admin.
#
# FORMAT, identique à `setup-jenkins-globals.sh --file` (un seul format pour les
# deux voies, une épreuve-miroir l'exige) :
#   CLE=valeur          la valeur est le RESTE BRUT de la ligne
#   # commentaire       ligne ignorée
#   (ligne vide)        ignorée
# Pas de guillemets à retirer, pas de commentaire en fin de ligne : un `#` après
# une valeur en fait partie. Nom en majuscules, chiffres et souligné.
#
# ⛔ AUCUN SECRET ICI. Ce fichier est VERSIONNÉ, donc lisible par quiconque lit
# le dépôt. Tout nom contenant PASSWORD, SECRET, TOKEN, _KEY ou CREDENTIALS est
# REFUSÉ au chargement (`SITE_SECRET_INTERDIT`), sauf `*_CREDENTIALS_ID`, qui
# n'est qu'un identifiant. Les secrets vont dans les credentials Jenkins ou dans
# le coffre.

# ── LA FORGE ────────────────────────────────────────────────────────────────
#GIT_HOST=        base de la forge vue DEPUIS L'AGENT (ex. https://forge.client)
#GIT_WEB_HOST=    la même vue depuis un POSTE, pour les liens cliquables des PR
#GIT_REPO=        owner/repo du dépôt plateforme (ex. groupe/depot)
#GIT_BASE=        branche par défaut ; absente, la chaîne la DÉCOUVRE
#GIT_SUBDIR=      préfixe du livrable dans le dépôt (laisser au <scm> du job)
#FORGE_KIND=      gitea | gitlab — REQUISE, sans défaut depuis le 2026-09-12
#FORGE_API_AUTH=  token | private-token | bearer | basic (dérivée du visage si absente)
#FORGE_API_BASE=  base d'API complète si un reverse-proxy la déplace
#FORGE_USER=      utilisateur de la forge (nécessaire en auth `basic`)
#FORGE_CRED_KIND= secret-text | username-password : la FORME du credential Jenkins
#GITEA_CREDENTIALS_ID=  identifiant du credential portant le jeton de la forge
#GITEA_SERVICE_LOGINS=  logins de service acceptés comme auteurs de merge
#ARCHIVE_STORE_PROJECT= registre générique des archives (REQUIS sous GitLab)

# ── LE RÉCEPTEUR DE WEBHOOKS ────────────────────────────────────────────────
#WEBHOOK_KIND=    gwt | gitlab — absent, la chaîne retombe SILENCIEUSEMENT sur gwt

# ── L'AGENT DES `node` EXPLICITES ───────────────────────────────────────────
# provision-plan, provision-apply, team-apply, team-promote et team-publish sont
# en `agent none` : leurs post{always} — et, chez provision-apply, la porte et la
# garde d'identité APRÈS la pause — prennent un nœud explicite. Rien de posé ⇒
# N'IMPORTE QUEL agent (sur Kubernetes : le pod `default`, souvent sans python3
# ni ansible). Lu AU PARSE ; une combinaison incohérente est REFUSÉE avant tout
# geste. Chemin du YAML DEPUIS LA RACINE DU DÉPÔT (pas depuis le livrable), lu
# sur la branche de base : une PR ne peut pas changer l'image.
#AGENT_POD_YAML_FILE=  pod Kubernetes des nœuds explicites (le même YAML que l'`agent { kubernetes }` des stages)
#AGENT_CONTAINER=      conteneur qui porte python3/ansible — EXIGÉ avec un pod (`jnlp` si c'est lui)
#POST_AGENT_LABEL=     label d'agent Jenkins — EXCLUSIF de AGENT_POD_YAML_FILE

# ── LE COFFRE ET L'IDENTITÉ ─────────────────────────────────────────────────
#VAULT_ADDR=              adresse du coffre
#VAULT_USER_AUTH_MOUNT=   point de montage d'authentification (ldap, userpass…)

# ── LA GATEWAY ET LES PALIERS ───────────────────────────────────────────────
#APIM_API_BASE=       base d'API d'administration de la gateway
#APIM_DATA_BASE=      base de données analytiques
#APIM_TERMINUS_BASE=  base du palier terminus
#APIM_PROXY_HOST=     hôte du proxy d'administration
#APIM_PROXY_API=      nom de l'API proxy
#APIM_PROXY_VER=      version de l'API proxy
#APIM_PROXY_PATH=     chemin ajouté à la base composée
#APIM_PREFLIGHT=      1 pour activer le préflight de joignabilité
#APIM_PREFLIGHT_URL=  GABARIT par palier, avec __ENV__ ; la substitution ne vaut QUE pour ce knob
#APIM_PREFLIGHT_CODES=  codes HTTP acceptés
#APIM_PREFLIGHT_TRIES=  nombre d'essais (chacun jusqu'à ~10 s, pas 5)
#APPLY_TENANT=        tenant visé par l'apply
#APPLY_JOB=           job d'apply appelé en aval
#APPLY_ADMIN_VIA=     direct | proxy-oauth2

# ── L'OBSERVABILITÉ ─────────────────────────────────────────────────────────
#OPENSEARCH_INSECURE=  true SEULEMENT sur un lab à certificat auto-signé
#OPENSEARCH_CA_FILE=   autorité de certification d'entreprise
#OTEL_EXPORTER_OTLP_ENDPOINT=  collecteur de traces

# ── LA GOUVERNANCE ET LE DÉPÔT ──────────────────────────────────────────────
#GOVERNANCE_REPO=  dépôt du registre de gouvernance
#GOVERNANCE_PATH=  chemin du registre dans ce dépôt
#MANIFEST_DIR=     répertoire des manifestes d'application
#CI_COMMIT_EMAIL=  adresse d'auteur des commits de la chaîne
#CI_COMMIT_NAME=   nom d'auteur des commits de la chaîne
#ITSM_URL=         point d'entrée du gestionnaire de changement
#JENKINS_UI=       adresse du contrôleur, pour les re-poses événementielles

# ── LE DIAGNOSTIC ───────────────────────────────────────────────────────────
#STOA_DEBUG=       1 pour tracer méthode, URL et code HTTP — jamais un secret
