# envs/rec/targets.yaml — cible de convergence REC (ADR-075), perspective HOST
# (labctl lancé sur le poste : tout passe par le port hôte 5555 du wM réel).
#
# L'env bas n'est PAS joignable directement : le mock wm-mock-rec vit sur le
# réseau nonprod (internal) — l'UNIQUE chemin admin est le proxy allowlist
# wm-admin-rec porté par le wM réel, OAuth2 scope deploy:rec (ADR-075).
#
# Usage : apply-uac --env rec --tenant banking-demo -f envs/rec/targets.yaml
# (token ci-horsprod écrit au préalable dans /tmp/stoa-wm-admin-token).
apiVersion: labctl.stoa.io/v1
kind: FederationTarget
name: accounts-read

# Ignoré par apply-uac (le contrat servi vient du repo governance, UAC v1) —
# requis par le loader, et utile pour un `labctl plan/apply` direct hors-UAC.
contract: ../../apis/accounts-read.openapi.yaml

# Informationnel : le routage effectif est l'${alias} accounts-read-backend.
backendUrl: http://poc-token-echo:8080/backend/rec

targets:
  - name: wm-rec
    type: webmethods
    # adminUrl = le PROXY admin de l'env (allowlist + scope deploy:rec), PAS le
    # mock : labctl parle « 10.15 » au proxy, le wM réel relaie vers wm-mock-rec.
    adminUrl: http://localhost:5555/gateway/wm-admin-rec/1.0
    # gatewayUrl = le MÊME proxy : le data-plane de l'env bas est le mock,
    # injoignable du host (réseau nonprod interne). La seule fenêtre data-plane
    # observable du host est donc le proxy lui-même — assumé et commenté, la
    # preuve data-plane des envs bas est la résolution ${alias} du mock (spike).
    gatewayUrl: http://localhost:5555/gateway/wm-admin-rec/1.0
    # Différences PAR ENV = les aliases (ADR-075). Backend rec du lab = un path
    # DISTINCT de token-echo (poc-token-echo logge ce qu'il reçoit) : la valeur
    # diffère par env, prouvant la projection per-env. NB : token-echo vit sur
    # `poc`, le mock sur `nonprod` (interne) — l'appel data-plane mock→backend
    # échoue réseau, fail-closed assumé ; la preuve est la VALEUR de l'alias.
    routing:
      endpointAlias:
        name: accounts-read-backend
        url: http://poc-token-echo:8080/backend/rec
      credentialAlias:
        name: accounts-read-backend-cred
    credentials:
      # Bearer ci-horsprod (scope deploy:rec) — XOR username/password : le
      # pipeline hors-prod ne porte JAMAIS un credential admin gateway.
      bearerTokenFile: /tmp/stoa-wm-admin-token
      # Valeurs du credential alias backend — placeholders PoC (Vault en cible).
      backendUsername: poc-backend-user
      backendPassword: poc-backend-secret
    # Pas d'inboundAuth en env bas : l'OAuth2 opposable est porté par le PROXY
    # (wm-admin-rec) ; le mock derrière n'expose rien hors nonprod.
