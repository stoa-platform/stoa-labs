---
# Gardes HORS LIGNE de l'onboarding et de la sonde Teams. Aucune gateway
# reelle : le mock suffit, et les cas `off` ne sortent meme pas du process.
- name: "Sonde Teams — table de verite"
  hosts: webmethods
  gather_facts: false
  tasks:

    # feature OFF forcee + politique false => on passe, teams desactivees
    - name: "OFF + derogation : la sonde rend false et ne refuse pas"
      ansible.builtin.import_role:
        name: apim_common
        tasks_from: teams-feature.yml
      vars:
        apim_ss_teams_feature: "off"
        apim_teams_required: false

    - name: "OFF + derogation : apim_teams_enabled doit etre false"
      ansible.builtin.assert:
        that: "not (apim_teams_enabled | bool)"
        fail_msg: "la sonde a rendu true alors que la feature est forcee off"
        success_msg: "OK — feature off, cloisonnement desactive"

    # feature OFF forcee + politique true => refus TEAMS_DISABLED
    - name: "OFF + exigence : doit refuser"
      block:
        - ansible.builtin.import_role:
            name: apim_common
            tasks_from: teams-feature.yml
          vars:
            apim_ss_teams_feature: "off"
            apim_teams_required: true
        - ansible.builtin.fail:
            msg: "aucun refus alors que la feature est off et une team exigee"
      rescue:
        - ansible.builtin.assert:
            that: "'TEAMS_DISABLED' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              refus obtenu mais pas le bon :
              {{ ansible_failed_result.msg | default('(sans message)') }}
            success_msg: "OK — TEAMS_DISABLED"

    # PIEGE VERROUILLE : apim_ss_require_team (var du role apim_selfservice_app)
    # posee a true DANS LE MEME vars: ne doit RIEN changer — seul le parametre
    # apim_teams_required commande la sonde. Sans ce test, une regression qui
    # relirait apim_ss_require_team en dur passerait inapercue (silencieuse,
    # puisque la variable absente retombe habituellement sur son defaut true).
    - name: "OFF + parametre false MALGRE apim_ss_require_team=true : la sonde obeit au parametre"
      ansible.builtin.import_role:
        name: apim_common
        tasks_from: teams-feature.yml
      vars:
        apim_ss_teams_feature: "off"
        apim_teams_required: false
        apim_ss_require_team: true

    - name: "PIEGE : apim_teams_enabled doit etre false (la variable de role a ete ignoree)"
      ansible.builtin.assert:
        that: "not (apim_teams_enabled | bool)"
        fail_msg: >-
          la sonde a lu apim_ss_require_team au lieu du parametre
          apim_teams_required — inoperante pour apim_publish_api
          (apim_pub_require_team)
        success_msg: "OK — la sonde obeit au parametre, pas a la variable de role"

    # LE DEFAUT CONSTATE le 2026-08-03 : un nom d'equipe resolu suffisait a
    # declencher GET /accessProfiles / POST /assets/team, MEME derogation posee
    # (apim_ss_require_team=false ne desactivait rien — seuls les deux assert
    # de team-name.yml/verify.yml en dependaient). team.yml et api-visibility.yml
    # exigent maintenant AUSSI apim_teams_enabled : ce test verifie l'expression
    # composee elle-meme (le cablage dans les roles est prouve par
    # test-onboard-guards-live.yml, qui exerce en plus la 4e ligne de la table
    # de verite contre un mock reel).
    - name: "Derogation : sonde OFF + derogation (etat que le job Jenkins pose TOUJOURS)"
      ansible.builtin.import_role:
        name: apim_common
        tasks_from: teams-feature.yml
      vars:
        apim_ss_teams_feature: "off"
        apim_teams_required: false

    - name: "Derogation : un nom d'equipe resolu ne doit PLUS, a lui seul, declencher le travail"
      ansible.builtin.assert:
        that: "not ((ss_team_name | default('banking-demo') | length > 0) and (apim_teams_enabled | bool))"
        fail_msg: >-
          la condition composee "(ss_team_name | length > 0) and (apim_teams_enabled | bool)"
          — celle qui garde team.yml et api-visibility.yml — est vraie alors que
          la feature est off : le role appellerait quand meme GET /accessProfiles
          (defaut du 2026-08-03, "le bouton" ne commandait que les assert).
        success_msg: "OK — nom d'equipe present mais feature off : le travail (pas seulement l'assert) est saute"

- name: "Onboarding — gardes hors ligne"
  hosts: webmethods
  gather_facts: false
  tasks:

    - name: "Nom d'equipe : une evasion de chemin doit etre refusee"
      block:
        - ansible.builtin.import_role:
            name: apim_team_onboard
            tasks_from: resolve.yml
          vars:
            apim_onb_providers_file: "tests/onboard/providers-bad-name.yml"
            apim_onb_team: "../insurance-demo"
        - ansible.builtin.fail:
            msg: "un nom d'equipe avec ../ a ete accepte"
      rescue:
        - ansible.builtin.assert:
            that: "'TEAM_NAME_INVALID' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              refus obtenu mais pas le bon :
              {{ ansible_failed_result.msg | default('(sans message)') }}
            success_msg: "OK — TEAM_NAME_INVALID"

    - name: "Derivations : une equipe legitime rend les 4 noms attendus"
      ansible.builtin.import_role:
        name: apim_team_onboard
        tasks_from: resolve.yml
      vars:
        apim_onb_providers_file: "providers.dev.yml"
        apim_onb_team: "banking-demo"

    - name: "Derivations : verifier chacune"
      ansible.builtin.assert:
        that:
          - "onb.user   == 'svc-banking-demo'"
          - "onb.group  == 'banking-demo-devs'"
          - "onb.kv_sub == 'deploy/banking-demo/wm-admin'"
          - "onb.policy == 'deploy-banking-demo'"
        fail_msg: "derivations inattendues : {{ onb }}"
        success_msg: "OK — svc-/-devs/deploy-…/deploy- derives"

    - name: "Convention : la derivation du CI sur ce chemin KV rend bien l'equipe"
      ansible.builtin.assert:
        that: "(onb.kv_sub.split('/'))[1] == onb.team"
        fail_msg: >-
          le gabarit KV ne place pas le nom d'equipe en 2e segment — le
          `cut -d/ -f2` du CI deriverait une valeur fausse.
        success_msg: "OK — gabarit KV et derivation du CI concordent"
