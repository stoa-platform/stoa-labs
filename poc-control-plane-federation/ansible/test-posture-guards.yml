---
# P2 (ADR-092) — la garde de POSTURE du rôle producteur, HORS LIGNE.
#
# Même boucle rapide que ansible/test-publish-guards.yml, et pour la même
# raison : posture.yml s'exécute AVANT les secrets et avant le premier appel à
# la gateway, donc elle doit se tester sans gateway, sans Vault et sans identité
# d'admin. Ce qu'elle consulte est un FICHIER (le registre central) et un
# BINAIRE (labctl) — rien d'autre.
#
# Entrées (extra-vars, comme la chaîne les pose) :
#   apim_ss_manifest                 le manifeste de publication à juger
#   apim_ss_team                     l'identité d'équipe POSÉE PAR LA CHAÎNE
#   apim_pub_classification_source   le registre central (vide = mode non arbitré)
- name: "P2 — garde de posture du producteur (hors ligne)"
  hosts: webmethods
  gather_facts: false
  tasks:
    - name: "Manifeste : liste blanche des clés (comme en tête de rôle)"
      ansible.builtin.import_role:
        name: apim_publish_api
        tasks_from: manifest-guard.yml

    - name: "Charger le manifeste (comme le fait resolve-env)"
      ansible.builtin.include_vars: "{{ pub_manifest_path }}"

    # L'identité vient de la CHAÎNE, pas du manifeste : c'est tout l'ancrage
    # anti-spoof de la recherche au registre. team-name.yml est ce qui l'établit
    # dans le rôle réel ; on l'importe plutôt que de la poser à la main, pour que
    # cette épreuve juge la MÊME résolution que la production.
    - name: "Team : quelle équipe, et d'où"
      ansible.builtin.import_role:
        name: apim_publish_api
        tasks_from: team-name.yml

    - name: "Posture : le registre central tranche"
      ansible.builtin.import_role:
        name: apim_publish_api
        tasks_from: posture.yml
