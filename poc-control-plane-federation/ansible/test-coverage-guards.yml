---
# P7 (ADR-097) — la garde de COUVERTURE du rôle producteur, HORS LIGNE.
#
# Même raison d'être que ansible/test-posture-guards.yml, et même contrainte :
# coverage.yml tourne juste après posture.yml, donc AVANT les secrets et avant
# le premier appel à la gateway. Elle ne lit que des variables — un registre
# central (fichier) et un binaire (labctl) via la posture qui la précède. Elle
# doit donc se juger sans gateway, sans Vault et sans identité d'admin.
#
# CE QU'ELLE PERMET DE MESURER SANS PUBLIER : qu'un bouquet dont une dimension
# n'est opposée par rien REFUSE (POSTURE_NON_DECLINABLE), qu'une dimension
# inconnue des deux tables REFUSE (POSTURE_NON_OPPOSEE, l'anti-dérive), et
# qu'une dimension seulement dégradée PASSE en le disant (POSTURE_DEGRADEE).
#
# Entrées (extra-vars, comme la chaîne les pose) :
#   apim_ss_manifest                 le manifeste de publication à juger
#   apim_ss_team                     l'identité d'équipe POSÉE PAR LA CHAÎNE
#   apim_pub_classification_source   le registre central (vide = mode non arbitré)
#   apim_pub_labctl_bin              l'autorité qui porte la table de vérité
- name: "P7 — garde de couverture du producteur (hors ligne)"
  hosts: webmethods
  gather_facts: false
  tasks:
    - name: "Manifeste : liste blanche des clés (comme en tête de rôle)"
      ansible.builtin.import_role:
        name: apim_publish_api
        tasks_from: manifest-guard.yml

    - name: "Charger le manifeste (comme le fait resolve-env)"
      ansible.builtin.include_vars: "{{ pub_manifest_path }}"

    - name: "Team : quelle équipe, et d'où"
      ansible.builtin.import_role:
        name: apim_publish_api
        tasks_from: team-name.yml

    - name: "Posture : le registre central tranche"
      ansible.builtin.import_role:
        name: apim_publish_api
        tasks_from: posture.yml

    # LA tâche sous test. Elle est importée APRÈS posture.yml — dans le même
    # ordre que main.yml — parce qu'elle consomme `pub_posture` : la jouer seule
    # ne prouverait rien de l'enchaînement réel.
    - name: "Couverture : ce que la chaîne oppose du bouquet"
      ansible.builtin.import_role:
        name: apim_publish_api
        tasks_from: coverage.yml
