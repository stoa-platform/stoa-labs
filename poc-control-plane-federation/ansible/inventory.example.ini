# inventory.example.ini — cible du play is-mtls-setup.yml
#
# --- PoC (conteneur trial, connexion docker) --------------------------------
# Les tâches uri/keytool tournent DANS le conteneur ; le restart (docker) est
# délégué au nœud de contrôle. Copier en inventory.ini et adapter.
[webmethods]
poc-webmethods-real ansible_connection=community.docker.docker ansible_user=root

[webmethods:vars]
# Restart IS = redémarrage du conteneur, exécuté sur le nœud de contrôle (localhost).
is_restart_host=localhost
is_restart_cmd=docker restart poc-webmethods-real

