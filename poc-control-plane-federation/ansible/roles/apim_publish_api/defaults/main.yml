---
# roles/apim_publish_api/defaults/main.yml
#
# Publication d'API (PRODUCTEUR, ADR-076/075) 100 % Ansible : import OpenAPI
# multipart + activate + scoping équipe + policies inbound (validation JWT/OAuth2
# au stage IAM). Spec vérifiée = Go labctl (publish.go / inboundauth.go / oauth2.go),
# mémoire wm-1015-rest-shapes. Le binaire Go reste parqué (contrainte de provenance).

# --- connexion admin, TLS, multi-env, auth (basic|oauth2), Vault --------------
# Défauts PARTAGÉS (namespace apim_ss_*) déplacés dans
# roles/apim_common/defaults/main.yml — importés par main/verify via
# import_role (exposés au play : surcharge inventaire/-e inchangée).

# --- IS-ADMIN : allow-list d'un port en Deny-by-Default (tasks/port-access.yml) ---
# Surface DIFFÉRENTE de l'API d'admin apigateway : c'est l'Access Mode du listener
# Integration Server (Security > Ports > Access Mode), piloté par le form WmRoot.
# Opt-in : n'agit QUE si apim_ss_port_manage=true (là où le port data-plane est en
# Deny-by-Default). Ne flippe JAMAIS le mode (le passage en Deny se fait à la
# création de l'env, côté client) — on ne fait qu'AJOUTER l'entrée de l'API.
apim_ss_port_manage: false
apim_ss_isadmin_base: "http://localhost:5555/WmRoot"   # client : proxifié ou direct
apim_ss_port_alias: "HTTPListener@5555"                # le listener data-plane concerné
apim_ss_port_listener_type: "Regular"
# Entrée à autoriser = référence de SERVICE IS (folder:service). Le port rejette les
# URLs data-plane ; le mapping API→service dépend du dispatch gateway du client.
apim_ss_port_allow_entry: ""

# --- ADR-079 : envs où la désactivation (update:true) reste tolérée ----------
# La coupure data-plane du deactivate→PUT→activate n'est acceptable qu'à
# l'AUTHORING (dev/onboarding). '' couvre le mono-env du lab. Hors de cette
# liste, update:true est REFUSÉ (fail-closed) — MAJ via apim_promote_api.
apim_pub_deactivate_envs: ["dev", ""]

# --- E1 : ce que le manifeste de l'équipe a le droit de déclarer (D5) --------
# include_vars charge le top-level du manifeste à la précédence 18 : toute clé
# non listée ici deviendrait une variable du rôle. Élargir cette liste est une
# décision d'architecture, pas un réglage.
apim_pub_manifest_allowed: ["apim_api"]

# --- épinglage du contract (Task 7) — INTÉGRITÉ, PAS une défense RCE --------
# CORRIGÉ (panel Fix round 2, après contre-épreuve réelle qui a réfuté
# l'affirmation précédente de ce commentaire) : ce pin garantit que la
# valeur FINALE de `apim_api.contract` est celle vérifiée par l'appelant —
# il n'empêche PAS l'exécution d'un Jinja injecté, puisque la tâche qui pose
# le pin (resolve-env.yml, `apim_api | combine({'contract': …})`) référence
# `apim_api` tout entier À L'INTÉRIEUR d'un bloc Jinja, et Ansible re-
# template alors paresseusement TOUTE chaîne du dict — y compris `contract`
# — AVANT que le combine() n'écrase la clé (prouvé : un `lookup('pipe', …)`
# injecté s'exécute PENDANT cette tâche, sur ansible 2.18 ET 2.19). La liste
# blanche ci-dessus ne borne QUE les clés TOP-LEVEL du manifeste, jamais leur
# CONTENU — la fermeture RÉELLE contre l'exécution est team-publish.sh §4
# (hors ligne, avant tout ansible-playbook) SEULE : une seconde couche
# côté rôle (manifest-guard.yml, scan texte brut) a été tentée puis
# RETIRÉE (panel Fix round 3, revert 3b14c4d) — contournable via les
# échappements YAML (hex/unicode/backslash-saut-de-ligne : "{{" absent du
# texte brut mais reconstitué par yaml.safe_load/include_vars) ET cassait
# un appelant légitime (clients/_example, forme historique
# "{{ playbook_dir }}/../apis/…", hors de son unique fragment blanchi).
# Voir resolve-env.yml pour le détail et le handoff. Un appelant qui
# applique un manifeste écrit par un TIERS
# non revu par la plateforme (team-publish.sh, Task 7) DOIT quand même poser
# cette variable — extra-var (précédence 22), bat le manifeste
# (include_vars, précédence 18), même mécanique que apim_ss_team pour
# apim_api.team (team-name.yml) — pour que la valeur FINALEMENT UTILISÉE
# (après le passage, dangereux ou non, par le templating) soit la bonne.
# Vide (défaut) = comportement INCHANGÉ pour les appelants historiques
# (Jenkinsfile.publish-api, clients/_example, demo-multienv.sh), où le
# manifeste est écrit/revu par la plateforme elle-même.
apim_ss_contract_pin: ""

# --- NOUVELLE VERSION (tasks/version.yml) ------------------------------------
# Miner une version dans la lignée d'une AUTRE équipe y dépose un actif (la
# version minée hérite des teams de sa base, mesuré le 2026-08-05) et y
# transporte ses abonnés (retainApplications). La garde exige que CHAQUE version
# de la lignée soit confirmée appartenir à l'équipe demandeuse ; ne pas savoir
# (feature Teams éteinte, `teams` illisible, aucune équipe demandeuse) vaut
# refus. `false` = on assume la capture cross-équipe : lab uniquement.
apim_pub_version_require_team_match: true

# Profils SYSTÈME (systemDefined) : ils ne sont PAS des équipes. `Administrators`
# est porté par TOUTE API (une API importée naît [Administrators, Default], et
# l'assignation d'équipe le conserve — mesuré) : passé en équipe demandeuse, il
# ferait confirmer l'appartenance de N'IMPORTE QUELLE lignée. Le rôle refuse
# donc d'office qu'une équipe demandeuse soit l'un de ces noms
# (TEAM_IS_SYSTEM_PROFILE). Relevés sur la gateway du lab le 2026-08-05.
apim_pub_system_profiles: ["Administrators", "Default", "API-Gateway-Providers"]

# Reprise d'un mint INTERROMPU entre la duplication et le push de la spec. Par
# défaut le rôle REFUSE (VERSION_INCOMPLETE) plutôt que d'activer une version
# qui porte encore la définition CLONÉE de sa base. `true` = geste explicite de
# reprise : re-import de la spec + relectures, puis activation. À ne PAS poser
# à demeure dans un pipeline — une version inactive peut aussi l'être parce
# qu'un humain l'a retirée du service.
apim_pub_resume_version: false

# --- E1 : une API sans équipe n'est cloisonnée pour personne (D3) ------------
# Mesuré le 2026-07-31 : une API laissée en team `Default` est lue (200) par
# n'importe quelle équipe. false = lab sans feature Teams, JAMAIS chez un client.
apim_pub_require_team: true

# --- approbateurs (projection depuis providers.<env>.yml) --------------------
# La LISTE fait autorite dans providers.<env>.yml ; ce champ n'en est qu'une
# PROJECTION, ecrite a chaque publish. Le developpement custom qui scrute les
# approbations en attente lit ce champ : ne pas le renommer sans lui. Ecrire
# des matricules ici ECRASE l'information de createur que le produit y logeait
# jusque-la ("Administrator" sur les API du lab) — convention du client, pas
# une decision de ce role.
# Les deux knobs epousent l'encodage constate sur la gateway 10.15 du lab :
# `owner` vit a apiResponse.api.owner (PAS apiResponse.teams, piege deja
# rencontre), c'est une CHAINE, absente de la liste GET /apis, presente en GET
# unitaire.
apim_pub_approvers_field: "owner"
apim_pub_approvers_join: ","      # mettre "" pour ecrire un TABLEAU
# Knob PROPRE a ce role (namespace apim_pub_*) plutot que de reutiliser
# apim_onb_providers_file (apim_team_onboard) : ce playbook (publish-api.yml)
# tourne seul, sans que ce role d'onboarding n'ait jamais pose cette variable —
# la reutiliser aurait echoue "variable is undefined" a chaque publish normal.
apim_pub_providers_file: "providers.dev.yml"

# --- l'API à publier --------------------------------------------------------
apim_api:
  name: "accounts-read"
  version: "1.0.0"
  contract: ""          # chemin du contrat OpenAPI (yaml|json) — REQUIS (absolu ou relatif au playbook)
  team: ""              # nom d'équipe (accessProfile) à assigner — optionnel (isolation ADR-076)
  # update: si l'API EXISTE déjà (même name+version), ré-importer le contrat
  # (le contrat devient la source de vérité). false = create-only (défaut sûr :
  # pas de re-déploiement surprise). true ⇒ deactivate → PUT /apis/{id} → activate
  # (le PUT est REFUSÉ sur une API active — 400 — d'où la désactivation ; brève
  # coupure du data-plane le temps de l'update). Bumper `version` reste l'alternative.
  # ⚠ ADR-079 : ce chemin est réservé à l'env d'AUTHORING (apim_pub_deactivate_envs) ;
  # partout ailleurs, MAJ = import d'archive 0-coupure (rôle apim_promote_api).
  update: false
  # Policies INBOUND (optionnel) : validation au stage IAM. Vide = API ouverte.
  #   issuer      : l'iss EXACT du token (épinglé côté émetteur)
  #   jwks_uri    : JWKS joignable DEPUIS la gateway (réseau interne, pas localhost)
  #   alias_name  : nom de l'alias auth-server côté gateway
  #   mode        : jwt (signature seule) | oauth2 (strict + audience + scope + strategy)
  #   audience/scope/client_id : requis en mode oauth2
  inbound: {}
