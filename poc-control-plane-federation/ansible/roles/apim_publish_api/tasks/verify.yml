---
# roles/apim_publish_api/tasks/verify.yml (--tags verify) — preuve fail-closed.
- name: "Env : résoudre l'API effective (identité invariante ⊕ per_env inbound)"
  ansible.builtin.import_tasks: resolve-env.yml
- name: "Team : quelle équipe, et d'où (MÊME résolution que la convergence)"
  # Le verify rejoue la même garde, dans le même fichier. Deux implémentations
  # d'accord entre elles ne prouveraient rien d'autre que leur accord.
  ansible.builtin.import_tasks: team-name.yml
- name: "Secrets : auth admin (Vault, fallback PoC)"
  ansible.builtin.import_role:
    name: apim_common
    tasks_from: secrets.yml
- name: "Verify — API '{{ apim_api.name }}' v{{ apim_api.version }}"
  module_defaults:
    ansible.builtin.uri: "{{ apim_ss_uri_defaults }}"
  block:
    - name: "Verify : relire le catalogue"
      ansible.builtin.uri: { url: "{{ apim_ss_api_base }}/apis" }
      register: v_apis
      changed_when: false
    - ansible.builtin.set_fact:
        v_api: >-
          {{ (v_apis.json.apiResponse | map(attribute='api')
              | selectattr('apiName','equalto', apim_api.name)
              | selectattr('apiVersion','equalto', apim_api.version) | list | first) | default({}) }}
    # E1 : le verify contrôle aussi le CLOISONNEMENT. En l'état il verdissait sur
    # une API en `Default` — c'est-à-dire lue (200) par n'importe quelle équipe.
    # Attester « publiée » sans contrôler la team, c'est certifier une propriété
    # qu'on ne vérifie pas : plus dangereux que pas de verify du tout, parce que
    # ça dispense de vérifier.
    - name: "Verify : relire l'API (teams vivent au niveau apiResponse)"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis/{{ v_api.id }}"
      register: v_api_get
      changed_when: false
      when: "v_api.id is defined"

    - name: "Verify : teams[] de l'API"
      ansible.builtin.set_fact:
        v_team_names: >-
          {{ (v_api_get.json.apiResponse | default({})).teams | default([])
             | map(attribute='name') | list }}
      when: "v_api.id is defined"

    # Rejoue la MÊME sonde qu'à l'apply (même fichier) : verify est self-contained
    # et ne doit rien supposer d'un run précédent — apim_teams_enabled doit être
    # reposé ici, pas hérité d'une éventuelle convergence dans le même play.
    - name: "Teams : sonde de la feature + table de verite"
      ansible.builtin.import_role:
        name: apim_common
        tasks_from: teams-feature.yml
      vars:
        apim_teams_required: "{{ apim_pub_require_team | default(true) }}"

    - name: "Verify : FAIL-CLOSED — l'API est publiée, ACTIVE et CLOISONNÉE"
      ansible.builtin.assert:
        that:
          - "v_api.id is defined"
          - "v_api.isActive | default(false)"
          - "pub_team_name | length == 0 or not (apim_teams_enabled | bool) or pub_team_name in (v_team_names | default([]))"
          - "pub_team_name | length == 0 or not (apim_teams_enabled | bool) or 'Default' not in (v_team_names | default([]))"
        fail_msg: >-
          PUBLISH_UNCONFIRMED : API {{ apim_api.name }} v{{ apim_api.version }} —
          absente, inactive, ou non cloisonnée (teams={{ v_team_names | default('n/a') }},
          attendu '{{ pub_team_name }}' présente et 'Default' absente). Une API en
          Default est lue par n'importe quelle équipe.
        success_msg: >-
          PUBLISH_CONFIRMED : {{ apim_api.name }} v{{ apim_api.version }} publiée,
          active et cloisonnée sur '{{ pub_team_name }}'
          (teams={{ v_team_names | default([]) }}, id={{ v_api.id | default('?') }}).

    # ----- inbound (optionnel) : la validation JWT/OAuth2 est-elle opposée ? -
    - name: "Verify : inbound — alias + règle IAM"
      when: "(apim_api.inbound | default({})) | length > 0"
      block:
        - ansible.builtin.uri: { url: "{{ apim_ss_api_base }}/alias" }
          register: v_aliases
          changed_when: false
        - ansible.builtin.uri: { url: "{{ apim_ss_api_base }}/policyActions" }
          register: v_pa
          changed_when: false
        - ansible.builtin.uri: { url: "{{ apim_ss_api_base }}/apis/{{ v_api.id }}" }
          register: v_apiget
          changed_when: false
        - ansible.builtin.uri: { url: "{{ apim_ss_api_base }}/policies/{{ (v_apiget.json.apiResponse.api.policies | default([])) | first }}" }
          register: v_polget
          changed_when: false
        - name: "Verify : FAIL-CLOSED — alias auth-server présent + règle IAM opposée au stage IAM"
          ansible.builtin.assert:
            that:
              - "(v_aliases.json.alias | default([]) | selectattr('name','equalto', apim_api.inbound.alias_name) | list) | length > 0"
              - >-
                ((v_polget.json.policy | default(v_polget.json)).policyEnforcements | default([])
                  | selectattr('stageKey','equalto','IAM') | map(attribute='enforcements') | flatten
                  | map(attribute='enforcementObjectId') | list) | length > 0
            fail_msg: "INBOUND_UNCONFIRMED : alias absent OU aucune règle IAM au stage IAM."
            success_msg: "INBOUND_CONFIRMED : alias '{{ apim_api.inbound.alias_name }}' + règle IAM ({{ apim_api.inbound.mode | default('jwt') }}) opposée."

        # --- oauth2 : strategy + scope mapping liés à l'API ---
        - name: "Verify(oauth2) : strategy + scope"
          when: "(apim_api.inbound.mode | default('jwt')) == 'oauth2'"
          block:
            - ansible.builtin.uri: { url: "{{ apim_ss_api_base }}/strategies" }
              register: v_strats
              changed_when: false
            - ansible.builtin.uri: { url: "{{ apim_ss_api_base }}/scopes" }
              register: v_scopes
              changed_when: false
            - name: "Verify(oauth2) : FAIL-CLOSED — strategy OAUTH2 + scope mapping liant l'API"
              ansible.builtin.assert:
                that:
                  - "(v_strats.json.strategies | default([]) | selectattr('name','equalto', 'apim-strat-' ~ apim_api.name) | list) | length > 0"
                  - >-
                    (v_scopes.json.scopes | default([])
                      | selectattr('scopeName','equalto',
                          apim_api.inbound.scope_mapping_name
                          | default(apim_api.name ~ ':' ~ apim_api.version))
                      | selectattr('apiScopes','defined')
                      | selectattr('apiScopes','contains', v_api.id) | list) | length > 0
                fail_msg: "OAUTH2_UNCONFIRMED : strategy absente OU scope non lié à l'API."
                success_msg: "OAUTH2_CONFIRMED : strategy apim-strat-{{ apim_api.name }} + scope mapping liant l'API (audience/scope opposés)."
