---
# roles/apim_publish_api/tasks/resolve-env.yml
#
# MULTI-ENV (ADR-078), pendant PRODUCTEUR de apim_selfservice_app/resolve-env.yml.
# L'identité de l'API (name/version/contract) est INVARIANTE ; ce qui CHANGE par env,
# c'est l'INBOUND — l'issuer/JWKS de l'IdP, l'audience et le client_id OAuth2 ne sont
# pas les mêmes en dev/rec/int/prod. Ces valeurs vivent sous `per_env`.
#
# API EFFECTIVE = racine (sans per_env)  ⊕(récursif)  per_env[apim_ss_env].
# FAIL-CLOSED : per_env déclaré ⇒ apim_ss_env fourni ET connu (sinon on publierait
# une API qui valide les jetons du MAUVAIS émetteur — pire qu'un refus).
#
# CHARGEMENT : passer un CHEMIN via `apim_ss_manifest` (include_vars, précédence 18),
# JAMAIS `-e @fichier` (extra-var 22 : il masquerait le set_fact de fusion).

- name: "Env : GARDE — le manifeste ne déclare que ce qu'il a le droit de déclarer"
  ansible.builtin.import_tasks: manifest-guard.yml

- name: "Env : charger le manifeste (chemin) — include_vars, pas extra-var"
  ansible.builtin.include_vars: "{{ pub_manifest_path }}"
  when: "(apim_ss_manifest | default('')) | length > 0"

- name: "Env : l'API porte-t-elle des surcharges par environnement ?"
  ansible.builtin.set_fact:
    apim_api_has_per_env: "{{ (apim_api.per_env | default({})) | length > 0 }}"

- name: "Env : FAIL-CLOSED — per_env présent ⇒ apim_ss_env déclaré ET connu"
  ansible.builtin.assert:
    that:
      - "(apim_ss_env | default('')) | length > 0"
      - "apim_ss_env in (apim_api.per_env | default({}))"
    fail_msg: >-
      ENV_UNDEFINED : l'API déclare per_env={{ (apim_api.per_env | default({})).keys() | list }}
      mais apim_ss_env='{{ apim_ss_env | default('') }}' est vide ou hors de cette liste.
      Refus de publier une inbound (issuer/audience) non définie pour cet environnement.
    success_msg: "ENV_OK : environnement '{{ apim_ss_env }}' déclaré pour l'API."
  when: apim_api_has_per_env

# Variables intermédiaires : un set_fact auto-référentiel serait résolu vers la
# valeur d'origine (fusion perdue).
- name: "Env : décomposer racine (sans per_env) et surcharge de l'env"
  ansible.builtin.set_fact:
    apim_api_base_m: "{{ apim_api | dict2items | rejectattr('key', 'equalto', 'per_env') | items2dict }}"
    apim_api_over_m: "{{ apim_api.per_env[apim_ss_env] }}"
  when: apim_api_has_per_env

- name: "Env : API EFFECTIVE = racine ⊕ per_env[{{ apim_ss_env }}]"
  ansible.builtin.set_fact:
    apim_api: "{{ apim_api_base_m | combine(apim_api_over_m, recursive=True) }}"
  when: apim_api_has_per_env

# ÉPINGLAGE (Task 7) : GARANTIT L'INTÉGRITÉ du contract final (la valeur
# résolue EST le chemin vérifié par l'appelant), CE N'EST PAS UNE DÉFENSE
# CONTRE L'EXÉCUTION D'UN JINJA INJECTÉ — affirmation FAUSSE tenue par une
# version précédente de ce commentaire, corrigée après contre-épreuve réelle
# (panel Fix round 2, ansible 2.18 ET 2.19, marqueur touch) : le combine()
# CI-DESSOUS référence `apim_api` (dict chargé par include_vars,
# précédence 18) À L'INTÉRIEUR d'un bloc Jinja — Ansible re-template
# PARESSEUSEMENT toute chaîne du dict qui contient elle-même {{ }} AU MOMENT
# de cette résolution, AVANT que le combine() n'écrase la clé. Un manifeste
# portant `contract: "{{ lookup('pipe','…') }}"` EXÉCUTE ce pipe PENDANT
# CETTE TÂCHE — le pin ne l'empêche pas, il écrase seulement la valeur
# APRÈS coup (la commande a déjà tourné). Vérifié : main.yml:51
# (`apim_api.contract | length > 0`) et le combine per_env ci-dessus
# détonent exactement pareil, pour la même raison — toute référence à
# `apim_api` dans un bloc Jinja est un point de détonation potentiel, pas
# seulement celui-ci.
#
# LA FERMETURE RÉELLE contre l'exécution : team-publish.sh §4
# (MANIFEST_CONTRACT_INVALIDE + MANIFEST_UNSAFE, HORS LIGNE, avant tout
# ansible-playbook — le manifeste n'atteint jamais ce rôle).
#
# PAS DE SECONDE COUCHE CÔTÉ RÔLE (retrait acté, panel Fix round 3, revert
# 3b14c4d) : une tentative de scan Jinja en texte brut dans manifest-
# guard.yml a été essayée puis retirée — elle ÉTAIT CONTOURNABLE (un
# manifeste échappe {{ }} en YAML — hex \x7b\x7b, unicode, backslash-saut-
# de-ligne — la sous-chaîne littérale "{{" n'apparaît alors JAMAIS dans le
# texte brut, mais `yaml.safe_load` — donc `include_vars` — la reconstitue
# intacte, prouvé par contre-épreuve touch-marker) ET CASSAIT un appelant
# LÉGITIME (`clients/_example/apis/accounts-read.publish.yml`, forme
# historique `{{ playbook_dir }}/../apis/<fichier>.openapi.yaml`, DIFFÉRENTE
# du seul fragment que ce scan blanchissait). Un rempart contournable qui
# casse en plus un appelant légitime nuit plus qu'il ne protège (faux
# sentiment de sécurité) — retiré plutôt que rafistolé sous pression de
# calendrier. HANDOFF pour un futur appelant qui appliquerait un manifeste
# NON REVU par la plateforme SANS passer par team-publish.sh §4 : il doit
# fournir SON PROPRE scan conscient du YAML (charger via `yaml.safe_load`
# et examiner les VALEURS RÉSOLUES, jamais grep le texte brut) — ce rôle
# n'en fournit pas.
#
# Posé ICI, APRÈS le combine per_env ci-dessus : un contract dissimulé sous
# `per_env.<env>.contract` écraserait sinon ce pin s'il était posé avant la
# fusion — le pin doit gagner sur TOUTE source du manifeste, racine ou
# per_env, POUR L'INTÉGRITÉ DE LA VALEUR FINALE. Vide (défaut) = no-op,
# comportement inchangé pour les appelants historiques (cf. defaults/
# main.yml, apim_ss_contract_pin).
- name: "Env : contract ÉPINGLÉ par l'appelant (pipeline), jamais celui du manifeste"
  ansible.builtin.set_fact:
    apim_api: "{{ apim_api | combine({'contract': apim_ss_contract_pin}) }}"
  when: "(apim_ss_contract_pin | default('')) | length > 0"

- name: "Env : inbound résolu pour '{{ apim_ss_env | default('(mono-env)') }}'"
  ansible.builtin.debug:
    msg: >-
      api={{ apim_api.name }} v{{ apim_api.version }} env={{ apim_ss_env | default('(mono-env)') }} :
      inbound.mode={{ (apim_api.inbound | default({})).mode | default('(aucun)') }},
      issuer={{ (apim_api.inbound | default({})).issuer | default('(n/a)') }}
