---
# roles/apim_publish_api/tasks/main.yml
# Publie une API : import OpenAPI (multipart) -> activate -> team -> inbound.
# Idempotent, read-back fail-closed. Shapes prouvées (Go + wm-1015-rest-shapes).

- name: "Env : résoudre l'API effective (identité invariante ⊕ per_env inbound)"
  ansible.builtin.import_tasks: resolve-env.yml

# AVANT les secrets et AVANT le premier appel : un refus d'équipe ne doit rien
# laisser derrière lui. Une API créée puis non assignée tombe en `Default`,
# c'est-à-dire lisible par toutes les équipes — exactement le défaut que le
# refus prétend empêcher.
- name: "Team : quelle équipe, et d'où (AVANT tout appel — un refus ne crée rien)"
  ansible.builtin.import_tasks: team-name.yml

- name: "Secrets : auth admin (Vault, fallback PoC)"
  ansible.builtin.import_role:
    name: apim_common
    tasks_from: secrets.yml

- name: "Publish — API '{{ apim_api.name }}' v{{ apim_api.version }}"
  module_defaults:
    ansible.builtin.uri: "{{ apim_ss_uri_defaults }}"
  block:

    # ===== 0a. État de la feature Teams (commande la garde de team.yml) =====
    # EN TÊTE de bloc, AVANT le premier appel gateway (l'import/l'activation de
    # l'API) — pas après (I2, revue finale 2026-08-04). L'en-tête de ce fichier
    # promet : « AVANT les secrets et AVANT le premier appel : un refus
    # d'équipe ne doit rien laisser derrière lui ». La contrainte « après
    # secrets.yml » reste tenue : secrets.yml est importé plus haut, HORS de ce
    # bloc (lignes 16-19). Même position que le 0a de apim_selfservice_app
    # (roles/apim_selfservice_app/tasks/main.yml) — les deux rôles consommateurs
    # de cette garde doivent se comporter pareil.
    #
    # Défaut avant ce correctif : la sonde était importée en 3b, APRÈS l'import
    # de l'API, son activation et l'écriture d'owner — donc APRÈS l'API créée
    # ET active. Avec la feature éteinte et apim_pub_require_team=true (valeurs
    # par défaut), l'API se retrouvait créée-active en team `Default` (lisible
    # par toutes les équipes) AVANT que le run n'échoue sur TEAMS_DISABLED :
    # exactement l'artefact que la garde existe pour empêcher.
    - name: "Teams : sonde de la feature + table de verite"
      ansible.builtin.import_role:
        name: apim_common
        tasks_from: teams-feature.yml
      vars:
        apim_teams_required: "{{ apim_pub_require_team | default(true) }}"

    - name: "Contrat : fail-closed si absent"
      ansible.builtin.assert:
        that: "apim_api.contract | length > 0"
        fail_msg: "apim_api.contract requis (chemin du contrat OpenAPI)."

    # ===== 1. Import (find-or-import) ========================================
    - name: "Import : l'API existe-t-elle déjà ?"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis"
      register: pub_apis
      changed_when: false

    - name: "Import : id si déjà publiée (name+version)"
      ansible.builtin.set_fact:
        apim_api_id: >-
          {{ (pub_apis.json.apiResponse | map(attribute='api')
              | selectattr('apiName', 'equalto', apim_api.name)
              | selectattr('apiVersion', 'equalto', apim_api.version)
              | map(attribute='id') | list | first) | default('') }}

    # ----- create-or-version : le NOM existe, la VERSION demandée non ---------
    # Extension ADDITIVE (P3-T6). Le nom inconnu de la gateway ⇒ version.yml ne
    # fait RIEN et l'import initial ci-dessous reprend la main, à l'octet près.
    # Le nom connu sous une AUTRE version ⇒ duplication native
    # POST /apis/{id}/versions (un POST /apis nu est refusé sur un nom déjà
    # pris), puis la spec du manifeste est poussée par le chemin re-import
    # existant — d'où `pub_version_minted` dans la condition du bloc suivant.
    - name: "Version : aucune version minée par ce run tant que version.yml ne le dit pas"
      ansible.builtin.set_fact:
        pub_version_minted: false

    # PAS de `when:` ici : un `when` porté par un import_tasks est recopié sur
    # CHAQUE tâche importée et RÉÉVALUÉ à chacune — or version.yml pose
    # `apim_api_id` en cours de route, ce qui ferait skipper en silence tout ce
    # qui suit (dont ses relectures-assert). Le fichier se garde lui-même sur
    # un fait FIGÉ avant la première écriture (`pub_ver_needed`).
    - name: "Version : create-or-version (le nom existe-t-il sous une autre version ?)"
      ansible.builtin.import_tasks: version.yml

    # ----- update-in-place : l'API existe ET on veut pousser le contrat --------
    # Prouvé live : PUT /apis/{id} multipart met à jour la définition, MAIS il est
    # REFUSÉ (400) sur une API ACTIVE → deactivate d'abord ; l'étape « Activate »
    # ci-dessous réactive (brève coupure data-plane le temps de l'update).
    # NB : apim_api['update'] et NON apim_api.update — en Jinja, l'accès par
    # attribut `.update` résout la MÉTHODE update() du dict (collision de nom),
    # jamais la clé du manifeste ⇒ le bloc serait toujours skippé. Idem pour toute
    # clé homonyme d'une méthode de dict (items/keys/values/get…).
    # `pub_version_minted` : une version MINÉE par ce run est vide de la spec du
    # manifeste (la duplication ne copie que la définition de la BASE) — elle
    # DOIT passer par ce chemin, que le manifeste demande `update` ou non.
    - name: "Update : ré-importer le contrat si l'API existe ET update demandé"
      when: >-
        apim_api_id | length > 0
        and ((apim_api['update'] | default(false) | bool)
             or (pub_version_minted | default(false) | bool))
      block:
        # ADR-079 : le cycle deactivate→PUT→activate COUPE le data-plane. Il
        # n'est toléré que sur l'env d'AUTHORING (dev, onboarding). Partout
        # ailleurs, la mise à jour passe par l'import d'archive 0-coupure
        # (rôle apim_promote_api) — fail-closed ici, pas de coupure surprise.
        # EXEMPTION ADR-079 pour une version MINÉE PAR CE RUN, et pour elle
        # seule : elle vient de naître inactive (M2, mesuré) et n'a donc JAMAIS
        # servi de trafic — le PUT qui suit ne peut couper aucun data-plane. La
        # publication d'une nouvelle version EST d'ailleurs la voie 0-coupure
        # que l'ADR-079 recommande ; l'interdire ici la rendrait impossible hors
        # dev. L'exemption ne repose pas sur ce booléen seul : la tâche d'après
        # RELIT l'état réel et refuse si le record n'est pas inactif.
        - name: "Update : FAIL-CLOSED — désactivation interdite hors env d'authoring (ADR-079)"
          ansible.builtin.assert:
            that: >-
              (pub_version_minted | default(false) | bool)
              or ((apim_ss_env | default('')) in apim_pub_deactivate_envs)
            fail_msg: >-
              UPDATE_FORBIDDEN : update:true exige deactivate→PUT→activate (coupure
              data-plane) — interdit sur '{{ apim_ss_env | default('(mono-env)') }}'
              (autorisé : {{ apim_pub_deactivate_envs }}). Pour mettre à jour sans
              coupure, promouvoir une archive : rôle apim_promote_api (ADR-079), ou
              publier une NOUVELLE version (le rôle la mine et y pousse la spec sans
              jamais désactiver l'existante).
        - name: "Update : état d'activation courant"
          ansible.builtin.uri:
            url: "{{ apim_ss_api_base }}/apis/{{ apim_api_id }}"
          register: pub_upd_get
          changed_when: false

        # La moitié NON FORGEABLE de l'exemption ci-dessus : l'état vient de la
        # gateway, pas d'une variable. Si une version fraîchement minée était
        # active, la désactiver couperait du trafic — refus.
        - name: "Update : FAIL-CLOSED — une version minée par ce run doit être INACTIVE"
          when: "pub_version_minted | default(false) | bool"
          ansible.builtin.assert:
            that: "not (pub_upd_get.json.apiResponse.api.isActive | default(false))"
            fail_msg: >-
              VERSION_MINTED_ACTIVE : la version '{{ apim_api.version }}' minée par ce
              run est relue ACTIVE avant le re-import de la spec. Mesuré le 2026-08-05 :
              une version naît INACTIVE. Poursuivre exigerait une désactivation, donc
              une coupure du data-plane que l'exemption ADR-079 de ce chemin ne couvre
              pas — refus.
        - name: "Update : désactiver (le PUT d'update est refusé sur une API active — 400)"
          ansible.builtin.uri:
            url: "{{ apim_ss_api_base }}/apis/{{ apim_api_id }}/deactivate"
            method: PUT
            status_code: [200, 201]
          when: "pub_upd_get.json.apiResponse.api.isActive | default(false)"
        - name: "Update : PUT /apis/{id} multipart (le contrat devient la source de vérité)"
          ansible.builtin.uri:
            url: "{{ apim_ss_api_base }}/apis/{{ apim_api_id }}"
            method: PUT
            body_format: form-multipart
            body:
              file:
                # `| string` OBLIGATOIRE : un contrat OpenAPI en JSON commence par
                # `{`, et le templating natif d'Ansible convertit alors la string
                # en dict, que le multipart ré-encode en repr Python (guillemets
                # SIMPLES) → JSON invalide → 400 « input openapi file is not valid ».
                # `| string` fige la valeur en texte (cf. import ci-dessous).
                content: "{{ lookup('file', apim_api.contract) | string }}"
                filename: "{{ apim_api.contract | basename }}"
                mime_type: "application/x-yaml"
              type: "openapi"
              apiName: "{{ apim_api.name }}"
              apiVersion: "{{ apim_api.version }}"
            status_code: [200, 201]

    - name: "Import : multipart POST /apis (le JSON from-scratch est cassé sur 10.15)"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis"
        method: POST
        body_format: form-multipart
        body:
          file:
            # `| string` OBLIGATOIRE — sinon un contrat OpenAPI en JSON (qui commence
            # par `{`) est coercé en dict par le templating natif d'Ansible puis
            # ré-encodé en repr Python (guillemets SIMPLES) dans le multipart →
            # « input openapi file is not valid » (400). Mesuré : YAML passait, JSON
            # échouait, à contenu ÉGAL (croisement contenu×extension + capture du
            # corps multipart). Un contrat JSON est parfaitement valide côté gateway
            # (curl le prouve) : le défaut était 100 % côté encodage Ansible.
            content: "{{ lookup('file', apim_api.contract) | string }}"
            filename: "{{ apim_api.contract | basename }}"
            mime_type: "application/x-yaml"
          type: "openapi"
          apiName: "{{ apim_api.name }}"
          apiVersion: "{{ apim_api.version }}"
        status_code: [200, 201]
      register: pub_import
      when: "apim_api_id | length == 0"

    - name: "Import : capturer l'id (création)"
      ansible.builtin.set_fact:
        apim_api_id: "{{ pub_import.json.apiResponse.api.id }}"
      when: "apim_api_id | length == 0"

    - name: "Import : fail-closed si pas d'id"
      ansible.builtin.assert:
        that: "apim_api_id | length > 0"
        fail_msg: "import KO : aucune id d'API."

    # ===== 2. Activate =======================================================
    - name: "Activate : relire l'état"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis/{{ apim_api_id }}"
      register: pub_api_get
      changed_when: false

    - name: "Activate : PUT /activate si inactive"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis/{{ apim_api_id }}/activate"
        method: PUT
        status_code: [200, 201]
      when: "not (pub_api_get.json.apiResponse.api.isActive | default(false))"

    - name: "Activate : read-back fail-closed — l'API est ACTIVE"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis/{{ apim_api_id }}"
      register: pub_api_after
      changed_when: false
      failed_when: "not (pub_api_after.json.apiResponse.api.isActive | default(false))"

    # ===== 2b. Approbateurs : projection de la liste dans owner (E1) ========
    # providers.<env>.yml fait autorite ; ecrit a CHAQUE publish (pas seulement
    # a l'onboarding) pour qu'une API ayant derive revienne dans le rang. Avant
    # le scoping team (pas de dependance entre les deux) ; apres l'activation,
    # comme l'API doit exister pour etre relue.
    - name: "Approbateurs : projeter la liste de l'equipe"
      ansible.builtin.import_tasks: approvers.yml
      when: "pub_team_name | length > 0"

    # ===== 3. Allow-list du port Deny-by-Default (IS-admin, opt-in) ==========
    - name: "Port : ajouter l'API à l'allow-list du listener (Deny-by-Default)"
      ansible.builtin.import_tasks: port-access.yml
      when: "apim_ss_port_manage | default(false) | bool"

    # ===== 4. Cloisonnement par équipe (E1 — plus optionnel) =================
    # L'obligation se règle en amont (team-name.yml / apim_pub_require_team) ET
    # sur l'état de la feature (apim_teams_enabled, sonde ci-dessus) : ici on
    # assigne dès qu'une équipe est résolue ET que la feature est active — plus
    # « toujours » depuis le défaut du 2026-08-03. Le `when` d'antan
    # (`apim_api.team | length > 0`) faisait dépendre la protection d'une clé
    # que l'appelant pouvait simplement omettre — or une API laissée en
    # `Default` est lue (200) par n'importe quelle équipe, mesuré le 2026-07-31.
    - name: "Team : cloisonnement par équipe"
      ansible.builtin.import_tasks: team.yml

    # ===== 4. Policies inbound (optionnel) ===================================
    - name: "Inbound : validation JWT/OAuth2 au stage IAM"
      ansible.builtin.import_tasks: inbound.yml
      when: "(apim_api.inbound | default({})) | length > 0"
