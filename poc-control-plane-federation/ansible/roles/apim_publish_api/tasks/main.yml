---
# roles/apim_publish_api/tasks/main.yml
# Publie une API : import OpenAPI (multipart) -> activate -> team -> inbound.
# Idempotent, read-back fail-closed. Shapes prouvées (Go + wm-1015-rest-shapes).

- name: "Env : résoudre l'API effective (identité invariante ⊕ per_env inbound)"
  ansible.builtin.import_tasks: resolve-env.yml

- name: "Secrets : auth admin (Vault, fallback PoC)"
  ansible.builtin.import_tasks: secrets.yml

- name: "Publish — API '{{ apim_api.name }}' v{{ apim_api.version }}"
  module_defaults:
    ansible.builtin.uri: "{{ apim_ss_uri_defaults }}"
  block:

    - name: "Contrat : fail-closed si absent"
      ansible.builtin.assert:
        that: "apim_api.contract | length > 0"
        fail_msg: "apim_api.contract requis (chemin du contrat OpenAPI)."

    # ===== 1. Import (find-or-import) ========================================
    - name: "Import : l'API existe-t-elle déjà ?"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis"
      register: pub_apis
      changed_when: false

    - name: "Import : id si déjà publiée (name+version)"
      ansible.builtin.set_fact:
        apim_api_id: >-
          {{ (pub_apis.json.apiResponse | map(attribute='api')
              | selectattr('apiName', 'equalto', apim_api.name)
              | selectattr('apiVersion', 'equalto', apim_api.version)
              | map(attribute='id') | list | first) | default('') }}

    # ----- update-in-place : l'API existe ET on veut pousser le contrat --------
    # Prouvé live : PUT /apis/{id} multipart met à jour la définition, MAIS il est
    # REFUSÉ (400) sur une API ACTIVE → deactivate d'abord ; l'étape « Activate »
    # ci-dessous réactive (brève coupure data-plane le temps de l'update).
    # NB : apim_api['update'] et NON apim_api.update — en Jinja, l'accès par
    # attribut `.update` résout la MÉTHODE update() du dict (collision de nom),
    # jamais la clé du manifeste ⇒ le bloc serait toujours skippé. Idem pour toute
    # clé homonyme d'une méthode de dict (items/keys/values/get…).
    - name: "Update : ré-importer le contrat si l'API existe ET update demandé"
      when: "apim_api_id | length > 0 and (apim_api['update'] | default(false) | bool)"
      block:
        - name: "Update : état d'activation courant"
          ansible.builtin.uri:
            url: "{{ apim_ss_api_base }}/apis/{{ apim_api_id }}"
          register: pub_upd_get
          changed_when: false
        - name: "Update : désactiver (le PUT d'update est refusé sur une API active — 400)"
          ansible.builtin.uri:
            url: "{{ apim_ss_api_base }}/apis/{{ apim_api_id }}/deactivate"
            method: PUT
            status_code: [200, 201]
          when: "pub_upd_get.json.apiResponse.api.isActive | default(false)"
        - name: "Update : PUT /apis/{id} multipart (le contrat devient la source de vérité)"
          ansible.builtin.uri:
            url: "{{ apim_ss_api_base }}/apis/{{ apim_api_id }}"
            method: PUT
            body_format: form-multipart
            body:
              file:
                # `| string` OBLIGATOIRE : un contrat OpenAPI en JSON commence par
                # `{`, et le templating natif d'Ansible convertit alors la string
                # en dict, que le multipart ré-encode en repr Python (guillemets
                # SIMPLES) → JSON invalide → 400 « input openapi file is not valid ».
                # `| string` fige la valeur en texte (cf. import ci-dessous).
                content: "{{ lookup('file', apim_api.contract) | string }}"
                filename: "{{ apim_api.contract | basename }}"
                mime_type: "application/x-yaml"
              type: "openapi"
              apiName: "{{ apim_api.name }}"
              apiVersion: "{{ apim_api.version }}"
            status_code: [200, 201]

    - name: "Import : multipart POST /apis (le JSON from-scratch est cassé sur 10.15)"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis"
        method: POST
        body_format: form-multipart
        body:
          file:
            # `| string` OBLIGATOIRE — sinon un contrat OpenAPI en JSON (qui commence
            # par `{`) est coercé en dict par le templating natif d'Ansible puis
            # ré-encodé en repr Python (guillemets SIMPLES) dans le multipart →
            # « input openapi file is not valid » (400). Mesuré : YAML passait, JSON
            # échouait, à contenu ÉGAL (croisement contenu×extension + capture du
            # corps multipart). Un contrat JSON est parfaitement valide côté gateway
            # (curl le prouve) : le défaut était 100 % côté encodage Ansible.
            content: "{{ lookup('file', apim_api.contract) | string }}"
            filename: "{{ apim_api.contract | basename }}"
            mime_type: "application/x-yaml"
          type: "openapi"
          apiName: "{{ apim_api.name }}"
          apiVersion: "{{ apim_api.version }}"
        status_code: [200, 201]
      register: pub_import
      when: "apim_api_id | length == 0"

    - name: "Import : capturer l'id (création)"
      ansible.builtin.set_fact:
        apim_api_id: "{{ pub_import.json.apiResponse.api.id }}"
      when: "apim_api_id | length == 0"

    - name: "Import : fail-closed si pas d'id"
      ansible.builtin.assert:
        that: "apim_api_id | length > 0"
        fail_msg: "import KO : aucune id d'API."

    # ===== 2. Activate =======================================================
    - name: "Activate : relire l'état"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis/{{ apim_api_id }}"
      register: pub_api_get
      changed_when: false

    - name: "Activate : PUT /activate si inactive"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis/{{ apim_api_id }}/activate"
        method: PUT
        status_code: [200, 201]
      when: "not (pub_api_get.json.apiResponse.api.isActive | default(false))"

    - name: "Activate : read-back fail-closed — l'API est ACTIVE"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis/{{ apim_api_id }}"
      register: pub_api_after
      changed_when: false
      failed_when: "not (pub_api_after.json.apiResponse.api.isActive | default(false))"

    # ===== 3. Allow-list du port Deny-by-Default (IS-admin, opt-in) ==========
    - name: "Port : ajouter l'API à l'allow-list du listener (Deny-by-Default)"
      ansible.builtin.import_tasks: port-access.yml
      when: "apim_ss_port_manage | default(false) | bool"

    # ===== 4. Scoping équipe (optionnel, ADR-076) ============================
    - name: "Team : scoping par équipe"
      ansible.builtin.import_tasks: team.yml
      when: "(apim_api.team | default('')) | length > 0"

    # ===== 4. Policies inbound (optionnel) ===================================
    - name: "Inbound : validation JWT/OAuth2 au stage IAM"
      ansible.builtin.import_tasks: inbound.yml
      when: "(apim_api.inbound | default({})) | length > 0"
