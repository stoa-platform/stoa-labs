---
# roles/apim_publish_api/tasks/inbound.yml
# Policies INBOUND (ADR-075) : validation au stage IAM de l'API.
#   mode jwt    -> alias auth-server (issuer+JWKS) + règle IAM open/jwtClaims (signature)
#   mode oauth2 -> alias + règle IAM strict/oAuth2Token (audience/scope/strategy = extension)
# Shapes prouvées (Go inboundauth.go/oauth2.go + wm-1015-rest-shapes) :
#   - POST /alias body NU {name, type:authServerAlias, authServerType:EXTERNAL,
#     localIntrospectionConfig{issuer, jwksuri}} ; jwksuri joignable DEPUIS la gateway.
#   - action evaluatePolicy (logicalConnector OR, allowAnonymous false, IdentificationRule).
#   - PUT /policies enveloppé {policy:{...}} pour attacher le stage IAM.
# Importé dans le block module_defaults de main.yml (auth héritée). Idempotent.

- name: "Inbound : fail-closed sur la config minimale"
  ansible.builtin.assert:
    that:
      - "(apim_api.inbound.issuer | default('')) | length > 0"
      - "(apim_api.inbound.jwks_uri | default('')) | length > 0"
      - "(apim_api.inbound.alias_name | default('')) | length > 0"
    fail_msg: "inbound requiert issuer + jwks_uri + alias_name."

- name: "Inbound : mode -> (applicationLookup, identificationType)"
  ansible.builtin.set_fact:
    in_lookup: "{{ 'strict' if (apim_api.inbound.mode | default('jwt')) == 'oauth2' else 'open' }}"
    in_type: "{{ 'oAuth2Token' if (apim_api.inbound.mode | default('jwt')) == 'oauth2' else 'jwtClaims' }}"

# ===== 1. Alias auth-server (find-or-create) ================================
- name: "Inbound : lister les alias"
  ansible.builtin.uri:
    url: "{{ apim_ss_api_base }}/alias"
  register: in_aliases
  changed_when: false

- name: "Inbound : id de l'alias '{{ apim_api.inbound.alias_name }}' si présent"
  ansible.builtin.set_fact:
    in_alias_id: >-
      {{ (in_aliases.json.alias | default([]) | selectattr('name', 'equalto', apim_api.inbound.alias_name)
          | map(attribute='id') | list | first) | default('') }}

- name: "Inbound : créer l'alias auth-server (body NU) si absent"
  ansible.builtin.uri:
    url: "{{ apim_ss_api_base }}/alias"
    method: POST
    body:
      name: "{{ apim_api.inbound.alias_name }}"
      description: "apim_publish_api inbound auth (JWKS local introspection)"
      type: "authServerAlias"
      authServerType: "EXTERNAL"
      localIntrospectionConfig:
        issuer: "{{ apim_api.inbound.issuer }}"
        jwksuri: "{{ apim_api.inbound.jwks_uri }}"
    status_code: [200, 201]
  register: in_alias_create
  when: "in_alias_id | length == 0"

# ===== 1b. OAuth2 : strategy + scope mapping (AVANT l'IAM : gate jamais mi-ouvert) ==
- name: "Inbound(oauth2) : config requise (audience + scope + client_id)"
  ansible.builtin.assert:
    that:
      - "(apim_api.inbound.audience | default('')) | length > 0"
      - "(apim_api.inbound.scope | default('')) | length > 0"
      - "(apim_api.inbound.client_id | default('')) | length > 0"
    fail_msg: "mode oauth2 requiert inbound.audience + inbound.scope + inbound.client_id."
  when: "(apim_api.inbound.mode | default('jwt')) == 'oauth2'"

- name: "Inbound(oauth2) : strategy OAUTH2 + scope mapping"
  when: "(apim_api.inbound.mode | default('jwt')) == 'oauth2'"
  block:
    # --- strategy (find-or-create par nom) : POST /strategies body NU ---
    - ansible.builtin.uri: { url: "{{ apim_ss_api_base }}/strategies" }
      register: in_strats
      changed_when: false
    - ansible.builtin.set_fact:
        in_strat_present: >-
          {{ (in_strats.json.strategies | default([])
              | selectattr('name', 'equalto', 'apim-strat-' ~ apim_api.name) | list) | length > 0 }}
    - name: "Inbound(oauth2) : créer la strategy OAUTH2 (alias+clientId+audience) si absente"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/strategies"
        method: POST
        body:
          name: "apim-strat-{{ apim_api.name }}"
          description: "apim_publish_api : strategy OAUTH2 (OIDC)"
          type: "OAUTH2"
          authServerAlias: "{{ apim_api.inbound.alias_name }}"
          clientId: "{{ apim_api.inbound.client_id }}"
          audience: "{{ apim_api.inbound.audience }}"
        status_code: [200, 201]
      when: "not in_strat_present"

    # --- scope mapping (find-or-create par scopeName, bind apiID) : POST /scopes NU ---
    # MODÈLE (ADR-079, aligné client) : UN scope-mapping PAR API+VERSION —
    # scopeName = "<api>:<version>". Le mapping appartient à l'API (1:1), suit
    # son GUID stable tout au long de la vie (aucun état partagé à re-fusionner
    # à la promotion). Le nom du mapping est ORGANISATIONNEL : le token matche
    # requiredAuthScopes.scopeName (scope externe), pas le nom du mapping.
    # L'ancien modèle PARTAGÉ ("<alias>:<scope>", apiScopes accumulés multi-API)
    # reste accessible via inbound.scope_mapping_name — déconseillé pour la
    # promotion (l'archive/l'apply d'une API écraserait la liste des autres).
    - ansible.builtin.uri: { url: "{{ apim_ss_api_base }}/scopes" }
      register: in_scopes
      changed_when: false
    - ansible.builtin.set_fact:
        in_scope_name: >-
          {{ apim_api.inbound.scope_mapping_name
             | default(apim_api.name ~ ':' ~ apim_api.version) }}
    - ansible.builtin.set_fact:
        in_scope: >-
          {{ (in_scopes.json.scopes | default([])
              | selectattr('scopeName', 'equalto', in_scope_name) | list | first) | default({}) }}
    - name: "Inbound(oauth2) : créer le scope mapping (requiredAuthScopes + apiScopes) si absent"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/scopes"
        method: POST
        body:
          scopeName: "{{ in_scope_name }}"
          scopeDescription: "apim_publish_api : scope mapping {{ apim_api.inbound.scope }}"
          audience: "{{ apim_api.inbound.audience }}"
          apiScopes: ["{{ apim_api_id }}"]
          requiredAuthScopes:
            - { authServerAlias: "{{ apim_api.inbound.alias_name }}", scopeName: "{{ apim_api.inbound.scope }}" }
        status_code: [200, 201]
      when: "in_scope.id is not defined"
    - name: "Inbound(oauth2) : lier l'API au scope existant (PUT) si pas déjà liée"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/scopes/{{ in_scope.id }}"
        method: PUT
        body: >-
          {{ in_scope | combine({
              'apiScopes': ((in_scope.apiScopes | default([])) + [apim_api_id]) | unique,
              'audience': apim_api.inbound.audience,
              'requiredAuthScopes': [{'authServerAlias': apim_api.inbound.alias_name, 'scopeName': apim_api.inbound.scope}]}) }}
        status_code: [200, 201]
      when:
        - "in_scope.id is defined"
        - "apim_api_id not in (in_scope.apiScopes | default([]))"

# ===== 2. Le stage IAM ne se règle PLUS ici =================================
# La création de l'action d'identification et son attachement au stage IAM
# vivaient dans ce fichier jusqu'au jalon P6 (ADR-096). Ils l'ont quitté pour
# `caller-identity.yml`, et ce n'est pas un rangement :
#
#   - la gateway n'accepte QU'UNE action au stage IAM (409 sur la seconde,
#     mesuré au spike P6 S7). Les dimensions du volet inbound et celle de la
#     posture (`ip-allowlist` d'une cellule `external`) doivent donc être
#     FUSIONNÉES dans un seul objet. Deux fichiers qui écrivent le même stage,
#     c'est le second qui gagne — et le contrôle perdu ne se voit nulle part ;
#   - la position change aussi : l'identification est désormais posée AVANT
#     l'activation (mesuré posable sur une API inactive et survivant à
#     l'activation, S8), donc une API gouvernée ne sert jamais un appel non
#     identifié, pas même pendant sa propre publication. Ici, elle l'aurait été
#     après ;
#   - et l'objet est PROPRE à l'API : détacher une action la DÉTRUIT (S6), ce
#     qui laisserait un UUID mort dans toutes les policies qui la partageaient.
#
# Ce fichier garde donc ce dont l'IAM a besoin pour mordre — l'alias, la
# strategy OAUTH2 et le scope mapping — et rien de plus. Un axe, un propriétaire.
