---
# roles/apim_selfservice_app/tasks/main.yml
#
# Convergence du PLAN ENTRANT self-service (ADR-078) : application + identifiers
# cert/IP + règle IAM AND(strict) qui les OPPOSE (ferme le fail-open « identifier
# écrit mais inerte »). Idempotent, read-modify-write. Shapes prouvées (Go/Python
# 9/9 + mémoire wm-1015-rest-shapes). Le plan SORTANT (injection clé backend
# P-callout) est en tasks/backend.yml (section suivante).

- name: "Env : résoudre le manifeste effectif (identité invariante ⊕ per_env)"
  ansible.builtin.import_tasks: resolve-env.yml

- name: "Secrets : creds admin gateway (Vault, fallback PoC)"
  ansible.builtin.import_role:
    name: apim_common
    tasks_from: secrets.yml

- name: "Converge — self-service application '{{ apim_ss_app.name }}'"
  module_defaults:
    ansible.builtin.uri: "{{ apim_ss_uri_defaults }}"
  block:

    # ===== 0a. État de la feature Teams (commande les gardes qui suivent) =====
    # AVANT team-name.yml : les deux gardes qui en dépendent (api-visibility.yml
    # ci-dessous, team.yml) doivent voir apim_teams_enabled déjà posé. Défaut
    # du 2026-08-03 corrigé ici : apim_ss_require_team=false ne désactivait
    # RIEN — seuls les assert de team-name.yml/verify.yml en dépendaient, le
    # travail (GET /accessProfiles, POST /assets/team) était commandé par
    # ss_team_name seul, que le job pose TOUJOURS.
    - name: "Teams : sonde de la feature + table de verite"
      ansible.builtin.import_role:
        name: apim_common
        tasks_from: teams-feature.yml
      vars:
        apim_teams_required: "{{ apim_ss_require_team | default(true) }}"

    # ===== 0. Équipe demandeuse (deux gardes en dépendent) ====================
    - name: "Team : résoudre l'équipe demandeuse (fail-closed)"
      ansible.builtin.import_tasks: team-name.yml

    # ===== 1. Résoudre l'API publiée =========================================
    - name: "API : lister"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis"
      register: ss_apis
      changed_when: false

    - name: "API : résoudre l'id de {{ apim_ss_app.api }} v{{ apim_ss_app.api_version }}"
      ansible.builtin.set_fact:
        ss_api_id: >-
          {{ (ss_apis.json.apiResponse | map(attribute='api')
              | selectattr('apiName', 'equalto', apim_ss_app.api)
              | selectattr('apiVersion', 'equalto', apim_ss_app.api_version)
              | map(attribute='id') | list | first) | default('') }}

    - name: "API : fail-closed si non publiée"
      ansible.builtin.assert:
        that: "ss_api_id | length > 0"
        fail_msg: "API {{ apim_ss_app.api }} v{{ apim_ss_app.api_version }} absente — la publier d'abord."

    # ===== 1b. GARDE DU REGISTER (« garde 3 ») ================================
    # AVANT de créer quoi que ce soit : l'équipe a-t-elle le droit de consommer
    # cette API ? La gateway, elle, accepterait l'association d'une API que
    # l'équipe ne voit même pas (brèche re-mesurée le 2026-07-31). Détail de
    # l'oracle retenu, et de pourquoi celui du design ne s'applique pas ici :
    # en-tête de api-visibility.yml.
    - name: "Register : l'API demandée est-elle consommable par l'équipe ?"
      ansible.builtin.import_tasks: api-visibility.yml
      when: "(ss_team_name | length > 0) and (apim_teams_enabled | bool)"

    # ===== 2. Application (find-or-create) ====================================
    - name: "App : lister"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/applications"
      register: ss_apps
      changed_when: false

    - name: "App : id si déjà présente"
      ansible.builtin.set_fact:
        ss_app_id: >-
          {{ (ss_apps.json.applications | selectattr('name', 'equalto', apim_ss_app.name)
              | map(attribute='id') | list | first) | default('') }}

    - name: "App : créer si absente"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/applications"
        method: POST
        body:
          name: "{{ apim_ss_app.name }}"
          description: "{{ apim_ss_app.description }}"
          contactEmails: "{{ apim_ss_app.contact_emails }}"
        status_code: [200, 201]
      register: ss_app_create
      when: "ss_app_id | length == 0"

    # PIÈGE JINJA : `a.id | default((a.applications|first).id)` est FAUX — Jinja
    # évalue l'ARGUMENT de default() EAGERLY, donc `.applications` est déréférencé
    # même quand `.id` existe → 'dict object' has no attribute 'applications' à
    # CHAQUE création. (Masqué jusqu'ici : les runs "prouvés" trouvaient l'app déjà
    # créée par le moteur Python, donc ces tâches étaient sautées.) L'expression
    # conditionnelle if/else, elle, est PARESSEUSE. Sur 10.15 le POST /applications
    # répond à plat (`.id`) ; l'enveloppe applications[] est gardée par prudence.
    - name: "App : capturer l'id (création ; enveloppe flat OU applications[])"
      ansible.builtin.set_fact:
        ss_app_id: >-
          {{ ss_app_create.json.id if ('id' in ss_app_create.json)
             else (ss_app_create.json.applications | first).id }}
      when: "ss_app_id | length == 0"

    - name: "App : fail-closed — un id d'application est obligatoire pour la suite"
      ansible.builtin.assert:
        that: "ss_app_id | length > 0"
        fail_msg: "APP_ID_UNRESOLVED : la gateway n'a pas renvoyé d'id exploitable à la création."

    # ===== 2b. Cloisonnement de l'application (E3 geste 1) ====================
    # AVANT toute autre écriture : une application créée par l'admin REST naît
    # en team `Default`, donc visible ET supprimable par toutes les équipes. La
    # fenêtre où elle l'est doit être la plus courte possible — et surtout, elle
    # ne doit jamais dépendre d'un geste laissé à l'appelant (cf. team.yml).
    - name: "Team : cloisonner l'application (assignation + relecture fail-closed)"
      ansible.builtin.import_tasks: team.yml

    # 204 EST un succès sur cet endpoint — contrat épinglé live par l'adapter Go
    # (labctl/internal/adapter/webmethods/consumer.go : « PUT
    # /applications/{id}/apis {"apiIDs":[...]} (200/201/204 are success) »), et
    # c'est ce que rend le mock. Le rôle ne tolérait que 200/201 : une gateway
    # qui répond 204 faisait échouer l'apply sur une association RÉUSSIE.
    - name: "App : associer à l'API (idempotent)"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/applications/{{ ss_app_id }}/apis"
        method: PUT
        body: { apiIDs: ["{{ ss_api_id }}"] }
        status_code: [200, 201, 204]

    # ===== 3. Identifiers ENTRANTS : certificat (asset) + plage IP ============
    # Chargement du PEM, gardes fail-closed et ré-encodage base64(DER) : une
    # définition UNIQUE, partagée avec verify (cf. l'en-tête de cert-der.yml —
    # pourquoi un parseur plutôt qu'un découpage, et pourquoi partagé).
    - name: "Cert : charger, valider et ré-encoder le certificat du manifeste"
      ansible.builtin.import_tasks: cert-der.yml
      when: "apim_ss_app.public_cert_ref | default('') | length > 0"

    # GARDE D'OPPOSABILITÉ. Un identifier est, par construction, MATCHÉ contre
    # les requêtes entrantes. Non listé dans `enforce`, `token` est inerte :
    # simple stockage, l'usage voulu ici. Listé, la clé BACKEND deviendrait un
    # credential D'ENTRÉE — quiconque la présente serait identifié comme
    # l'application. On ferme ce fail-open avant qu'il existe.
    - name: "Clé backend : fail-closed — `token` ne doit PAS être opposé"
      ansible.builtin.assert:
        that: "'token' not in (apim_ss_app.enforce | default([]))"
        fail_msg: >-
          BACKEND_KEY_ENFORCED : `token` est listé dans enforce alors que
          backend_key_ref est posé. La clé backend est du STOCKAGE, pas une
          identité entrante — l'opposer ferait de quiconque la présente
          l'application elle-même. Retirer `token` de enforce.
      when: "(apim_ss_app.backend_key_ref | default('')) | length > 0"

    - name: "Clé backend : lire la clé du backend dans Vault (jamais dans Git)"
      ansible.builtin.import_tasks: backend-key.yml
      when: "(apim_ss_app.backend_key_ref | default('')) | length > 0"

    - name: "IP : refuser le CIDR (la gateway le drop en silence — cf. README)"
      ansible.builtin.assert:
        that: "apim_ss_app.ip_allowlist | default([]) | select('search', '/') | list | length == 0"
        fail_msg: "CIDR non supporté (drop silencieux gateway) — utiliser une IP ou une plage A-B."

    - name: "IP : normaliser (single -> X-X ; A-B inchangé — visible UI + opposable)"
      ansible.builtin.set_fact:
        ss_ip_norm: "{{ apim_ss_app.ip_allowlist | default([]) | map('regex_replace', '^([^-]+)$', '\\1-\\1') | list }}"

    - name: "App : relire le record complet (read-modify-write)"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/applications/{{ ss_app_id }}"
      register: ss_app_get
      changed_when: false

    - name: "App : record (déballer l'enveloppe applications[])"
      ansible.builtin.set_fact:
        ss_app_rec: "{{ ss_app_get.json.applications | default([ss_app_get.json]) | first }}"

    # ===== 3b. Rotation du certificat (replace | overlap) =====================
    # L'identité d'un cert n'est PAS son nom mais sa VALEUR base64(DER) —
    # stockée verbatim, matchée octet-à-octet (ADR-078). La rotation raisonne
    # donc PAR VALEUR (dédup incluse : un double-run est un no-op), et le NOM
    # est recalculé déterministiquement depuis les dates des valeurs retenues :
    #   replace (défaut) : la valeur du manifeste REMPLACE la dimension
    #                      -> name "<app>-exp-YYYYMMDD" ;
    #   overlap          : la valeur du manifeste s'AJOUTE aux certs existants
    #                      ENCORE VALIDES (fenêtre de chevauchement pour que le
    #                      consommateur bascule sans coupure) ; les valeurs
    #                      EXPIRÉES sont purgées à chaque run
    #                      -> name "<app>-exp-YYYYMMDD+YYYYMMDD" (dates triées,
    #                      toujours greppable '-exp-[0-9]{8}').
    - name: "Cert : expiration du cert du manifeste -> garde + nom single"
      ansible.builtin.import_tasks: cert-expiry.yml
      when: "apim_ss_app.public_cert_ref | default('') | length > 0"

    - name: "Cert : rotation (replace | overlap)"
      when: "apim_ss_app.public_cert_ref | default('') | length > 0"
      block:
        - name: "Rotation : fail-closed sur le mode"
          ansible.builtin.assert:
            that: "(apim_ss_app.cert_rotation | default('replace')) in ['replace', 'overlap']"
            fail_msg: "cert_rotation='{{ apim_ss_app.cert_rotation | default('replace') }}' — attendu replace|overlap."

        - name: "Rotation : valeurs par défaut (replace)"
          ansible.builtin.set_fact:
            ss_cert_values: ["{{ ss_cert_der }}"]

        - name: "Rotation : overlap — conserver les certs existants valides"
          when: "(apim_ss_app.cert_rotation | default('replace')) == 'overlap'"
          block:
            - name: "Overlap : valeurs existantes de la dimension (hors le cert du manifeste)"
              ansible.builtin.set_fact:
                ss_cert_existing: >-
                  {{ ss_app_rec.identifiers | default([])
                     | selectattr('key', 'equalto', 'httpsCertificate')
                     | map(attribute='value') | flatten | unique
                     | difference([ss_cert_der]) }}

            # La valeur stockée EST le corps d'un PEM : re-wrap 64 colonnes et
            # openssl lit la date. Un value illisible (rc!=0) = PURGÉ (on ne
            # garde jamais une identité qu'on ne sait pas dater).
            - name: "Overlap : NotAfter de chaque cert existant"
              ansible.builtin.command:
                argv: ["openssl", "x509", "-noout", "-enddate"]
                stdin: "-----BEGIN CERTIFICATE-----\n{{ item | regex_replace('(.{64})', '\\1\n') }}\n-----END CERTIFICATE-----"
              register: ss_old_dates
              changed_when: false
              failed_when: false
              delegate_to: localhost
              loop: "{{ ss_cert_existing }}"
              loop_control: { label: "{{ item[:24] }}…" }

            - name: "Overlap : garder les valides, purger les expirés/illisibles"
              ansible.builtin.set_fact:
                ss_cert_kept: >-
                  {{ (ss_cert_kept | default([]))
                     + ([{'value': item.item, 'ymd': cert_ymd}] if cert_keep else []) }}
              vars:
                cert_raw: "{{ item.stdout | default('') | regex_replace('^notAfter=', '') | regex_replace(' +', ' ') | trim }}"
                cert_ymd: "{{ (cert_raw | to_datetime('%b %d %H:%M:%S %Y %Z')).strftime('%Y%m%d') if (item.rc | default(1)) == 0 else '' }}"
                cert_keep: >-
                  {{ (item.rc | default(1)) == 0
                     and ((cert_raw | to_datetime('%b %d %H:%M:%S %Y %Z')) - now(utc=true)).days >= 0 }}
              loop: "{{ ss_old_dates.results | default([]) }}"
              loop_control: { label: "{{ item.item[:24] }}…" }

            - name: "Overlap : valeurs finales + nom multi-dates"
              ansible.builtin.set_fact:
                ss_cert_values: "{{ (ss_cert_kept | default([]) | map(attribute='value') | list) + [ss_cert_der] }}"
                ss_cert_name: >-
                  {{ (apim_ss_app.cert_name_prefix | default(apim_ss_app.name, true)) ~ '-exp-'
                     ~ (((ss_cert_kept | default([]) | map(attribute='ymd') | list) + [ss_cert_expiry_ymd])
                        | unique | sort | join('+')) }}

            - name: "Overlap : purge journalisée"
              ansible.builtin.debug:
                msg: >-
                  overlap : {{ ss_cert_values | length }} cert(s) posés
                  ({{ (ss_cert_kept | default([])) | length }} conservé(s),
                  {{ (ss_cert_existing | length) - ((ss_cert_kept | default([])) | length) }} purgé(s) expirés/illisibles) ;
                  name={{ ss_cert_name }}

    - name: "Identifiers : ensemble désiré (cert + IP + clé backend)"
      ansible.builtin.set_fact:
        ss_desired_ids: >-
          {{ ([] if (apim_ss_app.public_cert_ref | default('') | length == 0)
                else [{'key': 'httpsCertificate', 'name': ss_cert_name, 'value': ss_cert_values}])
             + ([] if (ss_ip_norm | length == 0)
                else [{'key': 'ipAddressRange', 'name': 'ip-allowlist', 'value': ss_ip_norm}])
             + ([] if (apim_ss_app.backend_key_ref | default('') | length == 0)
                else [ss_backend_key_identifier]) }}
      no_log: true

    # On ne remplace QUE les dimensions RÉELLEMENT gérées par le manifeste
    # (celles présentes dans ss_desired_ids). Ainsi un identifier posé HORS du
    # manifeste — p. ex. un certificat posé par un admin dans l'UI quand
    # public_cert_ref est vide — est PRÉSERVÉ au re-run, au lieu d'être effacé.
    # (De même azp/openIdClaims.) NB : ce n'est PAS un palliatif d'un « upload
    # binaire » réservé à l'UI — ce mythe est réfuté (ADR-078 écart n°5) : l'UI
    # base64-encode le .cer en JS et PUT le MÊME base64(DER) que ce rôle.
    - name: "Identifiers : merge — remplacer SEULEMENT les dimensions du manifeste, garder le reste"
      when: "ss_desired_ids | length > 0"
      block:
        - ansible.builtin.set_fact:
            ss_managed_keys: "{{ ss_desired_ids | map(attribute='key') | list }}"
        - ansible.builtin.set_fact:
            ss_app_merged: >-
              {{ ss_app_rec | combine({'identifiers':
                  (ss_app_rec.identifiers | default([]) | rejectattr('key', 'in', ss_managed_keys) | list)
                  + ss_desired_ids }) }}
        - ansible.builtin.uri:
            url: "{{ apim_ss_api_base }}/applications/{{ ss_app_id }}"
            method: PUT
            body: "{{ ss_app_merged }}"
            status_code: [200, 201]

    # ===== 4. Règle IAM AND(strict) qui OPPOSE les identifiers ================
    # Ferme le fail-open : sans cette règle, les identifiers sont écrits mais inertes.
    - name: "IAM : liste des policyActions"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/policyActions"
      register: ss_actions
      changed_when: false

    # La gateway FORCE le nom « Identify & Authorize » sur toute action
    # evaluatePolicy (prouvé live) — donc idempotence par EMPREINTE de règles
    # (ensemble trié des identificationType), pas par nom. Match EXACT (pas
    # « contient ») pour ne pas happer une action AND d'un autre ensemble.
    - name: "IAM : id vide par défaut"
      ansible.builtin.set_fact:
        ss_iam_id: ""

    - name: "IAM : résoudre l'id existant par empreinte de règles (loop)"
      ansible.builtin.set_fact:
        ss_iam_id: "{{ item.id }}"
      loop: "{{ ss_actions.json.policyAction | default([]) }}"
      loop_control: { label: "{{ item.id }}" }
      when: >-
        (item.parameters | default([]) | selectattr('templateKey', 'equalto', 'IdentificationRule')
         | map(attribute='parameters') | flatten
         | selectattr('templateKey', 'equalto', 'identificationType')
         | map(attribute='values') | flatten | sort) == (apim_ss_app.enforce | sort)

    - name: "IAM : construire les IdentificationRules (une strict par dimension)"
      ansible.builtin.set_fact:
        ss_iam_rules: >-
          {{ (ss_iam_rules | default([])) + [{'templateKey': 'IdentificationRule', 'parameters':
              [{'templateKey': 'applicationLookup', 'values': ['strict']},
               {'templateKey': 'identificationType', 'values': [item]}]}] }}
      loop: "{{ apim_ss_app.enforce }}"

    - name: "IAM : créer l'action AND({{ apim_ss_app.enforce | join('+') }}) si absente"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/policyActions"
        method: POST
        body:
          policyAction:
            names: [{ value: "stoa-ss-identify-{{ apim_ss_app.api }}", locale: "en" }]
            templateKey: "evaluatePolicy"
            parameters: >-
              {{ [{'templateKey': 'logicalConnector', 'values': ['AND']},
                  {'templateKey': 'allowAnonymous', 'values': ['false']}] + ss_iam_rules }}
            active: true
        status_code: [200, 201]
      register: ss_iam_create
      when: "ss_iam_id | length == 0 and apim_ss_app.enforce | length > 0"

    - name: "IAM : capturer l'id (création)"
      ansible.builtin.set_fact:
        ss_iam_id: "{{ ss_iam_create.json.policyAction.id | default(ss_iam_create.json.id) }}"
      when: "ss_iam_id | length == 0 and apim_ss_app.enforce | length > 0"

    # ----- attacher l'action à la policy SERVICE de l'API (stage IAM) --------
    - name: "Policy : GET de l'API (pour ses policies)"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis/{{ ss_api_id }}"
      register: ss_api_get
      changed_when: false
      when: "apim_ss_app.enforce | length > 0"

    - name: "Policy : id de la policy SERVICE (enveloppe apiResponse.api, un dict)"
      ansible.builtin.set_fact:
        ss_pol_id: "{{ (ss_api_get.json.apiResponse.api.policies | default([])) | first | default('') }}"
      when: "apim_ss_app.enforce | length > 0"

    - name: "Policy : convergence du stage IAM"
      when: "apim_ss_app.enforce | length > 0 and ss_pol_id | length > 0"
      block:
        - ansible.builtin.uri:
            url: "{{ apim_ss_api_base }}/policies/{{ ss_pol_id }}"
          register: ss_pol_get
          changed_when: false

        - ansible.builtin.set_fact:
            ss_pol: "{{ ss_pol_get.json.policy | default(ss_pol_get.json) }}"

        - name: "Policy : le stage IAM référence-t-il déjà notre action ?"
          ansible.builtin.set_fact:
            ss_iam_attached: >-
              {{ ss_iam_id in (ss_pol.policyEnforcements | default([])
                  | selectattr('stageKey', 'equalto', 'IAM')
                  | map(attribute='enforcements') | flatten
                  | map(attribute='enforcementObjectId') | list) }}

        - name: "Policy : reconstruire (IAM = notre action) + PUT enveloppé — si pas attaché"
          when: "not ss_iam_attached"
          block:
            - ansible.builtin.set_fact:
                ss_pol_new: >-
                  {{ ss_pol | combine({'policyEnforcements':
                      [{'stageKey': 'IAM', 'enforcements': [{'enforcementObjectId': ss_iam_id, 'order': none}]}]
                      + (ss_pol.policyEnforcements | default([]) | rejectattr('stageKey', 'equalto', 'IAM') | list) }) }}
            - ansible.builtin.uri:
                url: "{{ apim_ss_api_base }}/policies/{{ ss_pol_id }}"
                method: PUT
                body: { policy: "{{ ss_pol_new }}" }
                status_code: [200, 201]

    # ===== 5. Plan SORTANT : injection de la clé backend (P-callout) ==========
    # `backend.inject: false` = une CUSTOM POLICY du client prend le relais de
    # l'injection. Ce n'est pas un confort : wM n'autorise QU'UNE action
    # customHttpHeaders par API (409 sinon), donc celle du rôle et celle du
    # client ne peuvent pas coexister. Défaut true — rien ne change pour
    # l'existant.
    - name: "Backend : injection de la clé backend (customHttpHeaders)"
      ansible.builtin.import_tasks: backend.yml
      when:
        - "(apim_ss_app.backend.header | default('')) | length > 0"
        - "apim_ss_app.backend.inject | default(true) | bool"

    - name: "Backend : injection DÉSACTIVÉE (custom policy du client)"
      ansible.builtin.debug:
        msg: >-
          BACKEND_INJECT_OFF : backend.inject=false — le rôle ne pose AUCUNE
          action customHttpHeaders sur {{ apim_ss_app.api }}. L'injection vers
          l'amont relève de la custom policy attachée à l'API.
      when: "not (apim_ss_app.backend.inject | default(true) | bool)"

    # ===== 6. AUTH OAuth2 de l'application (idp | internal) ====================
    # Deux modes (ADR-076 #5) : idp = client sur l'IdP, claim depuis Git ;
    # internal = gateway=AS, client généré, stocké dans Vault PAR ENV.
    - name: "Auth app : OAuth2 (idp claim-from-Git | internal client→Vault)"
      ansible.builtin.import_tasks: consumer-auth.yml
      when: "(apim_ss_app.auth is defined) and (apim_ss_app.auth | length > 0)"
