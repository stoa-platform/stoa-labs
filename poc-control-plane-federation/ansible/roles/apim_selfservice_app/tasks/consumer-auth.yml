---
# roles/apim_selfservice_app/tasks/consumer-auth.yml — AUTH OAuth2 de l'application
# consommatrice créée, DEUX modes (ADR-076 décision #5, ADR-078) :
#
#   idp       — l'IdP (Keycloak, un IdP partenaire…) est l'authorization server.
#               Le client EXISTE DÉJÀ sur l'IdP (créé en amont par l'IAM). Le
#               manifeste Git porte LA CLAIM qui identifie l'app (ex. azp) ; sur la
#               gateway on ne crée QUE l'application + son identifier openIdClaims
#               + une stratégie OAUTH2 pointant l'alias auth-server EXTERNE, avec
#               audience = celle de l'API. AUCUN secret à stocker (il vit sur l'IdP).
#
#   internal  — la gateway wM EST l'authorization server (alias LOCAL_IS `local`).
#               La stratégie porte un bloc `dcrConfig` et AUCUN `clientId` : c'est
#               la gateway qui GÉNÈRE le couple client_id/secret à la création
#               (« Generate credentials » de l'UI = dynamic client registration).
#               Le pipeline capture ce couple dans la RÉPONSE et le STOCKE dans
#               Vault, PAR ENV (multi-env : un client par (app, env)).
#
# POURQUOI dcrConfig ET PAS clientId (correction 2026-08-03). Le rôle envoyait
# `clientId: <nom de l'app>` en internal : c'est le chemin « le client existe
# déjà », celui de l'IdP externe. La gateway l'acceptait — donc une stratégie
# d'apparence saine — mais ne créait AUCUN client sur son AS local : pas de
# secret, donc rien d'utilisable pour un client_credentials. Le rôle réclamait
# alors le secret en extra-var (INTERNAL_CLIENT_SECRET_MANQUANT), c'est-à-dire
# qu'il faisait porter à l'ops un secret que la gateway est censée émettre.
#
# Shapes (swagger officiel du produit, SoftwareAG/webmethods-api-gateway,
# apigatewayservices/APIGatewayApplication.json — « API Gateway Application
# Management Service ») :
#   StrategyRequest.clientId : « should be provided when the dynamic client
#                               registration is NOT used to generate the
#                               credentials for the strategy » ⇒ EXCLUSIF de dcrConfig ;
#   dcrConfig (ENTRÉE)  : {clientType: PUBLIC|CONFIDENTIAL, allowedGrantTypes:
#                          [authorization_code|password|client_credentials|
#                           refresh_token|implicit], scopes: [...], clientName,
#                          applicationType, redirectUris, expirationInterval,
#                          refreshCount, pkceType} ;
#   clientRegistration (SORTIE, read-only) : {clientId, clientSecret, name, type:
#                          "confidential", tokenLifetime, tokenRefreshLimit,
#                          clScopes, clientCredentialsAllowed, ...}.
# CONFIRMÉ LIVE sur la 10.15 réelle (spike 2026-08-03, `apigateway-trial:10.15`,
# objets jetables supprimés, gateway restaurée) — et le live CORRIGE la doc :
#   - POST /strategies avec `dcrConfig` et SANS `clientId` -> 201, la gateway
#     émet `clientId` (un UUID) et le bloc `clientRegistration`
#     (`type:"confidential"`, `clientCredentialsAllowed:true`, `pkceType`,
#     `shell`, `clientVersion:"1.0"` qu'elle ajoute d'elle-même) ;
#   - le `clientSecret` y est MASQUÉ (32 astérisques), et il l'est AUSSI sur
#     `GET /strategies/{id}` — l'exemple en clair de la doc 11.0 est trompeur ;
#   - il n'est EN CLAIR que sur `GET /strategies` (la LISTE). C'est de là que le
#     §3 le capture ; s'y tromper écrit 32 astérisques dans Vault sous un apply
#     vert (le repli Vault reste en défense si un build masque aussi la liste).
# Rotation = PUT /strategies/{id}/refreshCredentials (« applicable only when
# dynamic client registration is enabled ») : mesuré, elle régénère le clientId
# **ET** le secret (ce n'est donc pas un simple renouvellement de secret).
# Délibérément NON jouée à chaque apply : un apply idempotent ne doit pas
# invalider — ni même renommer — le client que le consommateur utilise.
#
# Multi-env : l'IDENTITÉ de l'app (name/api) est invariante, mais la CLAIM peut
# CHANGER par env (name et/ou value — le client de l'IdP diffère souvent entre
# dev et prod), tout comme l'audience. Le rôle a déjà fusionné racine ⊕
# per_env[apim_ss_env] (recursive) : poser claim.value sous per_env suffit, le
# nom est hérité de la racine. La stratégie est nommée OAUTH2-<app>-<env> et
# CONVERGE (PUT) — un changement de claim/audience est réappliqué au re-run.
# PROUVÉ live : dev → clientId=consumer-dev, int → consumer-int.
#
# Entrées (du manifeste, bloc apim_ss_app.auth, résolu par resolve-env) :
#   apim_ss_auth_app_mode      : "idp" | "internal"  (défaut idp)
#   apim_ss_auth_server_alias  : nom de l'alias auth-server sur la gateway
#                                (idp: EXTERNAL préexistant ; internal: "local")
#   apim_ss_auth_claim         : {name, value} — la CLAIM d'identification (idp)
#                                (ex. {name: azp, value: "acme-consumer"})
#   apim_ss_auth_audience      : audience de la stratégie = audience de l'API
#   apim_ss_auth_vault_sub     : (internal) sous-chemin KV où écrire le client
#                                généré, TENANT+ENV-scopé (ex.
#                                deploy/banking-demo/apps/acme/dev/oauth-client)
#   apim_ss_auth_client_type   : (internal) CONFIDENTIAL (défaut) | PUBLIC
#   apim_ss_auth_grant_types   : (internal) défaut ["client_credentials"]
#   apim_ss_auth_scopes        : (internal) scopes de l'AS LOCAL à associer au
#                                client généré (noms tels que déclarés sur l'AS)
#   apim_ss_auth_token_lifetime / _refresh_count / _redirect_uris /
#   apim_ss_auth_application_type : (internal) réglages du client généré
# Produit : l'application porte l'identifier de claim + la stratégie ; en internal,
#           le client est écrit dans Vault (idempotent : ré-utilise l'existant).

# ===== Pré-vol : le mode est explicite, l'alias auth-server existe =============
- name: "Auth app : mode effectif + fail-closed sur un mode inconnu"
  ansible.builtin.set_fact:
    apim_ss_auth_mode_eff: "{{ (apim_ss_auth_app_mode | default('idp') | trim | lower) }}"

- name: "Auth app : fail-closed — mode ∈ {idp, internal}"
  ansible.builtin.assert:
    that: "apim_ss_auth_mode_eff in ['idp', 'internal']"
    fail_msg: "apim_ss_app.auth.mode='{{ apim_ss_auth_mode_eff }}' inconnu (attendu idp|internal)."
    success_msg: "Auth de l'application : mode {{ apim_ss_auth_mode_eff }}."

- name: "Auth app : résoudre l'alias auth-server (internal ⇒ 'local' d'office)"
  ansible.builtin.set_fact:
    apim_ss_auth_alias_eff: >-
      {{ 'local' if apim_ss_auth_mode_eff == 'internal'
         else (apim_ss_auth_server_alias | default('') | trim) }}

# AUDIENCE : OBLIGATOIRE EN idp, OPTIONNELLE EN internal (2026-08-03).
#
# Retour de terrain : en mode internal, le rôle réclamait une audience qui
# N'EXISTE PAS. L'assert n'avait pas de `when:` — il s'appliquait aux DEUX modes,
# alors que son message parle de « l'audience de l'API cible ». Or en internal
# l'AS est la gateway elle-même (alias `local`) : il n'y a aucune audience d'API
# à recopier. Le rôle bloquait donc l'apply sur une valeur sans référent.
#
# Et ce champ n'oppose rien sur ce runtime : EVIDENCE.md §Preuve 5 bis le mesure
# par deux leviers indépendants — la validation JWKS OFFLINE
# (localIntrospectionConfig) ne vérifie JAMAIS `aud`, et le chemin strict
# `oAuth2Token` impose scope + application mais PAS l'audience. Exiger une valeur
# que le runtime ignore, c'est affirmer un enforcement qui n'existe pas.
#
# On la garde obligatoire en idp : elle y est prouvée live (strategy
# KeycloakStoaLab / audience=demo-selfservice) et REDEVIENT opposable sur un
# build capable, via l'introspection RFC 7662 distante déjà câblée dans
# labctl/internal/adapter/webmethods/inboundauth.go. La garde y a donc un sens.
#
# Vide ⇒ la clé `audience` est OMISE du corps (et de l'entrée Vault), jamais
# envoyée à "" : on ne stocke pas une audience vide sur la gateway.
- name: "Auth app : audience effective (vide = omise du corps)"
  ansible.builtin.set_fact:
    apim_ss_auth_audience_eff: "{{ apim_ss_auth_audience | default('') | trim }}"

- name: "Auth app : l'alias auth-server existe sur la gateway (par NOM — portable multi-env, ADR-079)"
  ansible.builtin.uri:
    url: "{{ apim_ss_api_base }}/alias"
    method: GET
  register: apim_ss_alias_list
  delegate_to: localhost
  no_log: true

- name: "Auth app : fail-closed — alias auth-server introuvable"
  ansible.builtin.assert:
    that: >-
      apim_ss_auth_alias_eff | length > 0 and
      (apim_ss_alias_list.json.alias | default([])
        | selectattr('name', 'equalto', apim_ss_auth_alias_eff) | list | length) > 0
    fail_msg: >-
      Alias auth-server '{{ apim_ss_auth_alias_eff }}' absent de la gateway.
      idp : poser l'alias EXTERNAL par env (inbound.yml, même nom / valeurs locales).
      internal : 'local' (LOCAL_IS) est natif — la gateway est-elle bien l'AS ?
    success_msg: "Alias auth-server '{{ apim_ss_auth_alias_eff }}' présent."

# ===== 1. Stratégie OAUTH2 (idempotente, par API) — audience = celle de l'API ==
# Nommée de façon déterministe par (app, env) : re-run = converge, jamais de doublon.
- name: "Auth app : nom déterministe de la stratégie"
  ansible.builtin.set_fact:
    apim_ss_strat_name: "OAUTH2-{{ apim_ss_app.name }}-{{ apim_ss_env | default('mono') }}"

- name: "Auth app : la stratégie existe-t-elle déjà ?"
  ansible.builtin.import_tasks: strategies-list.yml

- name: "Auth app : id de la stratégie si présente"
  ansible.builtin.set_fact:
    apim_ss_strat_id: >-
      {{ (apim_ss_strategies | selectattr('name', 'equalto', apim_ss_strat_name)
          | map(attribute='id') | first) | default('') }}

- name: "Auth app [idp] : fail-closed — audience obligatoire (= audience de l'API)"
  ansible.builtin.assert:
    that: "apim_ss_auth_audience_eff | length > 0"
    fail_msg: >-
      AUDIENCE_MANQUANTE : mode idp — apim_ss_app.auth.audience doit valoir
      l'audience de l'API cible (elle est opposée par l'introspection distante
      sur un build capable). En mode internal, elle est OPTIONNELLE.
    success_msg: "Audience de la stratégie = {{ apim_ss_auth_audience_eff }} (celle de l'API)."
  when: "apim_ss_auth_mode_eff == 'idp'"

- name: "Auth app [internal] : audience omise (l'AS local n'en exige pas)"
  ansible.builtin.debug:
    msg: >-
      AUDIENCE_OMISE : mode internal sans audience — la clé n'est pas envoyée à
      la gateway (ni écrite dans Vault). Rien n'est perdu : ce runtime n'oppose
      pas `aud` (EVIDENCE.md §Preuve 5 bis).
  when:
    - "apim_ss_auth_mode_eff != 'idp'"
    - "apim_ss_auth_audience_eff | length == 0"

# ===== 1b. Mode INTERNAL — dcrConfig : ce que la gateway doit GÉNÉRER ==========
- name: "Auth app [internal] : gardes du client à générer (enums du produit)"
  when: "apim_ss_auth_mode_eff == 'internal'"
  block:
    - name: "Auth app [internal] : fail-closed — clientType ∈ {CONFIDENTIAL, PUBLIC}"
      ansible.builtin.assert:
        that: "(apim_ss_auth_client_type | default('CONFIDENTIAL') | upper) in ['CONFIDENTIAL', 'PUBLIC']"
        fail_msg: >-
          CLIENT_TYPE_INVALIDE : auth.client_type='{{ apim_ss_auth_client_type | default('') }}'
          — le produit n'accepte que CONFIDENTIAL ou PUBLIC. Un client_credentials
          exige un client CONFIDENTIEL (il s'authentifie par son secret).

    # Un PUBLIC + client_credentials est un non-sens OAuth2 : le grant repose
    # ENTIÈREMENT sur le secret, qu'un client public n'a par définition pas. La
    # gateway ne l'interdit pas forcément — nous, si : mieux vaut refuser que
    # produire un client dont personne ne pourra obtenir de token.
    - name: "Auth app [internal] : fail-closed — client_credentials exige CONFIDENTIAL"
      ansible.builtin.assert:
        that: >-
          not ('client_credentials' in (apim_ss_auth_grant_types | default([])))
          or (apim_ss_auth_client_type | default('CONFIDENTIAL') | upper) == 'CONFIDENTIAL'
        fail_msg: >-
          CLIENT_PUBLIC_AVEC_CLIENT_CREDENTIALS : le grant client_credentials
          s'authentifie PAR LE SECRET ; un client PUBLIC n'en a pas. Choisir
          client_type=CONFIDENTIAL, ou retirer client_credentials des grant_types.

    - name: "Auth app [internal] : fail-closed — grant types dans l'énumération"
      ansible.builtin.assert:
        that: >-
          (apim_ss_auth_grant_types | default([])) | length > 0 and
          ((apim_ss_auth_grant_types | default([]))
            | difference(['authorization_code', 'password', 'client_credentials',
                          'refresh_token', 'implicit']) | length) == 0
        fail_msg: >-
          GRANT_TYPES_INVALIDES : auth.grant_types={{ apim_ss_auth_grant_types | default([]) }}
          — l'énumération du produit est [authorization_code, password,
          client_credentials, refresh_token, implicit].

    # ── LE SCOPE VIENT DE L'AS LOCAL, PAS DU MANIFESTE (décision client) --------
    # L'AS local expose un scope PAR DÉFAUT : c'est celui auquel un client
    # self-service doit être lié. Le manifeste n'a donc rien à déclarer dans le
    # cas nominal — et surtout, rien à INVENTER : un scope nommé à la main qui
    # n'existe pas sur l'AS produirait un client lié à rien, sans le moindre
    # signal (le chemin strict `oAuth2Token` oppose scope ET application,
    # EVIDENCE.md §Preuve 5 : le refus n'arriverait qu'au runtime, chez le
    # consommateur). On lit donc la liste que l'AS publie et on s'y tient.
    #
    # L'alias auth-server porte ses scopes : `scopes: [{name, description}]`,
    # « List of scopes available in the authorization server » (schéma
    # AuthServerAlias, APIGatewayAlias.json). La liste /alias les rend en
    # général ; sinon on relit l'alias par son id.
    - name: "Auth app [internal] : record de l'alias auth-server local"
      ansible.builtin.set_fact:
        apim_ss_alias_rec: >-
          {{ (apim_ss_alias_list.json.alias | default([])
              | selectattr('name', 'equalto', apim_ss_auth_alias_eff) | list | first) | default({}) }}

    - name: "Auth app [internal] : relire l'alias complet si la liste ne porte pas ses scopes"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/alias/{{ apim_ss_alias_rec.id }}"
        method: GET
        status_code: [200, 404]
      register: apim_ss_alias_full
      changed_when: false
      delegate_to: localhost
      no_log: true
      when:
        - "'scopes' not in apim_ss_alias_rec"
        - "(apim_ss_alias_rec.id | default('')) | length > 0"

    - name: "Auth app [internal] : scopes publiés par l'AS local"
      ansible.builtin.set_fact:
        apim_ss_local_scopes: >-
          {{ (apim_ss_alias_rec.scopes
              | default(((apim_ss_alias_full.json | default({})).alias
                         | default(apim_ss_alias_full.json | default({}))).scopes | default([])))
             | map(attribute='name') | select('string') | list }}

    # « Le scope par défaut » : si l'AS n'en publie qu'un, il n'y a pas d'ambiguïté.
    # S'il en publie plusieurs, on ne DEVINE pas — on retient celui qui se nomme
    # comme un défaut ($sys:default, default-scope…), et si ce critère ne tranche
    # pas à un seul, on s'arrête en affichant la liste. Choisir en silence, c'est
    # décider à la place de l'exploitant quels droits porte le client.
    #
    # `[x] | flatten` UNE SECONDE FOIS, ici, au point de CONSOMMATION. La
    # normalisation de resolve-env.yml est un set_fact (précédence 19) : un
    # `-e apim_ss_auth_scopes=ScopeASLocal` passé par le CI (précédence 22,
    # les extra-vars gagnent TOUJOURS) la court-circuite en silence et rend la
    # chaîne intacte à l'assert ci-dessous. `_eff` est un nom interne que
    # personne ne passe en extra-var : le renormaliser ici couvre la variable
    # QUELLE QUE SOIT sa provenance — manifeste, group_vars ou ligne de commande.
    - name: "Auth app [internal] : scopes effectifs (manifeste > défaut de l'AS)"
      ansible.builtin.set_fact:
        apim_ss_auth_scopes_eff: >-
          {{ ([apim_ss_auth_scopes] | flatten) if ((apim_ss_auth_scopes | default([])) | length > 0)
             else (apim_ss_local_scopes if ((apim_ss_local_scopes | length) == 1)
                   else ((apim_ss_local_scopes | select('search', '(?i)default') | list)
                         if ((apim_ss_local_scopes | select('search', '(?i)default') | list) | length == 1)
                         else [])) }}

    - name: "Auth app [internal] : fail-closed — un scope déclaré doit EXISTER sur l'AS"
      ansible.builtin.assert:
        that: >-
          ((apim_ss_local_scopes | length) == 0)
          or (((apim_ss_auth_scopes_eff | default([])) | difference(apim_ss_local_scopes)) | length == 0)
        fail_msg: >-
          SCOPE_INCONNU : auth.scopes={{ apim_ss_auth_scopes_eff | default([]) }} — l'AS
          '{{ apim_ss_auth_alias_eff }}' ne publie que {{ apim_ss_local_scopes }}.
          Un client lié à un scope inexistant ne se voit refuser qu'au RUNTIME,
          chez le consommateur. Rien n'est créé.

    - name: "Auth app [internal] : fail-closed — plusieurs scopes, aucun défaut évident"
      ansible.builtin.assert:
        that: >-
          ((apim_ss_auth_scopes_eff | default([])) | length > 0)
          or ((apim_ss_local_scopes | length) == 0)
        fail_msg: >-
          SCOPE_AMBIGU : l'AS '{{ apim_ss_auth_alias_eff }}' publie
          {{ apim_ss_local_scopes }} et aucun ne s'impose comme le défaut. Déclarer
          celui qui convient dans le manifeste (auth.scopes: ["<nom>"]) plutôt que
          de laisser le rôle en choisir un. Rien n'est créé.

    - name: "Auth app [internal] : l'AS local ne publie AUCUN scope"
      ansible.builtin.debug:
        msg: >-
          SCOPES_ABSENTS : l'AS '{{ apim_ss_auth_alias_eff }}' ne publie aucun
          scope — le client généré n'en portera aucun. Le chemin strict
          oAuth2Token oppose scope + application : si l'API en exige un, le créer
          sur l'AS local d'abord.
      when: "(apim_ss_local_scopes | length) == 0"

    - name: "Auth app [internal] : scope retenu"
      ansible.builtin.debug:
        msg: >-
          SCOPE_{{ 'DECLARE' if ((apim_ss_auth_scopes | default([])) | length > 0) else 'PAR_DEFAUT' }} :
          {{ apim_ss_auth_scopes_eff | join(',') }}
          (publiés par l'AS : {{ apim_ss_local_scopes | join(',') or '(aucun)' }}).
      when: "(apim_ss_auth_scopes_eff | default([])) | length > 0"

    - name: "Auth app [internal] : dcrConfig désiré (le client que la gateway doit créer)"
      ansible.builtin.set_fact:
        apim_ss_dcr_config: >-
          {{ {'clientType': (apim_ss_auth_client_type | default('CONFIDENTIAL') | upper),
              'allowedGrantTypes': apim_ss_auth_grant_types,
              'clientName': apim_ss_strat_name,
              'expirationInterval': (apim_ss_auth_token_lifetime | default('3600') | string),
              'refreshCount': (apim_ss_auth_refresh_count | default('0') | string),
              'redirectUris': (apim_ss_auth_redirect_uris | default([]))}
             | combine({'scopes': apim_ss_auth_scopes_eff}
                       if ((apim_ss_auth_scopes_eff | default([])) | length > 0) else {})
             | combine({'applicationType': apim_ss_auth_application_type}
                       if ((apim_ss_auth_application_type | default('')) | length > 0) else {}) }}

# CONVERGE (pas create-only) : le corps désiré est calculé une fois ; POST si la
# stratégie est absente, PUT sinon. Sans le PUT, une claim/audience qui CHANGE
# (par env, ou en rotation de client) ne serait jamais appliquée sur un re-run —
# la stratégie garderait sa 1re valeur (bug réel : per-env claim ignorée).
- name: "Auth app : corps désiré de la stratégie (idp: clientId ; internal: dcrConfig)"
  ansible.builtin.set_fact:
    # Corps NU (pas d'enveloppe) — forme 10.15 vérifiée (OIDC-wm-admin-*).
    # `clientId` et `dcrConfig` sont EXCLUSIFS (cf. en-tête) : poser les deux,
    # c'est demander à la fois « ce client existe » et « crée-m'en un ».
    # `audience` est AJOUTÉE par combine, donc absente du corps quand elle est
    # vide — et non présente à "" (ce qui poserait une audience vide sur la
    # gateway, indistinguable d'une audience volontaire).
    apim_ss_strat_body: >-
      {{ {'type': 'OAUTH2',
          'authServerAlias': apim_ss_auth_alias_eff,
          'name': apim_ss_strat_name,
          'description': 'apim_selfservice_app: OAUTH2 (' ~ apim_ss_auth_mode_eff ~ ') pour ' ~ apim_ss_app.name}
         | combine({'clientId': (apim_ss_auth_claim.value | default(apim_ss_app.name))}
                   if apim_ss_auth_mode_eff == 'idp'
                   else {'dcrConfig': apim_ss_dcr_config})
         | combine({'audience': apim_ss_auth_audience_eff}
                   if (apim_ss_auth_audience_eff | length > 0) else {}) }}
  no_log: true

- name: "Auth app : CRÉER la stratégie si absente (POST — internal : la gateway émet le client)"
  ansible.builtin.uri:
    url: "{{ apim_ss_api_base }}/strategies"
    method: POST
    body_format: json
    body: "{{ apim_ss_strat_body }}"
    status_code: [200, 201]
  register: apim_ss_strat_create
  delegate_to: localhost
  no_log: true
  when: "apim_ss_strat_id | length == 0"
  changed_when: true

- name: "Auth app : capturer l'id à la création"
  ansible.builtin.set_fact:
    apim_ss_strat_id: >-
      {{ apim_ss_strat_create.json.strategy.id | default(apim_ss_strat_create.json.id | default('')) }}
  no_log: true
  when: "apim_ss_strat_id | length == 0"

# CONVERGENCE, DEUX RÉGIMES.
#   idp      : PUT du corps NU (comportement prouvé live, inchangé).
#   internal : read-modify-write. Un PUT du corps nu remplacerait l'objet
#              STOCKÉ — donc effacerait `clientRegistration` (le client généré) et
#              son `clientId`, c'est-à-dire le credential que le consommateur
#              utilise. On relit, on ne remplace QUE ce que le manifeste gouverne
#              (description/audience/dcrConfig), et on n'écrit QUE si ça diffère :
#              convergé = aucun PUT = aucun risque sur le client.
- name: "Auth app [idp] : CONVERGER la stratégie existante (PUT) — claim/audience à jour"
  ansible.builtin.uri:
    url: "{{ apim_ss_api_base }}/strategies/{{ apim_ss_strat_id }}"
    method: PUT
    body_format: json
    body: "{{ apim_ss_strat_body | combine({'id': apim_ss_strat_id}) }}"
    status_code: [200, 201]
  delegate_to: localhost
  no_log: true
  when:
    - "apim_ss_auth_mode_eff == 'idp'"
    - "apim_ss_strat_id | length > 0 and apim_ss_strat_create is skipped"

- name: "Auth app [internal] : CONVERGER sans détruire le client généré (read-modify-write)"
  when:
    - "apim_ss_auth_mode_eff == 'internal'"
    - "apim_ss_strat_id | length > 0 and apim_ss_strat_create is skipped"
  block:
    - name: "Auth app [internal] : relire la stratégie stockée"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/strategies/{{ apim_ss_strat_id }}"
        method: GET
      register: apim_ss_strat_get
      changed_when: false
      delegate_to: localhost
      no_log: true

    - name: "Auth app [internal] : déballer l'enveloppe {strategy:{…}}"
      ansible.builtin.set_fact:
        apim_ss_strat_live: "{{ apim_ss_strat_get.json.strategy | default(apim_ss_strat_get.json) }}"
      no_log: true

    # Le dcrConfig RELU porte des champs que la gateway ajoute (clientName
    # normalisé, clientVersion…) : on compare donc SOUS-ENSEMBLE désiré ⊆ live,
    # jamais l'égalité — sinon chaque run croirait devoir écrire.
    - name: "Auth app [internal] : le désiré est-il déjà en place ?"
      ansible.builtin.set_fact:
        apim_ss_dcr_converged: >-
          {{ (apim_ss_strat_live.dcrConfig | default({})
              | combine(apim_ss_dcr_config)) == (apim_ss_strat_live.dcrConfig | default({}))
             and (apim_ss_strat_live.audience | default('')) == apim_ss_auth_audience_eff }}

    - name: "Auth app [internal] : PUT du record fusionné (client généré PRÉSERVÉ)"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/strategies/{{ apim_ss_strat_id }}"
        method: PUT
        body_format: json
        body: >-
          {{ apim_ss_strat_live
             | combine({'id': apim_ss_strat_id,
                        'name': apim_ss_strat_name,
                        'dcrConfig': (apim_ss_strat_live.dcrConfig | default({}) | combine(apim_ss_dcr_config))})
             | combine({'audience': apim_ss_auth_audience_eff}
                       if (apim_ss_auth_audience_eff | length > 0) else {}) }}
        status_code: [200, 201]
      delegate_to: localhost
      no_log: true
      when: "not apim_ss_dcr_converged"

    - name: "Auth app [internal] : verdict de convergence"
      ansible.builtin.debug:
        msg: >-
          DCR_{{ 'CONVERGED' if apim_ss_dcr_converged else 'UPDATED' }} :
          stratégie {{ apim_ss_strat_name }} — dcrConfig
          {{ 'déjà conforme (aucun PUT)' if apim_ss_dcr_converged else 'réappliqué (client généré préservé)' }}.

- name: "Auth app : fail-closed — un id de stratégie est obligatoire"
  ansible.builtin.assert:
    that: "apim_ss_strat_id | length > 0"
    fail_msg: "Stratégie OAUTH2 {{ apim_ss_strat_name }} ni trouvée ni créée."

# ===== 2. Mode IDP — la CLAIM (Git) devient l'identifier de l'application ======
# Le client EXISTE sur l'IdP ; ici on n'ADDRESSE l'app qu'à cette claim. C'est
# openIdClaims/<name> = <valeur> (opposé au stage IAM par la stratégie ci-dessus).
- name: "Auth app [idp] : fail-closed — la claim d'identification est fournie"
  ansible.builtin.assert:
    that:
      - "apim_ss_auth_claim.name | default('') | trim | length > 0"
      - "apim_ss_auth_claim.value | default('') | trim | length > 0"
    fail_msg: >-
      Mode idp : apim_ss_app.auth.claim {name,value} est obligatoire — c'est ELLE
      qui identifie l'application (le client est créé EN AMONT sur l'IdP).
    success_msg: "Claim d'identification : {{ apim_ss_auth_claim.name }}={{ apim_ss_auth_claim.value }}."
  when: "apim_ss_auth_mode_eff == 'idp'"

- name: "Auth app [idp] : identifier openIdClaims = la claim du manifeste"
  ansible.builtin.set_fact:
    apim_ss_auth_identifier:
      key: "openIdClaims"
      name: "{{ apim_ss_auth_claim.name }}"
      value: ["{{ apim_ss_auth_claim.value }}"]
  when: "apim_ss_auth_mode_eff == 'idp'"

# ===== 2bis. LIER sur l'application : identifier de claim (idp) + authStrategyIds =
# Read-modify-write auto-suffisant (même patron que le self-proxy) : on NE touche
# QUE la dimension openIdClaims (préserve cert/IP posés en section 3) et on AJOUTE
# la stratégie à authStrategyIds sans écraser une éventuelle stratégie existante.
- name: "Auth app : relire le record de l'application (read-modify-write)"
  ansible.builtin.uri:
    url: "{{ apim_ss_api_base }}/applications/{{ ss_app_id }}"
    method: GET
  register: apim_ss_auth_reread
  delegate_to: localhost
  no_log: true

- name: "Auth app : déballer le record (enveloppe applications[] OU plat)"
  ansible.builtin.set_fact:
    apim_ss_auth_rec: >-
      {{ (apim_ss_auth_reread.json.applications | default([apim_ss_auth_reread.json]))[0] }}
  no_log: true

- name: "Auth app : record muté (identifier claim si idp + strategie dans authStrategyIds)"
  ansible.builtin.set_fact:
    apim_ss_auth_rec_new: >-
      {{ apim_ss_auth_rec
         | combine({'identifiers':
             ((apim_ss_auth_rec.identifiers | default([]) | rejectattr('key', 'equalto', 'openIdClaims') | list)
              + ([apim_ss_auth_identifier] if apim_ss_auth_mode_eff == 'idp' else []))})
         | combine({'authStrategyIds':
             ((apim_ss_auth_rec.authStrategyIds | default([])) + [apim_ss_strat_id]) | unique}) }}
  no_log: true

# LECTURE AVANT ÉCRITURE — même défaut, et même correctif, que le PUT des
# identifiers de main.yml : ce PUT était INCONDITIONNEL, donc à chaque apply d'un
# manifeste portant `auth:` la gateway détruisait et recréait les identifiers de
# l'application (UUID neuf, `lastupdated` bumpé) pour un état déjà conforme.
# Comparaison sur les seuls champs gouvernés ici — la claim `openIdClaims` (mode
# idp) et l'appartenance de la stratégie à `authStrategyIds` — car le record relu
# porte un `id` par identifier que l'ensemble désiré n'a pas : comparer les dicts
# entiers diffèrerait toujours et la garde ne garderait rien.
- name: "Auth app : claim openIdClaims déjà posée telle quelle ? (mode idp)"
  ansible.builtin.set_fact:
    apim_ss_auth_claim_converged: >-
      {{ (apim_ss_auth_rec.identifiers | default([])
          | selectattr('key', 'equalto', 'openIdClaims')
          | selectattr('name', 'equalto', apim_ss_auth_identifier.name)
          | map(attribute='value') | flatten | list | sort)
         == (apim_ss_auth_identifier.value | sort) }}
  when: "apim_ss_auth_mode_eff == 'idp'"
  no_log: true

- name: "Auth app : le record porte-t-il déjà l'état désiré ?"
  ansible.builtin.set_fact:
    apim_ss_auth_converged: >-
      {{ (apim_ss_strat_id in (apim_ss_auth_rec.authStrategyIds | default([])))
         and (apim_ss_auth_mode_eff != 'idp' or (apim_ss_auth_claim_converged | default(false))) }}

- name: "Auth app : PUT du record muté (claim opposable + stratégie liée) — si différent"
  ansible.builtin.uri:
    url: "{{ apim_ss_api_base }}/applications/{{ ss_app_id }}"
    method: PUT
    body: "{{ apim_ss_auth_rec_new }}"
    status_code: [200, 201]
  delegate_to: localhost
  no_log: true
  when: "not apim_ss_auth_converged"
  changed_when: true

- name: "Auth app : record déjà conforme — aucune écriture"
  ansible.builtin.debug:
    msg: >-
      AUTH_RECORD_CONVERGED : stratégie déjà liée{{ ' et claim openIdClaims déjà posée'
      if apim_ss_auth_mode_eff == 'idp' else '' }} — PUT non émis, UUID des
      identifiers préservés.
  when: "apim_ss_auth_converged"

# ===== 3. Mode INTERNAL — la gateway génère le client, on le STOCKE dans Vault ==
# La stratégie sur l'AS `local` est posée ; le client OAuth2 (client_id/secret) est
# émis par le serveur d'autorisation INTERNE de la gateway. On le capture et on
# l'écrit dans Vault au chemin TENANT+ENV-scopé (multi-env : un secret par env).
- name: "Auth app [internal] : fail-closed — sous-chemin Vault du client fourni"
  ansible.builtin.assert:
    that: "apim_ss_auth_vault_sub | default('') | trim | length > 0"
    fail_msg: >-
      Mode internal : apim_ss_app.auth.vault_sub est obligatoire (où écrire le
      client généré, ex. deploy/<tenant>/apps/<app>/<env>/oauth-client).
  when: "apim_ss_auth_mode_eff == 'internal'"

# Le client interne vient, PAR ORDRE DE PRIORITÉ :
#   (a) de la RÉPONSE du POST /strategies — le cas nominal depuis le câblage du
#       dcrConfig : `strategy.clientId` + `strategy.clientRegistration.clientSecret`,
#       tels que la gateway vient de les émettre ;
#   (b) de la RELECTURE de la stratégie (re-run : la stratégie existe déjà) ;
#   (c) d'extra-vars apim_ss_internal_client_id/_secret — échappatoire conservée
#       pour un build où le DCR ne serait pas disponible, ou pour reprendre un
#       client émis hors bande. Elles PRIMENT si elles sont fournies.
#
# ⚠ LE SECRET N'EST LISIBLE QUE DANS LA *LISTE* — mesuré LIVE sur la 10.15 réelle
# (spike 2026-08-03, `softwareag/apigateway-trial:10.15`). Trois surfaces, TROIS
# comportements, et c'est la surface la moins évidente qui est la bonne :
#
#   POST /strategies       -> clientRegistration.clientSecret = "********…" (32 *)
#   GET  /strategies/{id}  -> clientRegistration.clientSecret = "********…" (32 *)
#   GET  /strategies       -> clientRegistration.clientSecret = EN CLAIR
#                             (mesuré : "64535607-fc92-436c-8bb7-664566ee9407")
#
# C'est une incohérence de sérialisation du produit, de la même famille que
# l'enveloppe (liste NUE vs single ENVELOPPÉ, cf. strategies-list.yml). Prendre
# le secret dans la réponse de création — ce que la doc 11.0 laisse croire, son
# exemple le montrant en clair — écrirait 32 ASTÉRISQUES dans Vault : un
# credential inutilisable, sous un apply vert. C'est le piège que ce bloc ferme.
#
# La neutralisation `^\*+$` reste en défense : si un build masque AUSSI la liste,
# on tombe sur le repli Vault plutôt que de poser un faux secret.
- name: "Auth app [internal] : capture du client émis (par la LISTE — seule surface en clair)"
  when: "apim_ss_auth_mode_eff == 'internal'"
  block:
    - name: "Auth app [internal] : relire la liste des stratégies"
      ansible.builtin.import_tasks: strategies-list.yml

    - name: "Auth app [internal] : notre stratégie dans la liste"
      ansible.builtin.set_fact:
        apim_ss_strat_src: >-
          {{ (apim_ss_strategies | selectattr('name', 'equalto', apim_ss_strat_name)
              | list | first) | default({}) }}
      no_log: true

- name: "Auth app [internal] : résoudre client_id/secret (extra-var prioritaire, sinon la gateway)"
  ansible.builtin.set_fact:
    apim_ss_int_cid: >-
      {{ (apim_ss_internal_client_id | default('') | trim)
         or (apim_ss_strat_src.clientId | default(''))
         or ((apim_ss_strat_src.clientRegistration | default({})).clientId | default('')) }}
    apim_ss_int_secret_raw: >-
      {{ (apim_ss_internal_client_secret | default('') | trim)
         or ((apim_ss_strat_src.clientRegistration | default({})).clientSecret | default('')) }}
  no_log: true
  when: "apim_ss_auth_mode_eff == 'internal'"

# Un secret masqué N'EST PAS un secret : l'écrire dans Vault y poserait une
# chaîne d'astérisques et le consommateur obtiendrait un 401 à chaque token. On
# neutralise TOUTE chaîne faite uniquement d'astérisques — la 10.15 en rend 32
# sur POST et GET single (mesuré live), d'autres entités du produit en rendent 3
# (remoteIntrospectionConfig) : on ne liste pas les longueurs, on reconnaît la
# FORME.
- name: "Auth app [internal] : neutraliser un secret MASQUÉ par la gateway"
  ansible.builtin.set_fact:
    apim_ss_int_secret: >-
      {{ '' if ((apim_ss_int_secret_raw | trim) is match('^\*+$'))
         else (apim_ss_int_secret_raw | trim) }}
  no_log: true
  when: "apim_ss_auth_mode_eff == 'internal'"

# REPLI : pas de secret exploitable en main (re-run + gateway qui masque). Le
# client EXISTE pourtant sur l'AS — sa valeur a été écrite dans Vault au run de
# création. On relit Vault : présent ⇒ convergé (on n'écrit rien), absent ⇒ on
# s'arrête. Statuts 403/404 acceptés pour DIRE l'absence plutôt que de mourir sur
# une erreur HTTP illisible (même patron que backend-key.yml).
- name: "Auth app [internal] : le client est-il déjà dans Vault ? (repli sur secret non relisible)"
  ansible.builtin.uri:
    url: "{{ apim_ss_vault_addr }}/v1/{{ apim_ss_vault_kv_mount }}/data/{{ apim_ss_vault_prefix }}/{{ apim_ss_auth_vault_sub }}"
    method: GET
    headers: "{{ apim_ss_vault_ns_headers | combine({'X-Vault-Token': apim_ss_vault_token}) }}"
    status_code: [200, 403, 404]
  register: apim_ss_int_vault_read
  changed_when: false
  delegate_to: localhost
  no_log: true
  when:
    - "apim_ss_auth_mode_eff == 'internal'"
    - "(apim_ss_int_secret | default('')) | length == 0"
    - "(apim_ss_vault_addr | default('')) | length > 0"

- name: "Auth app [internal] : secret déjà stocké (repli)"
  ansible.builtin.set_fact:
    apim_ss_int_secret_stored: >-
      {{ (((apim_ss_int_vault_read.json | default({})).data | default({})).data | default({})).client_secret
         | default('') | string | trim }}
  no_log: true
  when:
    - "apim_ss_auth_mode_eff == 'internal'"
    - "(apim_ss_int_secret | default('')) | length == 0"

# FAIL-CLOSED : ne JAMAIS écrire un secret vide dans Vault (ce serait un
# fail-open silencieux — un consommateur lirait un client inutilisable). Sans
# secret capturé NI secret déjà stocké, on s'arrête avec un diagnostic actionnable.
- name: "Auth app [internal] : fail-closed — un client_secret exploitable existe"
  ansible.builtin.assert:
    that: >-
      ((apim_ss_int_secret | default('')) | length > 0)
      or ((apim_ss_int_secret_stored | default('')) | length > 0)
    fail_msg: >-
      INTERNAL_CLIENT_SECRET_MANQUANT : aucun client_secret pour
      '{{ apim_ss_app.name }}' (env {{ apim_ss_env | default('mono') }}). La
      stratégie '{{ apim_ss_strat_name }}' porte-t-elle bien un `dcrConfig` (mode
      internal) ? Un `clientId` posé à la main la fait basculer sur « client
      existant » et la gateway n'émet alors AUCUN credential. Rotation possible :
      PUT /strategies/{{ apim_ss_strat_id }}/refreshCredentials. Échappatoire :
      apim_ss_internal_client_id / apim_ss_internal_client_secret.
      RIEN n'est écrit dans Vault.
    success_msg: >-
      Client interne {{ 'ÉMIS par la gateway' if ((apim_ss_int_secret | default('')) | length > 0)
                        else 'déjà stocké dans Vault (secret non relisible — aucune réécriture)' }}
      (client_id={{ apim_ss_int_cid | default('?') }}).
  when: "apim_ss_auth_mode_eff == 'internal'"

- name: "Auth app [internal] : ÉCRIRE le client dans Vault (KV v2, tenant+env-scopé)"
  ansible.builtin.uri:
    url: "{{ apim_ss_vault_addr }}/v1/{{ apim_ss_vault_kv_mount }}/data/{{ apim_ss_vault_prefix }}/{{ apim_ss_auth_vault_sub }}"
    method: POST
    headers: "{{ apim_ss_vault_ns_headers | combine({'X-Vault-Token': apim_ss_vault_token}) }}"
    body_format: json
    # « user/pwd » du client = client_id + client_secret ; + audience/alias pour
    # que le consommateur rejoue un client_credentials sans redécouvrir la config.
    # `audience` suit le corps de la stratégie : omise si vide, pour ne pas faire
    # croire au consommateur qu'il doit demander une audience inexistante.
    body:
      data: >-
        {{ {'client_id': apim_ss_int_cid,
            'client_secret': apim_ss_int_secret,
            'auth_server_alias': apim_ss_auth_alias_eff,
            'grant_types': (apim_ss_auth_grant_types | default(['client_credentials']) | join(' ')),
            'client_type': (apim_ss_auth_client_type | default('CONFIDENTIAL') | upper),
            'env': (apim_ss_env | default('mono'))}
           | combine({'scopes': (apim_ss_auth_scopes_eff | join(' '))}
                     if ((apim_ss_auth_scopes_eff | default([])) | length > 0) else {})
           | combine({'audience': apim_ss_auth_audience_eff}
                     if (apim_ss_auth_audience_eff | length > 0) else {}) }}
    status_code: [200, 204]
  register: apim_ss_internal_write
  delegate_to: localhost
  no_log: true
  when:
    - "apim_ss_auth_mode_eff == 'internal'"
    - "apim_ss_vault_addr | length > 0"
    - "(apim_ss_int_secret | default('')) | length > 0"

- name: "Auth app [internal] : trace (sans secret) — client stocké dans Vault"
  ansible.builtin.debug:
    msg: >-
      INTERNAL_CLIENT_{{ 'WRITTEN' if ((apim_ss_int_secret | default('')) | length > 0) else 'KEPT' }} :
      client OAuth2 interne pour '{{ apim_ss_app.name }}' (env {{ apim_ss_env | default('mono') }})
      — client_id={{ apim_ss_int_cid }}, type={{ apim_ss_auth_client_type | default('CONFIDENTIAL') | upper }},
      grants={{ apim_ss_auth_grant_types | default(['client_credentials']) | join(',') }},
      scopes={{ apim_ss_auth_scopes_eff | default([]) | join(',') or '(aucun)' }},
      Vault={{ apim_ss_vault_prefix }}/{{ apim_ss_auth_vault_sub }}
      ({{ 'écrit à ce run' if ((apim_ss_int_secret | default('')) | length > 0)
          else 'inchangé — secret non relisible, valeur déjà stockée' }}, secret masqué).
      Le consommateur le lit au runtime, jamais Git.
  when: "apim_ss_auth_mode_eff == 'internal'"
