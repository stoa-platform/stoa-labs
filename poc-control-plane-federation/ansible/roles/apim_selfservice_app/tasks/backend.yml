---
# roles/apim_selfservice_app/tasks/backend.yml
#
# Plan SORTANT (P-callout, ADR-078) : injecter la clé backend dans un header vers
# l'amont via une Request Transformation (customHttpHeaders, stage routing). La
# VALEUR par défaut (${backend_apikey}) est résolue au RUNTIME par le package IS
# TokenProvider ← Vault — clé jamais sur la gateway ni chez le consommateur
# (déploiement Designer = résidu manuel). Ce rôle POSE le câblage as-code.
#
# wM impose UNE SEULE action customHttpHeaders par API (409 sinon) : idempotence
# clé sur l'action customHttpHeaders DÉJÀ ATTACHÉE au stage routing (leçon Go/Python).
# Importé dans le block module_defaults de main.yml (auth héritée).

- name: "Backend : GET de l'API -> policy id"
  ansible.builtin.uri:
    url: "{{ apim_ss_api_base }}/apis/{{ ss_api_id }}"
  register: bk_api_get
  changed_when: false

- ansible.builtin.set_fact:
    bk_pol_id: "{{ (bk_api_get.json.apiResponse.api.policies | default([])) | first | default('') }}"

- name: "Backend : GET policy"
  ansible.builtin.uri:
    url: "{{ apim_ss_api_base }}/policies/{{ bk_pol_id }}"
  register: bk_pol_get
  changed_when: false

- ansible.builtin.set_fact:
    bk_pol: "{{ bk_pol_get.json.policy | default(bk_pol_get.json) }}"
- ansible.builtin.set_fact:
    bk_routing_ids: >-
      {{ bk_pol.policyEnforcements | default([]) | selectattr('stageKey', 'equalto', 'routing')
         | map(attribute='enforcements') | flatten | map(attribute='enforcementObjectId') | list }}

- name: "Backend : liste des policyActions"
  ansible.builtin.uri:
    url: "{{ apim_ss_api_base }}/policyActions"
  register: bk_actions
  changed_when: false

- ansible.builtin.set_fact:
    bk_customhdr_ids: "{{ bk_actions.json.policyAction | default([]) | selectattr('templateKey', 'equalto', 'customHttpHeaders') | map(attribute='id') | list }}"
    bk_hdr_id: ""

- name: "Backend : id du customHttpHeaders DÉJÀ attaché à routing (idempotence)"
  ansible.builtin.set_fact:
    bk_hdr_id: "{{ item }}"
  loop: "{{ bk_routing_ids }}"
  loop_control: { label: "{{ item }}" }
  when: "item in bk_customhdr_ids"

- name: "Backend : corps de l'action (headerKey/headerValue ; ${..} résolu par TokenProvider)"
  ansible.builtin.set_fact:
    bk_action:
      policyAction:
        names: [{ value: "inject-backend-key", locale: "en" }]
        templateKey: "customHttpHeaders"
        parameters:
          - templateKey: "header"
            parameters:
              - { templateKey: "headerKey", values: ["{{ apim_ss_app.backend.header }}"] }
              - { templateKey: "headerValue", values: ["{{ apim_ss_app.backend.value_template }}"] }
        active: true

# Scission en deux taches a methode fixe (tache 3, lot 1 bis — durcissement
# anti-diagonale du linter d'allow-list) : un appel unique dont la methode ET
# le chemin dependaient du MEME conditionnel Jinja est indechiffrable pour un
# linter statique — il ne peut pas prouver que PUT va toujours avec l'id et
# POST toujours sans, et doit donc, fail-closed, exiger un produit croise
# complet que le contrat (a raison) ne declare pas : ces deux combinaisons
# croisees ne sont JAMAIS appelees. Deux taches ordinaires, chacune a une
# methode et une forme fixes, pilotees par la MEME condition qu'avant :
# comportement HTTP identique, mais verifiable exactement par le linter.
- name: "Backend : mettre a jour l'action deja attachee au stage routing (PUT)"
  ansible.builtin.uri:
    url: "{{ apim_ss_api_base }}/policyActions/{{ bk_hdr_id }}"
    method: PUT
    body: "{{ {'policyAction': (bk_action.policyAction | combine({'id': bk_hdr_id}))} }}"
    status_code: [200, 201]
  register: bk_hdr_put_update
  when: "bk_hdr_id | length > 0"

- name: "Backend : creer l'action (POST, aucune action customHttpHeaders attachee)"
  ansible.builtin.uri:
    url: "{{ apim_ss_api_base }}/policyActions"
    method: POST
    body: "{{ bk_action }}"
    status_code: [200, 201]
  register: bk_hdr_put_create
  when: "bk_hdr_id | length == 0"

# bk_hdr_id | length > 0 => on vient de PUT sur une action deja connue : id
# inchange. Sinon => on vient de POST, et bk_hdr_put_create est ALORS
# TOUJOURS le resultat REEL de cette tache (jamais un skip) puisque c'est
# exactement sa condition d'execution : en extraire l'id cree. Volontairement
# PAS de register partage entre les deux taches ci-dessus — meme une tache
# sautee ecrit son propre resultat (skipped=true, sans `.json`) dans la
# variable enregistree, donc un register commun ferait dependre la valeur
# finale de l'ORDRE des deux taches plutot que de celle qui a reellement
# tourne. Deux registers distincts, choisis ici par la MEME condition que les
# `when:` ci-dessus, eliminent cette dependance.
- ansible.builtin.set_fact:
    bk_hdr_id: >-
      {{ bk_hdr_id if (bk_hdr_id | length > 0)
         else (bk_hdr_put_create.json.policyAction.id | default(bk_hdr_put_create.json.id)) }}

# Attacher au routing UNIQUEMENT si pas déjà là. Dédup : on retire TOUT
# customHttpHeaders (une seule autorisée par API) et on ajoute le nôtre, en
# préservant straightThroughRouting et les autres stages.
- name: "Backend : attacher au stage routing (dédup) + PUT enveloppé"
  when: "bk_hdr_id not in bk_routing_ids"
  block:
    - ansible.builtin.set_fact:
        bk_routing_stage: "{{ bk_pol.policyEnforcements | selectattr('stageKey', 'equalto', 'routing') | list | first }}"
    - ansible.builtin.set_fact:
        bk_pol_new: >-
          {{ bk_pol | combine({'policyEnforcements':
              (bk_pol.policyEnforcements | rejectattr('stageKey', 'equalto', 'routing') | list)
              + [ bk_routing_stage | combine({'enforcements':
                    (bk_routing_stage.enforcements | rejectattr('enforcementObjectId', 'in', bk_customhdr_ids) | list)
                    + [{'enforcementObjectId': bk_hdr_id, 'order': none}] }) ] }) }}
    - ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/policies/{{ bk_pol_id }}"
        method: PUT
        body: { policy: "{{ bk_pol_new }}" }
        status_code: [200, 201]
