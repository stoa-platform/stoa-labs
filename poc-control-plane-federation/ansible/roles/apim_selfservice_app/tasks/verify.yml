---
# roles/apim_selfservice_app/tasks/verify.yml  (--tags verify)
#
# Preuve FAIL-CLOSED, rejouable comme critère d'acceptation : le play ÉCHOUE
# bruyamment si l'app n'oppose pas ce que sa demande exige. Read-only, self-
# contained (re-résout tout), pour tourner indépendamment du converge.

- name: "Env : résoudre le manifeste effectif (identité invariante ⊕ per_env)"
  ansible.builtin.import_tasks: resolve-env.yml

- name: "Secrets : creds admin gateway (Vault, fallback PoC)"
  ansible.builtin.import_role:
    name: apim_common
    tasks_from: secrets.yml

- name: "Verify — self-service application '{{ apim_ss_app.name }}'"
  module_defaults:
    ansible.builtin.uri: "{{ apim_ss_uri_defaults }}"
  block:

    - name: "Verify : relire l'application"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/applications"
      register: v_apps
      changed_when: false

    - ansible.builtin.set_fact:
        v_app_id: >-
          {{ (v_apps.json.applications | selectattr('name', 'equalto', apim_ss_app.name)
              | map(attribute='id') | list | first) | default('') }}

    - name: "Verify : fail-closed si l'application est absente"
      ansible.builtin.assert:
        that: "v_app_id | length > 0"
        fail_msg: "Application {{ apim_ss_app.name }} absente."

    - name: "Verify : relire le record de l'app"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/applications/{{ v_app_id }}"
      register: v_app_get
      changed_when: false

    - ansible.builtin.set_fact:
        v_app_rec: "{{ v_app_get.json.applications | default([v_app_get.json]) | first }}"
        v_id_keys: "{{ (v_app_get.json.applications | default([v_app_get.json]) | first).identifiers | default([]) | map(attribute='key') | list }}"

    # ----- cloisonnement : l'application appartient-elle à une team ? --------
    # Deux des trois gardes applicatives du design (E3) ne sont pas du code :
    # c'est le produit qui les assure — mais SEULEMENT sur une application
    # assignée. Une app restée en `Default` est visible et supprimable par
    # toutes les équipes. Cette dimension se vérifie donc comme les autres, avec
    # la même exigence : la team demandée présente ET `Default` partie.
    - name: "Verify : équipe attendue (même résolution qu'à l'apply)"
      ansible.builtin.import_tasks: team-name.yml

    - name: "Verify : teams[] relues sur l'application"
      ansible.builtin.set_fact:
        ss_team_names: "{{ v_app_rec.teams | default([]) | map(attribute='name') | list }}"

    - name: "Verify : FAIL-CLOSED — l'application est cloisonnée sur son équipe"
      ansible.builtin.assert:
        that:
          - "ss_team_name | length > 0"
          - "ss_team_name in ss_team_names"
          - "'Default' not in ss_team_names"
        fail_msg: >-
          TEAM_UNCONFIRMED : '{{ apim_ss_app.name }}' porte teams={{ ss_team_names }}
          (équipe attendue : '{{ ss_team_name | default('(aucune)', true) }}').
          Une application en team Default est visible ET SUPPRIMABLE par toutes
          les équipes — les gardes que le produit assure nativement ne s'appliquent
          qu'aux applications assignées.
        success_msg: >-
          TEAM_CONFIRMED : '{{ apim_ss_app.name }}' cloisonnée sur '{{ ss_team_name }}'
          (teams={{ ss_team_names }}).
      when: "apim_ss_require_team | default(true) | bool"

    - name: "Verify : chaque dimension à opposer est PRÉSENTE comme identifier de l'asset"
      ansible.builtin.assert:
        that: "item in v_id_keys"
        fail_msg: "identifier {{ item }} absent de l'application (fail-open : dimension déclarée non posée)."
        success_msg: "identifier {{ item }} présent dans l'asset."
      loop: "{{ apim_ss_app.enforce }}"

    # ----- cert : la VALEUR du manifeste est posée, le NOM porte sa date -----
    # (replace : name = "<app>-exp-YYYYMMDD" ; overlap : multi-dates triées
    # "<app>-exp-YYYYMMDD+YYYYMMDD" — dans les deux cas la date du cert du
    # manifeste DOIT apparaître, c'est elle que les scans du client lisent.)
    - name: "Verify : cert — valeur présente + nom daté (scans d'exploitation client)"
      when: "(apim_ss_app.public_cert_ref | default('')) | length > 0"
      block:
        # La valeur ATTENDUE doit être calculée EXACTEMENT comme la valeur POSÉE,
        # sinon leur accord ne prouve plus rien. D'où le MÊME fichier partagé
        # qu'apply (cert-der.yml) au lieu d'un découpage de chaîne local, qui
        # rendait autre chose dès que le PEM n'était pas parfaitement propre.
        # cert-der produit ss_cert_pem : il vient donc AVANT cert-expiry.
        - name: "Verify : recharger le PEM et recalculer la valeur attendue"
          ansible.builtin.import_tasks: cert-der.yml
        - ansible.builtin.import_tasks: cert-expiry.yml
        - name: "Verify : valeur base64(DER) attendue + identifier live"
          ansible.builtin.set_fact:
            v_cert_der: "{{ ss_cert_der }}"
            v_cert_id: >-
              {{ (v_app_rec.identifiers | default([])
                  | selectattr('key', 'equalto', 'httpsCertificate') | list | first) | default({}) }}
        - name: "Verify : FAIL-CLOSED — le cert du manifeste est POSÉ et son nom porte sa date"
          ansible.builtin.assert:
            that:
              - "v_cert_der in (v_cert_id.value | default([]))"
              - "(v_cert_id.name | default('')) is regex('-exp-[0-9]{8}(\\+[0-9]{8})*$')"
              - "ss_cert_expiry_ymd in (v_cert_id.name | default(''))"
            fail_msg: >-
              CERT_NAME_UNCONFIRMED : identifier httpsCertificate
              name='{{ v_cert_id.name | default('(absent)') }}'
              ({{ v_cert_id.value | default([]) | length }} valeur(s)) — le cert du
              manifeste (exp {{ ss_cert_expiry_ymd }}) est absent OU le nom ne porte
              pas sa date : les scans d'expiration du client seraient aveugles.
            success_msg: >-
              CERT_NAME_CONFIRMED : '{{ v_cert_id.name }}'
              ({{ v_cert_id.value | default([]) | length }} valeur(s), date
              {{ ss_cert_expiry_ymd }} visible).

    # ----- clé backend : la valeur POSÉE est-elle bien celle de Vault ? ------
    # On relit la clé par le MÊME fichier qu'apply (backend-key.yml), pour la
    # même raison que le cert : deux chemins de résolution différents rendraient
    # leur accord dépendant d'une coïncidence. La comparaison est booléenne et
    # rien n'est journalisé — ni la valeur attendue, ni la valeur live.
    - name: "Verify : clé backend — la valeur de Vault est POSÉE sur l'application"
      when: "(apim_ss_app.backend_key_ref | default('')) | length > 0"
      block:
        - name: "Verify : relire la clé attendue depuis Vault"
          ansible.builtin.import_tasks: backend-key.yml

        - name: "Verify : identifier token live + verdict de comparaison"
          ansible.builtin.set_fact:
            v_bk_id: >-
              {{ (v_app_rec.identifiers | default([])
                  | selectattr('key', 'equalto', 'token') | list | first) | default({}) }}
          no_log: true

        - name: "Verify : FAIL-CLOSED — clé backend présente et identique à Vault"
          ansible.builtin.assert:
            that: "ss_backend_key in (v_bk_id.value | default([]))"
            fail_msg: >-
              BACKEND_KEY_UNCONFIRMED : l'identifier `token` de
              '{{ apim_ss_app.name }}' ne porte pas la clé de Vault
              ({{ (v_bk_id.value | default([])) | length }} valeur(s) posée(s),
              name='{{ v_bk_id.name | default('(absent)') }}'). La custom policy
              injecterait vers l'amont une clé absente ou périmée.
            success_msg: >-
              BACKEND_KEY_CONFIRMED : identifier `token`
              name='{{ v_bk_id.name | default('') }}' porte la valeur de Vault
              ({{ (v_bk_id.value | default([])) | length }} valeur(s)).

    # ----- l'enforcement est-il RÉELLEMENT posé sur la policy de l'API ? -----
    - name: "Verify : résoudre l'API + sa policy + l'action IAM nommée"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis"
      register: v_apis
      changed_when: false

    - ansible.builtin.set_fact:
        v_api_id: >-
          {{ (v_apis.json.apiResponse | map(attribute='api')
              | selectattr('apiName', 'equalto', apim_ss_app.api)
              | selectattr('apiVersion', 'equalto', apim_ss_app.api_version)
              | map(attribute='id') | list | first) | default('') }}

    # ----- garde du register : l'équipe a-t-elle le droit de consommer l'API ? --
    # Même oracle qu'à l'apply, même fichier — sinon leur accord ne prouverait
    # rien. Rejouable : c'est une propriété de l'état, pas du déroulé de l'apply.
    - name: "Verify : garde du register (visibilité de l'API pour l'équipe)"
      when: "ss_team_name | length > 0 and v_api_id | length > 0"
      block:
        - ansible.builtin.set_fact:
            ss_api_id: "{{ v_api_id }}"
        - ansible.builtin.import_tasks: api-visibility.yml

    - name: "Verify : id de l'action IAM nommée"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/policyActions"
      register: v_actions
      changed_when: false

    - ansible.builtin.set_fact:
        v_iam_id: ""
    - name: "Verify : id de l'action IAM par empreinte de règles (nom forcé par la gateway)"
      ansible.builtin.set_fact:
        v_iam_id: "{{ item.id }}"
      loop: "{{ v_actions.json.policyAction | default([]) }}"
      loop_control: { label: "{{ item.id }}" }
      when: >-
        (item.parameters | default([]) | selectattr('templateKey', 'equalto', 'IdentificationRule')
         | map(attribute='parameters') | flatten
         | selectattr('templateKey', 'equalto', 'identificationType')
         | map(attribute='values') | flatten | sort) == (apim_ss_app.enforce | sort)

    - name: "Verify : GET API -> policy id"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/apis/{{ v_api_id }}"
      register: v_api_get
      changed_when: false
      when: "apim_ss_app.enforce | length > 0"

    - ansible.builtin.set_fact:
        v_pol_id: "{{ (v_api_get.json.apiResponse.api.policies | default([])) | first | default('') }}"
      when: "apim_ss_app.enforce | length > 0"

    - name: "Verify : GET policy"
      ansible.builtin.uri:
        url: "{{ apim_ss_api_base }}/policies/{{ v_pol_id }}"
      register: v_pol_get
      changed_when: false
      when: "apim_ss_app.enforce | length > 0"

    - name: "Verify : FAIL-CLOSED — le stage IAM oppose bien notre action AND"
      ansible.builtin.assert:
        that:
          - "v_iam_id | length > 0"
          - >-
            v_iam_id in ((v_pol_get.json.policy | default(v_pol_get.json)).policyEnforcements | default([])
              | selectattr('stageKey', 'equalto', 'IAM')
              | map(attribute='enforcements') | flatten
              | map(attribute='enforcementObjectId') | list)
        fail_msg: >-
          ENFORCEMENT_UNCONFIRMED : la policy de {{ apim_ss_app.api }} n'oppose pas
          l'action AND({{ apim_ss_app.enforce | join('+') }}) — les identifiers seraient inertes.
        success_msg: "ENFORCEMENT_CONFIRMED : AND({{ apim_ss_app.enforce | join('+') }}) opposé au stage IAM."
      when: "apim_ss_app.enforce | length > 0"

    # ----- plan SORTANT : la Request Transformation est-elle posée ? --------
    - name: "Verify : ids du stage routing + customHttpHeaders (plan sortant)"
      ansible.builtin.set_fact:
        v_routing_ids: >-
          {{ (v_pol_get.json.policy | default(v_pol_get.json)).policyEnforcements | default([])
             | selectattr('stageKey', 'equalto', 'routing') | map(attribute='enforcements') | flatten
             | map(attribute='enforcementObjectId') | list }}
        v_customhdr_ids: "{{ v_actions.json.policyAction | default([]) | selectattr('templateKey', 'equalto', 'customHttpHeaders') | map(attribute='id') | list }}"
      when: "apim_ss_app.enforce | length > 0 and (apim_ss_app.backend.header | default('')) | length > 0"

    - name: "Verify : FAIL-CLOSED — la clé backend est injectée (customHttpHeaders au routing)"
      ansible.builtin.assert:
        that: "(v_customhdr_ids | select('in', v_routing_ids) | list) | length > 0"
        fail_msg: "OUTBOUND_UNCONFIRMED : aucun customHttpHeaders attaché au routing — clé backend non injectée."
        success_msg: "OUTBOUND_CONFIRMED : injection clé backend (customHttpHeaders) posée au stage routing."
      when: "apim_ss_app.enforce | length > 0 and (apim_ss_app.backend.header | default('')) | length > 0"

    # ----- preuve LIVE data-plane (OPTIONNELLE) -----------------------------
    # Appel CONSOMMATEUR anonyme (l'IP identifie) -> 200. N'a de sens que si l'IP
    # de l'APPELANT est dans l'allowlist : vrai depuis un poste connu, FAUX depuis
    # un agent CI (IP différente). D'où le flag apim_ss_verify_dataplane (défaut
    # false) : la preuve fail-closed STRUCTURELLE (ENFORCEMENT/OUTBOUND_CONFIRMED)
    # reste toujours active ; ce check live ne s'ajoute que sur demande.
    - name: "Verify (live IP-only) : appel data-plane depuis une IP autorisée -> 200"
      ansible.builtin.uri:
        url: "{{ apim_ss_data_base }}/{{ apim_ss_app.api }}/{{ apim_ss_app.api_version }}/accounts"
        status_code: [200]
        headers: "{{ {apim_ss_env_header: apim_ss_env} if (apim_ss_env | length > 0) else {} }}"
        force_basic_auth: false
        user: "{{ omit }}"
        password: "{{ omit }}"
      register: v_dp
      changed_when: false
      when:
        - "apim_ss_app.enforce == ['ipAddressRange']"
        - "apim_ss_verify_dataplane | default(false) | bool"
