---
# roles/apim_selfservice_app/defaults/main.yml
#
# Self-service de création d'application consommatrice (ADR-078), 100 % Ansible :
# Ansible fait l'orchestration ET la mutation gateway (module uri) — pour ce
# client, le moteur Go labctl est parqué (contrainte de provenance). Les shapes
# REST et la logique d'idempotence/fail-closed sont la SPEC VÉRIFIÉE côté Go
# (mémoire wm-1015-rest-shapes ; preuve Python 9/9 + tests Go).

# --- connexion admin, TLS, multi-env, auth (basic|oauth2), Vault --------------
# Défauts PARTAGÉS (namespace apim_ss_*) déplacés dans
# roles/apim_common/defaults/main.yml — importés par main/verify via
# import_role (exposés au play : surcharge inventaire/-e inchangée).

# --- certificat consommateur : garde d'expiration (cert-expiry.yml) ----------
# Le nom de l'identifier httpsCertificate porte la date NotAfter :
# "<app|cert_name_prefix>-exp-YYYYMMDD" (les scripts d'exploitation du client
# scannent '-exp-[0-9]{8}' pour repérer les certs expirés). Fail-closed : un
# cert expiré — ou à moins de min_days_left jours — est REFUSÉ (identité morte,
# elle ne matcherait jamais au handshake).
apim_ss_cert_min_days_left: 0

# --- cloisonnement de l'application par team (E3 geste 1, tasks/team.yml) ----
# Une application créée par l'admin REST naît en team `Default` : visible ET
# supprimable par TOUTES les équipes. Assignée à une team, elle est cloisonnée
# NATIVEMENT (mesuré 2026-07-31 : cross-team GET/DELETE -> 401, absente de la
# liste, la suppression n'a pas lieu). La protection existe donc, mais elle est
# FACULTATIVE — d'où le fail-closed par défaut : pas de team, pas de déploiement.
#
# Nom de l'équipe : `-e apim_ss_team=<team>` (posé par le pipeline, prioritaire)
# ou `team:` dans le manifeste (repli pour un apply manuel).
#
# Mettre à false UNIQUEMENT sur un lab où la feature Teams n'est pas activée
# (docker-compose) : l'application y restera non cloisonnée, et le rôle le dira.
apim_ss_require_team: true

# --- la demande d'application à converger ------------------------------------
# Une seule ici ; en réel : boucler sur une liste OU charger un manifeste
# (clients/<x>/applications/*.json) via lookup('file') | from_json.
apim_ss_app:
  name: "demo-consumer"
  api: "demo-selfservice"
  api_version: "1.0.0"
  description: "ADR-078 self-service application (Ansible)"
  contact_emails: []
  # Équipe propriétaire — repli si le pipeline ne pose pas apim_ss_team.
  # Vide + apim_ss_require_team=true (défaut) = refus de déployer.
  team: ""
  # Identité ENTRANTE (identifiers de l'asset application) :
  ip_allowlist: []              # ex. ["192.168.65.1", "10.0.0.1-10.0.0.5"] (single|A-B ; PAS de CIDR — cf. README)
  public_cert_ref: ""          # chemin vers un PEM PUBLIC (ou "")
  # Rotation du certificat (main §3b, raisonne PAR VALEUR base64(DER)) :
  #   replace (défaut) : la valeur du manifeste REMPLACE la dimension ;
  #   overlap          : AJOUT aux certs existants encore valides (fenêtre de
  #                      chevauchement pour le double-run consommateur) + PURGE
  #                      automatique des valeurs expirées/illisibles à chaque run.
  # Nom de l'identifier = "<app|cert_name_prefix>-exp-YYYYMMDD[+YYYYMMDD]"
  # (dates triées — les scans d'exploitation du client lisent '-exp-[0-9]{8}').
  cert_rotation: "replace"
  # cert_name_prefix: ""       # préfixe du nom du cert (défaut : name de l'app)
  # Plan SORTANT (P-callout) : header de clé backend injecté vers l'amont.
  backend:
    header: "apikey"
    value_template: "${backend_apikey}"   # résolu au runtime par le TokenProvider IS ← Vault
  # Dimensions à OPPOSER par la règle IAM AND (strict) — ferme le fail-open.
  # Sous-ensemble de ["httpsCertificate","ipAddressRange"]. Vide = pose les
  # identifiers SANS règle IAM (comportement historique inerte — À ÉVITER).
  enforce: []
  # --- MULTI-ENV : valeurs qui DIFFÈRENT par env (résolu par resolve-env.yml) --
  # Mettre ici les champs env-spécifiques (ip_allowlist, public_cert_ref, override
  # backend…). Le rôle fusionne racine ⊕ per_env[apim_ss_env]. Vide = mono-env.
  #   per_env:
  #     dev:  { ip_allowlist: ["10.10.1.0-10.10.1.9"], public_cert_ref: "certs/dev/app.crt" }
  #     prod: { ip_allowlist: ["10.90.1.0-10.90.1.9"], public_cert_ref: "certs/prod/app.crt" }
  per_env: {}
