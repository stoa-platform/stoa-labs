---
# roles/stoa_selfservice_app/tasks/secrets.yml
# Résolution de l'AUTH de l'API d'admin (proxifiée ou directe) + headers communs.
# Vault d'abord (KV v2), fallback PoC total sans VAULT_ADDR. Deux modes :
#   basic  -> user/password (PoC direct)
#   oauth2 -> bearer client_credentials (proxy client)
# Produit stoa_ss_uri_defaults, consommé par le module_defaults de main/verify.

# ===== Vault : token (statique > AppRole éphémère) — comme is-mtls-setup.yml ==
- name: "Vault : token statique (VAULT_TOKEN_FILE > VAULT_TOKEN)"
  ansible.builtin.set_fact:
    stoa_ss_vault_token: >-
      {{ (lookup('file', lookup('env', 'VAULT_TOKEN_FILE'), errors='ignore') | default('', true) | trim)
         or (lookup('env', 'VAULT_TOKEN') | default('', true) | trim) }}
  no_log: true
  when: "stoa_ss_vault_addr | length > 0"

- name: "Vault : login AppRole (si aucun token statique)"
  ansible.builtin.uri:
    url: "{{ stoa_ss_vault_addr }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ lookup('env', 'VAULT_ROLE_ID') }}"
      secret_id: >-
        {{ (lookup('file', lookup('env', 'VAULT_SECRET_ID_FILE'), errors='ignore') | default('', true) | trim)
           or (lookup('env', 'VAULT_SECRET_ID') | default('', true) | trim) }}
    status_code: [200]
  register: stoa_ss_approle
  delegate_to: localhost
  no_log: true
  when:
    - "stoa_ss_vault_addr | length > 0"
    - "stoa_ss_vault_token | default('') | length == 0"

- name: "Vault : token effectif"
  ansible.builtin.set_fact:
    stoa_ss_vault_token: >-
      {{ stoa_ss_vault_token if (stoa_ss_vault_token | default('') | length > 0)
         else (stoa_ss_approle.json.auth.client_token | default('')) }}
  no_log: true
  when: "stoa_ss_vault_addr | length > 0"

# ===== BASIC : creds admin ===================================================
- name: "Vault : creds admin BASIC [KV v2]"
  ansible.builtin.uri:
    url: "{{ stoa_ss_vault_addr }}/v1/{{ stoa_ss_vault_kv_mount }}/data/{{ stoa_ss_vault_prefix }}/{{ stoa_ss_vault_wm_creds_sub }}"
    headers: { X-Vault-Token: "{{ stoa_ss_vault_token }}" }
    status_code: [200, 404]
  register: stoa_ss_kv_wm
  delegate_to: localhost
  no_log: true
  when: "stoa_ss_vault_addr | length > 0 and stoa_ss_auth_mode == 'basic'"

- name: "BASIC : résoudre user/password (Vault prioritaire, fallback PoC)"
  ansible.builtin.set_fact:
    stoa_ss_wm_user: "{{ (stoa_ss_kv_wm.json.data.data.username | default('')) or stoa_ss_wm_user }}"
    stoa_ss_wm_password: "{{ (stoa_ss_kv_wm.json.data.data.password | default('')) or stoa_ss_wm_password }}"
  no_log: true
  when: "stoa_ss_auth_mode == 'basic'"

# ===== OAUTH2 : creds + get token ============================================
- name: "Vault : creds OAUTH2 admin [KV v2]"
  ansible.builtin.uri:
    url: "{{ stoa_ss_vault_addr }}/v1/{{ stoa_ss_vault_kv_mount }}/data/{{ stoa_ss_vault_prefix }}/{{ stoa_ss_vault_oauth_sub }}"
    headers: { X-Vault-Token: "{{ stoa_ss_vault_token }}" }
    status_code: [200, 404]
  register: stoa_ss_kv_oauth
  delegate_to: localhost
  no_log: true
  when: "stoa_ss_vault_addr | length > 0 and stoa_ss_auth_mode == 'oauth2'"

- name: "OAUTH2 : résoudre token_url/client_id/secret/scope (Vault prioritaire)"
  ansible.builtin.set_fact:
    stoa_ss_oauth_token_url: "{{ (stoa_ss_kv_oauth.json.data.data.token_url | default('')) or stoa_ss_oauth_token_url }}"
    stoa_ss_oauth_client_id: "{{ (stoa_ss_kv_oauth.json.data.data.client_id | default('')) or stoa_ss_oauth_client_id }}"
    stoa_ss_oauth_client_secret: "{{ (stoa_ss_kv_oauth.json.data.data.client_secret | default('')) or stoa_ss_oauth_client_secret }}"
    stoa_ss_oauth_scope: "{{ (stoa_ss_kv_oauth.json.data.data.scope | default('')) or stoa_ss_oauth_scope }}"
  no_log: true
  when: "stoa_ss_auth_mode == 'oauth2'"

- name: "OAUTH2 : obtenir un bearer (grant_type=client_credentials)"
  ansible.builtin.uri:
    url: "{{ stoa_ss_oauth_token_url }}"
    method: POST
    body_format: form-urlencoded
    body: >-
      {{ {'grant_type': 'client_credentials',
          'client_id': stoa_ss_oauth_client_id,
          'client_secret': stoa_ss_oauth_client_secret}
         | combine({'scope': stoa_ss_oauth_scope} if (stoa_ss_oauth_scope | length > 0) else {}) }}
    status_code: [200]
  register: stoa_ss_token
  delegate_to: localhost
  no_log: true
  when: "stoa_ss_auth_mode == 'oauth2'"

- name: "OAUTH2 : bearer + fail-closed si absent"
  when: "stoa_ss_auth_mode == 'oauth2'"
  block:
    - ansible.builtin.set_fact:
        stoa_ss_bearer: "{{ stoa_ss_token.json.access_token | default('') }}"
      no_log: true
    - ansible.builtin.assert:
        that: "stoa_ss_bearer | default('') | length > 0"
        fail_msg: "Aucun bearer OAuth2 (token_url/client_id/secret/scope ?)."

# ===== headers communs + defaults du module uri ==============================
# Accept + (X-Environment si env) + (Authorization Bearer si oauth2). Le mode
# basic ajoute user/password/force_basic_auth aux defaults du module.
- name: "Auth : headers communs (Accept + X-Environment + Bearer)"
  ansible.builtin.set_fact:
    stoa_ss_headers: >-
      {{ {'Accept': 'application/json'}
         | combine({stoa_ss_env_header: stoa_ss_env} if (stoa_ss_env | length > 0) else {})
         | combine({'Authorization': 'Bearer ' ~ stoa_ss_bearer} if (stoa_ss_auth_mode == 'oauth2') else {}) }}
  no_log: true

- name: "Auth : defaults du module uri (headers + auth basic si applicable)"
  ansible.builtin.set_fact:
    stoa_ss_uri_defaults: >-
      {{ {'headers': stoa_ss_headers, 'body_format': 'json'}
         | combine({'user': stoa_ss_wm_user, 'password': stoa_ss_wm_password, 'force_basic_auth': true}
                   if (stoa_ss_auth_mode == 'basic') else {}) }}
  no_log: true
