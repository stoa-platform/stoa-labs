---
# roles/stoa_selfservice_app/tasks/backend.yml
#
# Plan SORTANT (P-callout, ADR-078) : injecter la clé backend dans un header vers
# l'amont via une Request Transformation (customHttpHeaders, stage routing). La
# VALEUR par défaut (${backend_apikey}) est résolue au RUNTIME par le package IS
# TokenProvider ← Vault — clé jamais sur la gateway ni chez le consommateur
# (déploiement Designer = résidu manuel). Ce rôle POSE le câblage as-code.
#
# wM impose UNE SEULE action customHttpHeaders par API (409 sinon) : idempotence
# clé sur l'action customHttpHeaders DÉJÀ ATTACHÉE au stage routing (leçon Go/Python).
# Importé dans le block module_defaults de main.yml (auth héritée).

- name: "Backend : GET de l'API -> policy id"
  ansible.builtin.uri:
    url: "{{ stoa_ss_admin_url }}/rest/apigateway/apis/{{ ss_api_id }}"
  register: bk_api_get
  changed_when: false

- ansible.builtin.set_fact:
    bk_pol_id: "{{ (bk_api_get.json.apiResponse.api.policies | default([])) | first | default('') }}"

- name: "Backend : GET policy"
  ansible.builtin.uri:
    url: "{{ stoa_ss_admin_url }}/rest/apigateway/policies/{{ bk_pol_id }}"
  register: bk_pol_get
  changed_when: false

- ansible.builtin.set_fact:
    bk_pol: "{{ bk_pol_get.json.policy | default(bk_pol_get.json) }}"
- ansible.builtin.set_fact:
    bk_routing_ids: >-
      {{ bk_pol.policyEnforcements | default([]) | selectattr('stageKey', 'equalto', 'routing')
         | map(attribute='enforcements') | flatten | map(attribute='enforcementObjectId') | list }}

- name: "Backend : liste des policyActions"
  ansible.builtin.uri:
    url: "{{ stoa_ss_admin_url }}/rest/apigateway/policyActions"
  register: bk_actions
  changed_when: false

- ansible.builtin.set_fact:
    bk_customhdr_ids: "{{ bk_actions.json.policyAction | default([]) | selectattr('templateKey', 'equalto', 'customHttpHeaders') | map(attribute='id') | list }}"
    bk_hdr_id: ""

- name: "Backend : id du customHttpHeaders DÉJÀ attaché à routing (idempotence)"
  ansible.builtin.set_fact:
    bk_hdr_id: "{{ item }}"
  loop: "{{ bk_routing_ids }}"
  loop_control: { label: "{{ item }}" }
  when: "item in bk_customhdr_ids"

- name: "Backend : corps de l'action (headerKey/headerValue ; ${..} résolu par TokenProvider)"
  ansible.builtin.set_fact:
    bk_action:
      policyAction:
        names: [{ value: "inject-backend-key", locale: "en" }]
        templateKey: "customHttpHeaders"
        parameters:
          - templateKey: "header"
            parameters:
              - { templateKey: "headerKey", values: ["{{ stoa_ss_app.backend.header }}"] }
              - { templateKey: "headerValue", values: ["{{ stoa_ss_app.backend.value_template }}"] }
        active: true

- name: "Backend : converger l'action (PUT si déjà attachée, POST sinon)"
  ansible.builtin.uri:
    url: "{{ stoa_ss_admin_url }}/rest/apigateway/policyActions{{ ('/' ~ bk_hdr_id) if (bk_hdr_id | length > 0) else '' }}"
    method: "{{ 'PUT' if (bk_hdr_id | length > 0) else 'POST' }}"
    body: >-
      {{ {'policyAction': (bk_action.policyAction | combine({'id': bk_hdr_id}))}
         if (bk_hdr_id | length > 0) else bk_action }}
    status_code: [200, 201]
  register: bk_hdr_put

- ansible.builtin.set_fact:
    bk_hdr_id: >-
      {{ bk_hdr_id if (bk_hdr_id | length > 0)
         else (bk_hdr_put.json.policyAction.id | default(bk_hdr_put.json.id)) }}

# Attacher au routing UNIQUEMENT si pas déjà là. Dédup : on retire TOUT
# customHttpHeaders (une seule autorisée par API) et on ajoute le nôtre, en
# préservant straightThroughRouting et les autres stages.
- name: "Backend : attacher au stage routing (dédup) + PUT enveloppé"
  when: "bk_hdr_id not in bk_routing_ids"
  block:
    - ansible.builtin.set_fact:
        bk_routing_stage: "{{ bk_pol.policyEnforcements | selectattr('stageKey', 'equalto', 'routing') | list | first }}"
    - ansible.builtin.set_fact:
        bk_pol_new: >-
          {{ bk_pol | combine({'policyEnforcements':
              (bk_pol.policyEnforcements | rejectattr('stageKey', 'equalto', 'routing') | list)
              + [ bk_routing_stage | combine({'enforcements':
                    (bk_routing_stage.enforcements | rejectattr('enforcementObjectId', 'in', bk_customhdr_ids) | list)
                    + [{'enforcementObjectId': bk_hdr_id, 'order': none}] }) ] }) }}
    - ansible.builtin.uri:
        url: "{{ stoa_ss_admin_url }}/rest/apigateway/policies/{{ bk_pol_id }}"
        method: PUT
        body: { policy: "{{ bk_pol_new }}" }
        status_code: [200, 201]
