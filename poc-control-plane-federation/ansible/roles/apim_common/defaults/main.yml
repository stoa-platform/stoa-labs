---
# roles/apim_common/defaults/main.yml
#
# Défauts PARTAGÉS par les rôles apim_* (publish/promote/selfservice) : endpoint
# de l'API d'admin, TLS, multi-env (header), auth admin (basic|oauth2) et Vault.
# Un seul endroit à surcharger par inventaire/`-e` — les rôles consommateurs
# n'en redéclarent AUCUN (source unique, zéro drift).
#
# Namespace apim_ss_* CONSERVÉ tel quel : c'est le contrat de nommage historique
# commun aux trois rôles (pipelines combinés, plays, docs, jobs Jenkins) — le
# renommer casserait tous les appelants pour un gain nul.

# --- endpoint de l'API d'ADMIN (les tâches ne portent QUE la ressource) ------
# La base INCLUT le préfixe : en direct PoC = .../rest/apigateway ; chez le
# client = le PROXY qui le mappe (et l'authentifie en OAuth2, cf. auth_mode).
apim_ss_api_base: "http://localhost:5555/rest/apigateway"
# data-plane (appel consommateur des verify live / smoke)
apim_ss_data_base: "http://localhost:5555/gateway"

# --- TLS : CA privé (client) -------------------------------------------------
# Bundle PEM (CA racine/intermédiaires) qui DOIT couvrir CHAQUE endpoint https
# joint par le play : la gateway (apim_ss_api_base), l'IdP OAuth2
# (apim_ss_oauth_token_url) ET Vault (apim_ss_vault_addr) — concaténer les CA
# si elles diffèrent (souvent 1 seule racine corporate). Vide = trust store
# système (PoC http, ou CA publique). Câblé sur le module uri via ca_path.
apim_ss_ca_path: ""

# --- proxy multi-env on-premise : un seul endpoint, l'env via un header -------
apim_ss_env: ""                       # dev|rec|int|prod ; vide = pas de header (PoC direct)
apim_ss_env_header: "X-Environment"   # nom du header (configurable)

# --- authentification de l'API d'admin ---------------------------------------
#   basic  : user/mot de passe (PoC direct) — lus dans Vault, fallback manage.
#   oauth2 : bearer client_credentials (proxy client) — token récupéré au runtime
#            et passé en Authorization: Bearer sur chaque appel.
apim_ss_auth_mode: "basic"            # basic | oauth2

# basic (fallback PoC)
apim_ss_wm_user: "Administrator"
apim_ss_wm_password: "manage"

# oauth2 (creds de préférence depuis Vault ; sinon ces vars)
# Méthode d'authentification du CLIENT au token endpoint (RFC 6749) :
#   post  — client_id/secret dans le CORPS (client_secret_post ; Keycloak & co)
#   basic — Authorization: Basic base64(id:secret) (client_secret_basic).
#           REQUIS pour l'AS LOCAL wM (proxy admin sur la gateway) : sondé live,
#           en post la gateway répond « Transport protocol must be HTTPS » (le
#           body-creds n'est accepté qu'en HTTPS) alors que le Basic est évalué
#           partout. Token endpoint wM local (port IS) :
#           /invoke/pub.apigateway.oauth2/getAccessToken
apim_ss_oauth_client_auth: "post"   # post | basic
apim_ss_oauth_token_url: ""
apim_ss_oauth_client_id: ""
apim_ss_oauth_client_secret: ""
apim_ss_oauth_scope: ""

# --- Vault (mêmes conventions que is-mtls-setup.yml / internal/vault) --------
apim_ss_vault_addr: "{{ lookup('env', 'VAULT_ADDR') }}"
apim_ss_vault_kv_mount: "secret"
apim_ss_vault_k8s_mount: "auth/kubernetes"    # auth Kubernetes : login du SA du pod agent
# Mount de la méthode d'auth USER/PASSWORD. `auth/ldap` chez le client (AD ; le
# mount peut s'appeler auth/ad, auth/ldap-corp…), `auth/userpass` en lab : la
# requête REST est IDENTIQUE, seul ce chemin change. Normalisé — `ldap`,
# `auth/ldap` et `auth/ldap/` donnent le même résultat.
apim_ss_vault_user_mount: >-
  auth/{{ lookup('env', 'VAULT_USER_AUTH_MOUNT') | default('ldap', true) | trim
          | regex_replace('^auth/', '') | regex_replace('/+$', '') }}
# Préfixe OPTIONNEL ("" accepté) : l'entrée peut vivre à PLAT à la racine du
# mount (ex. client : mount secret_DEV, entrée APIM-TEST-ADMIN) — mettre alors
# le nom complet dans *_sub et le préfixe à vide (les segments vides sont élidés).
apim_ss_vault_prefix: "stoa"
apim_ss_vault_wm_creds_sub: "gateways/webmethods"           # basic  : { username, password }
apim_ss_vault_oauth_sub: "gateways/webmethods/admin-oauth"  # oauth2 : { token_url, client_id, client_secret, scope }
# Noms des CHAMPS dans les entrées KV — knobs pour épouser la convention de
# nommage du client (ex. entrée APIM-*-ADMIN à champs admin-client-id /
# admin-client-secret). Un champ ABSENT de l'entrée retombe champ PAR champ sur
# la var apim_ss_* correspondante (mix possible : id/secret dans Vault,
# token_url en var d'inventaire).
apim_ss_vault_wm_user_key: "username"
apim_ss_vault_wm_password_key: "password"
apim_ss_vault_oauth_token_url_key: "token_url"
apim_ss_vault_oauth_client_id_key: "client_id"
apim_ss_vault_oauth_client_secret_key: "client_secret"
apim_ss_vault_oauth_scope_key: "scope"

# --- état de la feature Teams (sonde partagee, tasks/teams-feature.yml) ------
# DEUX notions distinctes, ne pas les confondre :
#   apim_ss_teams_feature = ETAT DE LA PLATEFORME  (auto | off)
#   apim_ss_require_team  = POLITIQUE             (true | false)
# `auto` sonde GET /configurations/extended ; `off` court-circuite la sonde
# quand on ne veut pas interroger la gateway. Poser cette variable dans
# l'inventaire de l'environnement (depot plateforme, revu par PR) — JAMAIS
# dans un manifeste d'equipe ni dans un parametre de build : sinon « qui peut
# lancer un build » devient « qui peut desactiver le cloisonnement ».
apim_ss_teams_feature: "auto"
