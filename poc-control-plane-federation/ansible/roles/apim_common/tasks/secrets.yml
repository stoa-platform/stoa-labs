---
# roles/apim_common/tasks/secrets.yml
# Résolution de l'AUTH de l'API d'admin (proxifiée ou directe) + headers communs.
# IMPLÉMENTATION UNIQUE, partagée par les rôles apim_* (publish/promote/
# selfservice) via `import_role: {name: apim_common, tasks_from: secrets.yml}` —
# remplace les 3 copies « rôles autonomes » (l'unité de livraison devient le JEU
# de rôles : une brique = son rôle + apim_common, toujours zéro dépendance externe).
# Vault d'abord (KV v2), fallback PoC total sans VAULT_ADDR. Deux modes :
#   basic  -> user/password (PoC direct)
#   oauth2 -> bearer client_credentials (proxy client)
# Produit apim_ss_uri_defaults, consommé par le module_defaults de main/verify
# des rôles appelants (facts d'hôte : visibles après l'import, quel que soit le
# rôle qui les a posés).

# ===== Vault : token (statique > Kubernetes > user/password > AppRole) ========
# Ordre = du plus « machine » au plus « humain », le STATIQUE gagnant toujours :
# sous Jenkins le login NOMINATIF est fait UNE SEULE FOIS par ci/lib/vault-login.sh,
# qui passe VAULT_TOKEN_FILE — le rôle ne refait alors aucun login (une seule
# implémentation d'auth à auditer, ADR-078 §2). Les logins ci-dessous servent aux
# exécutions HORS Jenkins (ops en local, agent K8s sans wrapper).
# PRÉCÉDENCE COMMUNE aux facts d'identité ci-dessous : un fact DÉJÀ POSÉ gagne
# sur l'env. Deux usages : (1) le shim de compat pipeline (vault-login-compat.yml)
# pré-pose l'identité depuis des VARIABLES de play (pipelines historiques var-driven) ;
# (2) au SECOND import de secrets.yml dans un même run (converge puis verify,
# plays enchaînés), le token acquis est RÉUTILISÉ au lieu de re-loguer — un seul
# login nominatif par build, un seul événement d'audit. Env inchangé ⇒ même
# comportement qu'avant : la retouche est rétro-compatible.
- name: "Vault : namespace optionnel (Vault Enterprise — X-Vault-Namespace sur TOUS les appels)"
  ansible.builtin.set_fact:
    apim_ss_vault_ns_headers: >-
      {{ {'X-Vault-Namespace': ((apim_ss_vault_namespace | default('', true) | trim)
                                or (lookup('env', 'VAULT_NAMESPACE') | default('', true) | trim))}
         if (((apim_ss_vault_namespace | default('', true) | trim)
              or (lookup('env', 'VAULT_NAMESPACE') | default('', true) | trim)) | length > 0) else {} }}

- name: "Vault : token statique (fact pré-posé > VAULT_TOKEN_FILE > VAULT_TOKEN)"
  ansible.builtin.set_fact:
    apim_ss_vault_token: >-
      {{ (apim_ss_vault_token | default('', true) | trim)
         or (lookup('file', lookup('env', 'VAULT_TOKEN_FILE'), errors='ignore') | default('', true) | trim)
         or (lookup('env', 'VAULT_TOKEN') | default('', true) | trim) }}
  no_log: true
  when: "apim_ss_vault_addr | length > 0"

- name: "Vault : identité user/password (fact pré-posé > VAULT_USER > VAULT_LDAP_USER)"
  # Le mot de passe est lu de préférence dans un FICHIER 0600 (VAULT_USER_PASS_FILE) :
  # un secret en variable d'environnement est hérité par tout process enfant et
  # lisible dans /proc/<pid>/environ. VAULT_LDAP_USER/_PASS restent acceptés (alias
  # historique, README du rôle).
  ansible.builtin.set_fact:
    apim_ss_vault_user: >-
      {{ (apim_ss_vault_user | default('', true) | trim)
         or (lookup('env', 'VAULT_USER') | default('', true) | trim)
         or (lookup('env', 'VAULT_LDAP_USER') | default('', true) | trim) }}
    apim_ss_vault_pass: >-
      {{ (apim_ss_vault_pass | default('', true) | trim)
         or (lookup('file', lookup('env', 'VAULT_USER_PASS_FILE'), errors='ignore') | default('', true) | trim)
         or (lookup('env', 'VAULT_USER_PASS') | default('', true) | trim)
         or (lookup('file', lookup('env', 'VAULT_LDAP_PASS_FILE'), errors='ignore') | default('', true) | trim)
         or (lookup('env', 'VAULT_LDAP_PASS') | default('', true) | trim) }}
  no_log: true

- name: "Vault : login Kubernetes (SA du pod agent — si VAULT_K8S_ROLE fourni et aucun token statique)"
  # Reco HashiCorp sur K8s : le pod s'authentifie avec SON ServiceAccount token
  # (auth/kubernetes/login) — zéro secret stocké. Fait DANS le conteneur agent, donc
  # avec l'identité du pod AGENT (pas celle du contrôleur — piège du plugin Jenkins).
  # Env : VAULT_K8S_ROLE (+ VAULT_K8S_JWT_PATH pour surcharger le chemin du SA token).
  ansible.builtin.uri:
    url: "{{ apim_ss_vault_addr }}/v1/{{ apim_ss_vault_k8s_mount }}/login"
    method: POST
    body_format: json
    body:
      role: "{{ lookup('env', 'VAULT_K8S_ROLE') | trim }}"
      jwt: >-
        {{ lookup('file',
                  (lookup('env', 'VAULT_K8S_JWT_PATH') | default('', true) | trim)
                  or '/var/run/secrets/kubernetes.io/serviceaccount/token') | trim }}
    headers: "{{ apim_ss_vault_ns_headers }}"
    status_code: [200]
    ca_path: "{{ apim_ss_ca_path | default('') or omit }}"
  register: apim_ss_k8s
  delegate_to: localhost
  failed_when: false          # le diagnostic est rendu par l'assert suivant (no_log masque tout)
  no_log: true
  when:
    - "apim_ss_vault_addr | length > 0"
    - "apim_ss_vault_token | default('') | length == 0"
    - "(lookup('env', 'VAULT_K8S_ROLE') | default('', true) | trim) | length > 0"

- name: "Vault : login Kubernetes — fail-closed AVEC diagnostic (aucun secret dans le message)"
  ansible.builtin.assert:
    that: "(apim_ss_k8s.status | default(0)) == 200"
    fail_msg: >-
      Login Vault Kubernetes REFUSÉ (HTTP {{ apim_ss_k8s.status | default('n/a') }})
      sur {{ apim_ss_vault_k8s_mount }}/login
      (role={{ lookup('env', 'VAULT_K8S_ROLE') | trim }},
      namespace={{ lookup('env', 'VAULT_NAMESPACE') | default('<aucun>', true) }}).
      Vérifier : le rôle côté Vault (bound SA + namespace K8s), le token_reviewer_jwt
      si Vault est hors cluster, et VAULT_K8S_JWT_PATH si le SA token n'est pas au
      chemin standard.
  when:
    - "apim_ss_vault_addr | length > 0"
    - "apim_ss_vault_token | default('') | length == 0"
    - "(lookup('env', 'VAULT_K8S_ROLE') | default('', true) | trim) | length > 0"

- name: "Vault : login user/password (LDAP/AD chez le client, userpass en lab)"
  # MÊME requête REST pour les deux backends d'identité — POST /v1/<mount>/login/<user>
  # avec {"password": …} : seul le MOUNT change (VAULT_USER_AUTH_MOUNT, défaut
  # auth/ldap). C'est ce qui permet de prouver la chaîne en lab sur `userpass` et de
  # basculer chez le client sur `auth/ldap` (ou auth/ad, auth/ldap-corp…) sans
  # toucher une ligne de code.
  #   - user dans le PATH, URL-ENCODÉ : `DOMAIN\user` -> %5C, UPN `user@corp` -> %40 ;
  #   - mot de passe dans le CORPS, jamais en argv ni en query (ps, access log proxy) ;
  #   - body_format: json ÉCHAPPE les métacaractères du mot de passe (" \ $) — ne
  #     JAMAIS forger ce JSON à la main en shell.
  # Le token obtenu est NOMINATIF (entité Vault = l'utilisateur) et vit le temps du
  # run. La policy se mappe côté Vault au GROUPE AD : `auth/ldap/groups/<grp>` ->
  # `deploy-<tenant>`. En LDAP il n'existe pas de claim `tenant` (contrairement au JWT
  # d'ADR-077) : la ségrégation par tenant passe donc par le groupe (ADR-078 §3).
  ansible.builtin.uri:
    url: "{{ apim_ss_vault_addr }}/v1/{{ apim_ss_vault_user_mount }}/login/{{ apim_ss_vault_user | urlencode }}"
    method: POST
    body_format: json
    body:
      password: "{{ apim_ss_vault_pass }}"
    headers: "{{ apim_ss_vault_ns_headers }}"
    status_code: [200]
    ca_path: "{{ apim_ss_ca_path | default('') or omit }}"
  register: apim_ss_userpass
  delegate_to: localhost
  failed_when: false          # le diagnostic est rendu par l'assert suivant (no_log masque tout)
  no_log: true
  when:
    - "apim_ss_vault_addr | length > 0"
    - "apim_ss_vault_token | default('') | length == 0"
    - "(lookup('env', 'VAULT_K8S_ROLE') | default('', true) | trim) | length == 0"
    - "apim_ss_vault_user | default('') | length > 0"

- name: "Vault : login user/password — fail-closed AVEC diagnostic (aucun secret dans le message)"
  # Sans cet assert, un échec de login sous no_log ne dit RIEN à l'ops ("output has
  # been hidden"). On ne ré-expose que le code HTTP et les knobs — jamais le corps.
  ansible.builtin.assert:
    that: "(apim_ss_userpass.status | default(0)) == 200"
    fail_msg: >-
      Login Vault user/password REFUSÉ (HTTP {{ apim_ss_userpass.status | default('n/a') }})
      sur {{ apim_ss_vault_user_mount }}/login/<user>. Vérifier : le MOUNT
      (VAULT_USER_AUTH_MOUNT={{ apim_ss_vault_user_mount }}), le FORMAT de login attendu
      par l'annuaire (sAMAccountName / UPN user@domaine / DOMAIN\user), le mot de passe
      (VAULT_USER_PASS_FILE), et le namespace si Vault Enterprise (VAULT_NAMESPACE).
      ⚠ Ne pas relancer en boucle : la politique de lockout AD peut VERROUILLER le
      compte nominatif au bout de N échecs.
    success_msg: "Login Vault user/password accepté sur {{ apim_ss_vault_user_mount }} (token NOMINATIF, TTL borné par la policy)."
  when:
    - "apim_ss_vault_addr | length > 0"
    - "apim_ss_vault_token | default('') | length == 0"
    - "(lookup('env', 'VAULT_K8S_ROLE') | default('', true) | trim) | length == 0"
    - "apim_ss_vault_user | default('') | length > 0"

- name: "Vault : login AppRole (fallback — si aucun token statique, ni K8s, ni user/password)"
  ansible.builtin.uri:
    url: "{{ apim_ss_vault_addr }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ lookup('env', 'VAULT_ROLE_ID') }}"
      secret_id: >-
        {{ (lookup('file', lookup('env', 'VAULT_SECRET_ID_FILE'), errors='ignore') | default('', true) | trim)
           or (lookup('env', 'VAULT_SECRET_ID') | default('', true) | trim) }}
    headers: "{{ apim_ss_vault_ns_headers }}"
    status_code: [200]
    ca_path: "{{ apim_ss_ca_path | default('') or omit }}"
  register: apim_ss_approle
  delegate_to: localhost
  failed_when: false          # le diagnostic est rendu par l'assert suivant (no_log masque tout)
  no_log: true
  when:
    - "apim_ss_vault_addr | length > 0"
    - "apim_ss_vault_token | default('') | length == 0"
    - "(lookup('env', 'VAULT_K8S_ROLE') | default('', true) | trim) | length == 0"
    - "apim_ss_vault_user | default('') | length == 0"

- name: "Vault : login AppRole — fail-closed AVEC diagnostic (aucun secret dans le message)"
  ansible.builtin.assert:
    that: "(apim_ss_approle.status | default(0)) == 200"
    fail_msg: >-
      Login Vault AppRole REFUSÉ (HTTP {{ apim_ss_approle.status | default('n/a') }})
      sur auth/approle/login
      (namespace={{ lookup('env', 'VAULT_NAMESPACE') | default('<aucun>', true) }}).
      Vérifier VAULT_ROLE_ID, VAULT_SECRET_ID_FILE (SecretID single-use si response
      wrapping : un rejeu échoue), et le namespace.
  when:
    - "apim_ss_vault_addr | length > 0"
    - "apim_ss_vault_token | default('') | length == 0"
    - "(lookup('env', 'VAULT_K8S_ROLE') | default('', true) | trim) | length == 0"
    - "apim_ss_vault_user | default('') | length == 0"

- name: "DEBUG : voie d'auth Vault + statuts (aucun secret — status/url seulement)"
  ansible.builtin.debug:
    msg:
      - "Vault addr={{ apim_ss_vault_addr }} mount_user={{ apim_ss_vault_user_mount | default('-') }} namespace={{ lookup('env','VAULT_NAMESPACE') | default('<aucun>', true) }}"
      - "user/pwd HTTP={{ apim_ss_userpass.status | default('skip') }} k8s HTTP={{ apim_ss_k8s.status | default('skip') }} approle HTTP={{ apim_ss_approle.status | default('skip') }}"
  when: "stoa_debug | default(false) | bool"

- name: "Vault : token effectif (statique > Kubernetes > user/password > AppRole)"
  ansible.builtin.set_fact:
    apim_ss_vault_token: >-
      {{ apim_ss_vault_token
         if (apim_ss_vault_token | default('') | length > 0)
         else ((apim_ss_k8s.json.auth.client_token | default(''))
               or (apim_ss_userpass.json.auth.client_token | default(''))
               or (apim_ss_approle.json.auth.client_token | default(''))) }}
  no_log: true
  when: "apim_ss_vault_addr | length > 0"

# ===== chemins KV effectifs ==================================================
# Le préfixe est OPTIONNEL : chez le client l'entrée peut vivre à PLAT à la
# racine du mount (ex. secret_DEV/data/APIM-TEST-ADMIN, conventions de nommage
# banque) — un chemin `<prefix>/<sub>` avec segment vide donnerait un slash
# final (404 Vault) ou double (301). `select` élimine les segments vides.
- name: "Vault : chemins KV effectifs (préfixe optionnel)"
  ansible.builtin.set_fact:
    apim_ss_kv_wm_path: >-
      {{ apim_ss_vault_kv_mount }}/data/{{ [apim_ss_vault_prefix, apim_ss_vault_wm_creds_sub] | select | join('/') }}
    apim_ss_kv_oauth_path: >-
      {{ apim_ss_vault_kv_mount }}/data/{{ [apim_ss_vault_prefix, apim_ss_vault_oauth_sub] | select | join('/') }}
  when: "apim_ss_vault_addr | length > 0"

# ===== BASIC : creds admin ===================================================
- name: "Vault : creds admin BASIC [KV v2]"
  ansible.builtin.uri:
    url: "{{ apim_ss_vault_addr }}/v1/{{ apim_ss_kv_wm_path }}"
    headers: "{{ apim_ss_vault_ns_headers | combine({'X-Vault-Token': apim_ss_vault_token}) }}"
    status_code: [200, 404]
    ca_path: "{{ apim_ss_ca_path | default('') or omit }}"
  register: apim_ss_kv_wm
  delegate_to: localhost
  failed_when: false          # le diagnostic est rendu par l'assert suivant (no_log masque tout)
  no_log: true
  when: "apim_ss_vault_addr | length > 0 and apim_ss_auth_mode == 'basic'"

- name: "Vault : creds admin BASIC — fail-closed AVEC diagnostic (aucun secret dans le message)"
  # 404 ACCEPTÉ (secret absent -> fallback vars) ; tout le reste est un refus à
  # expliquer. no_log n'est JAMAIS levé, même en stoa_debug (un run debug ne doit
  # pas pouvoir fuiter un secret dans un log Jenkins archivé) : le diagnostic
  # passe par ce message — code HTTP, URL KV, knobs — jamais une valeur.
  ansible.builtin.assert:
    that: "(apim_ss_kv_wm.status | default(0)) in [200, 404]"
    fail_msg: >-
      Lecture KV admin BASIC refusée (HTTP {{ apim_ss_kv_wm.status | default('n/a') }}) sur
      {{ apim_ss_vault_addr }}/v1/{{ apim_ss_kv_wm_path }}
      (namespace={{ lookup('env', 'VAULT_NAMESPACE') | default('<aucun>', true) }}).
      403 avec un token VIVANT = droits/chemin, pas le token : la policy doit couvrir
      « {{ apim_ss_vault_kv_mount }}/data/{{ apim_ss_vault_prefix }}/* » (segment data/
      OBLIGATOIRE en KV v2) dans LE namespace du token ; vérifier aussi le nom du mount
      (apim_ss_vault_kv_mount), le préfixe (apim_ss_vault_prefix), que le moteur est bien
      KV v2 (pas v1), et que VAULT_NAMESPACE est exporté dans l'ÉTAPE qui lance
      ansible-playbook (un token de namespace enfant appelé sans le header -> permission
      denied). Contre-preuve hors Ansible : scripts/diagnose-vault.sh, ou POST
      /v1/sys/capabilities-self {"paths":["<mount>/data/<prefix>/<sub>"]} avec le token.
  when: "apim_ss_vault_addr | length > 0 and apim_ss_auth_mode == 'basic'"

- name: "BASIC : résoudre user/password (Vault prioritaire, fallback PoC)"
  ansible.builtin.set_fact:
    apim_ss_wm_user: "{{ (apim_ss_kv_wm.json.data.data[apim_ss_vault_wm_user_key] | default('')) or apim_ss_wm_user }}"
    apim_ss_wm_password: "{{ (apim_ss_kv_wm.json.data.data[apim_ss_vault_wm_password_key] | default('')) or apim_ss_wm_password }}"
  no_log: true
  when: "apim_ss_auth_mode == 'basic'"

# ===== OAUTH2 : creds + get token ============================================
- name: "Vault : creds OAUTH2 admin [KV v2]"
  ansible.builtin.uri:
    url: "{{ apim_ss_vault_addr }}/v1/{{ apim_ss_kv_oauth_path }}"
    headers: "{{ apim_ss_vault_ns_headers | combine({'X-Vault-Token': apim_ss_vault_token}) }}"
    status_code: [200, 404]
    ca_path: "{{ apim_ss_ca_path | default('') or omit }}"
  register: apim_ss_kv_oauth
  delegate_to: localhost
  failed_when: false          # le diagnostic est rendu par l'assert suivant (no_log masque tout)
  no_log: true
  when: "apim_ss_vault_addr | length > 0 and apim_ss_auth_mode == 'oauth2'"

- name: "Vault : creds OAUTH2 — fail-closed AVEC diagnostic (aucun secret dans le message)"
  ansible.builtin.assert:
    that: "(apim_ss_kv_oauth.status | default(0)) in [200, 404]"
    fail_msg: >-
      Lecture KV OAUTH2 refusée (HTTP {{ apim_ss_kv_oauth.status | default('n/a') }}) sur
      {{ apim_ss_vault_addr }}/v1/{{ apim_ss_kv_oauth_path }}
      (namespace={{ lookup('env', 'VAULT_NAMESPACE') | default('<aucun>', true) }}).
      Mêmes causes que le mode basic : policy avec segment data/ (KV v2), mount, préfixe,
      namespace exporté dans l'étape ansible-playbook.
  when: "apim_ss_vault_addr | length > 0 and apim_ss_auth_mode == 'oauth2'"

- name: "OAUTH2 : résoudre token_url/client_id/secret/scope (Vault prioritaire)"
  ansible.builtin.set_fact:
    apim_ss_oauth_token_url: "{{ (apim_ss_kv_oauth.json.data.data[apim_ss_vault_oauth_token_url_key] | default('')) or apim_ss_oauth_token_url }}"
    apim_ss_oauth_client_id: "{{ (apim_ss_kv_oauth.json.data.data[apim_ss_vault_oauth_client_id_key] | default('')) or apim_ss_oauth_client_id }}"
    apim_ss_oauth_client_secret: "{{ (apim_ss_kv_oauth.json.data.data[apim_ss_vault_oauth_client_secret_key] | default('')) or apim_ss_oauth_client_secret }}"
    apim_ss_oauth_scope: "{{ (apim_ss_kv_oauth.json.data.data[apim_ss_vault_oauth_scope_key] | default('')) or apim_ss_oauth_scope }}"
  no_log: true
  when: "apim_ss_auth_mode == 'oauth2'"

- name: "OAUTH2 : fail-closed — méthode d'auth client connue"
  ansible.builtin.assert:
    that: "apim_ss_oauth_client_auth in ['post', 'basic']"
    fail_msg: "apim_ss_oauth_client_auth='{{ apim_ss_oauth_client_auth }}' inconnu (attendu post|basic)."
  when: "apim_ss_auth_mode == 'oauth2'"

- name: "OAUTH2 : obtenir un bearer (grant_type=client_credentials)"
  # Deux méthodes RFC 6749 : creds dans le corps (post) ou en Basic (basic — AS
  # local wM). En basic, le corps ne porte QUE grant_type/scope.
  ansible.builtin.uri:
    url: "{{ apim_ss_oauth_token_url }}"
    method: POST
    body_format: form-urlencoded
    body: >-
      {{ {'grant_type': 'client_credentials'}
         | combine({'client_id': apim_ss_oauth_client_id,
                    'client_secret': apim_ss_oauth_client_secret}
                   if apim_ss_oauth_client_auth == 'post' else {})
         | combine({'scope': apim_ss_oauth_scope} if (apim_ss_oauth_scope | length > 0) else {}) }}
    user: "{{ apim_ss_oauth_client_id if apim_ss_oauth_client_auth == 'basic' else omit }}"
    password: "{{ apim_ss_oauth_client_secret if apim_ss_oauth_client_auth == 'basic' else omit }}"
    force_basic_auth: "{{ true if apim_ss_oauth_client_auth == 'basic' else omit }}"
    status_code: [200]
    ca_path: "{{ apim_ss_ca_path | default('') or omit }}"
  register: apim_ss_token
  delegate_to: localhost
  failed_when: false          # le diagnostic est rendu par l'assert « bearer + fail-closed »
  no_log: true
  when: "apim_ss_auth_mode == 'oauth2'"

- name: "DEBUG : lecture KV admin (chemin + statut — jamais la valeur)"
  ansible.builtin.debug:
    msg: >-
      KV admin: mode={{ apim_ss_auth_mode }}
      basic[{{ apim_ss_kv_wm_path | default('-') }}]=HTTP {{ apim_ss_kv_wm.status | default('skip') }}
      oauth2[{{ apim_ss_kv_oauth_path | default('-') }}]=HTTP {{ apim_ss_kv_oauth.status | default('skip') }}
      bearer=HTTP {{ apim_ss_token.status | default('skip') }}
  when: "stoa_debug | default(false) | bool"

- name: "OAUTH2 : bearer + fail-closed si absent"
  when: "apim_ss_auth_mode == 'oauth2'"
  block:
    - ansible.builtin.set_fact:
        apim_ss_bearer: "{{ apim_ss_token.json.access_token | default('') }}"
      no_log: true
    - ansible.builtin.assert:
        that: "apim_ss_bearer | default('') | length > 0"
        fail_msg: >-
          Aucun bearer OAuth2 (HTTP {{ apim_ss_token.status | default('n/a') }}
          sur {{ apim_ss_oauth_token_url | default('<token_url vide>', true) }}) —
          vérifier token_url/client_id/client_secret/scope (Vault prioritaire,
          sinon vars apim_ss_oauth_*) et le CA (apim_ss_ca_path).

# ===== headers communs + defaults du module uri ==============================
# Accept + (X-Environment si env) + (Authorization Bearer si oauth2). Le mode
# basic ajoute user/password/force_basic_auth aux defaults du module.
- name: "Auth : headers communs (Accept + X-Environment + Bearer)"
  ansible.builtin.set_fact:
    apim_ss_headers: >-
      {{ {'Accept': 'application/json'}
         | combine({apim_ss_env_header: apim_ss_env} if (apim_ss_env | length > 0) else {})
         | combine({'Authorization': 'Bearer ' ~ apim_ss_bearer} if (apim_ss_auth_mode == 'oauth2') else {}) }}
  no_log: true

- name: "Auth : defaults du module uri (headers + auth basic si applicable)"
  ansible.builtin.set_fact:
    apim_ss_uri_defaults: >-
      {{ {'headers': apim_ss_headers, 'body_format': 'json'}
         | combine({'user': apim_ss_wm_user, 'password': apim_ss_wm_password, 'force_basic_auth': true}
                   if (apim_ss_auth_mode == 'basic') else {})
         | combine({'ca_path': apim_ss_ca_path} if (apim_ss_ca_path | default('') | length > 0) else {}) }}
  no_log: true
