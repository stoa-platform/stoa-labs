---
# roles/apim_common/tasks/teams-feature.yml — etat de la feature Teams.
#
# POURQUOI CE FICHIER EXISTE. `apim_ss_require_team` ne commandait que les deux
# assert (`TEAM_UNDEFINED`, `TEAM_CONFIRMED`) ; le travail reel — GET
# /accessProfiles, POST /assets/team — etait commande par `ss_team_name`, que le
# job pose TOUJOURS (`-e apim_ss_team=$TEAM`, derive de APIM_WM_CREDS_SUB). Le
# poser a false ne desactivait donc rien : constate le 2026-08-03 sur une
# gateway dont la feature est eteinte.
#
# LA LIGNE QUI COMPTE est la derniere de la table : feature ACTIVE + derogation
# posee => REFUS. Une derogation temporaire ne doit pas survivre par oubli a la
# cause qui l'a justifiee. Sans cette ligne, le jour ou le correctif passe en
# production, rien ne signale les environnements restes non cloisonnes.
#
# LA POLITIQUE EST UN PARAMETRE (`apim_teams_required`), PAS UNE VARIABLE LUE EN
# DUR : les deux roles consommateurs ont des espaces de noms distincts
# (`apim_ss_require_team` cote apim_selfservice_app, `apim_pub_require_team`
# cote apim_publish_api). Une sonde qui devinerait le nom de la variable serait
# inoperante dans l'un des deux — et silencieusement, puisqu'une variable
# absente retombe sur son defaut fail-closed `true`. C'est a l'appelant de dire
# quelle est sa politique en la passant explicitement.
#
# ETAT != POLITIQUE (correctif, revue post-Task 7, 2026-08-04). Deux notions
# distinctes se sont retrouvees ecrasees sur UN SEUL parametre
# (`apim_teams_required`), et ca a casse un troisieme appelant :
#   - `apim_selfservice_app` et `apim_publish_api` VEULENT une POLITIQUE :
#     « j'accepte (ou pas) de ne pas cloisonner ». Les 3 asserts ci-dessous —
#     y compris la derniere, qui tue une derogation perimee quand la feature
#     revient — sont exactement leur raison d'etre.
#   - `apim_team_onboard` ne veut que l'ETAT : « la feature est-elle active ? »
#     (`apim_teams_enabled`, pour un message informatif). Il ne cloisonne
#     rien lui-meme (il pose des objets RBAC, valables que la feature soit
#     allumee ou pas) et n'a donc AUCUNE derogation a faire perimer. Passer
#     `apim_teams_required: false` (pensant "je ne depends pas de la feature")
#     faisait pourtant executer le 3e assert TEAMS_DEROGATION_STALE, qui
#     REFUSE des que la feature redevient active — l'onboarding cassait donc
#     tres exactement le jour ou la situation qu'il documente se resout.
# `apim_teams_assert` (defaut `true`) separe les deux : a `false`, la sonde se
# contente de poser `apim_teams_enabled` (etat) et N'EXECUTE AUCUNE assertion
# ni l'avertissement de derogation (politique) — `apim_teams_required` devient
# alors sans objet et n'a pas besoin d'etre passe. Defaut `true` => comportement
# STRICTEMENT INCHANGE pour les deux roles existants.

- name: "Teams : sonde GET /configurations/extended (configId 'extended', PAS 'extendedSettings')"
  ansible.builtin.uri:
    url: "{{ apim_ss_api_base }}/configurations/extended"
  register: apim_ss_teams_probe
  changed_when: false
  failed_when: false
  when: "(apim_ss_teams_feature | default('auto')) == 'auto'"

- name: "Teams : la sonde a-t-elle abouti ?"
  ansible.builtin.set_fact:
    apim_ss_teams_probe_ok: >-
      {{ (apim_ss_teams_feature | default('auto')) != 'auto'
         or (apim_ss_teams_probe.status | default(0)) == 200 }}

# Fail-closed : ne pas savoir n'est pas une raison de passer. On ne refuse que
# si une team est exigee — sinon la sonde injoignable n'a aucune consequence.
- name: "Teams : FAIL-CLOSED — sonde injoignable alors qu'une team est exigee"
  ansible.builtin.assert:
    that: "apim_ss_teams_probe_ok | bool"
    fail_msg: >-
      TEAMS_PROBE_FAILED : GET {{ apim_ss_api_base }}/configurations/extended a
      rendu HTTP {{ apim_ss_teams_probe.status | default('(aucune reponse)') }}.
      L'etat de la feature Teams est inconnu et une team est exigee — on ne
      deploie pas dans le doute. Forcer apim_ss_teams_feature=off si la gateway
      ne porte pas cette surface.
  when:
    - "apim_teams_assert | default(true) | bool"
    - "apim_teams_required | default(true) | bool"

# La valeur est une CHAINE "true"/"false", pas un booleen JSON (mesure F4).
- name: "Teams : etat effectif de la feature"
  ansible.builtin.set_fact:
    apim_teams_enabled: >-
      {{ false if (apim_ss_teams_feature | default('auto')) == 'off'
         else ((apim_ss_teams_probe.json.enableTeamWork | default('false'))
               | string | lower == 'true') }}

- name: "Teams : FAIL-CLOSED — feature eteinte alors qu'une team est exigee"
  ansible.builtin.assert:
    that: "apim_teams_enabled | bool"
    fail_msg: >-
      TEAMS_DISABLED : la feature Teams est eteinte sur cette gateway et une
      team est exigee (apim_teams_required=true — le parametre que cette sonde
      lit, derive par l'appelant de sa propre variable de politique). Rien n'a
      ete ecrit. Soit activer la feature (geste d'ADMIN, hors pipeline :
      PUT /configurations/extended {"enableTeamWork":"true"}), soit poser la
      derogation dans l'inventaire de l'environnement — JAMAIS dans un
      manifeste — sur la variable REELLEMENT actionnable selon le role
      appelant : apim_ss_require_team=false (apim_selfservice_app) ou
      apim_pub_require_team=false (apim_publish_api).
  when:
    - "apim_teams_assert | default(true) | bool"
    - "apim_teams_required | default(true) | bool"

- name: "Teams : FAIL-CLOSED — derogation perimee (la feature est revenue)"
  ansible.builtin.assert:
    that: "not (apim_teams_enabled | bool)"
    fail_msg: >-
      TEAMS_DEROGATION_STALE : apim_teams_required=false (parametre lu par
      cette sonde, derive par l'appelant de sa propre variable de politique)
      alors que la feature Teams est ACTIVE sur cette gateway. La derogation
      avait pour cause une feature indisponible ; cette cause a disparu.
      Retirer la derogation de l'inventaire de l'environnement — sur la
      variable REELLEMENT actionnable selon le role appelant :
      apim_ss_require_team (apim_selfservice_app) ou apim_pub_require_team
      (apim_publish_api).
  when:
    - "apim_teams_assert | default(true) | bool"
    - "not (apim_teams_required | default(true) | bool)"

- name: "Teams : AVERTISSEMENT — cloisonnement desactive sur cet environnement"
  ansible.builtin.debug:
    msg: >-
      ⚠ TEAMS_OFF : feature Teams eteinte et derogation posee. Les applications
      et les APIs resteront en team Default — visibles et supprimables par
      toutes les equipes. Acceptable le temps qu'un correctif atteigne cet
      environnement, JAMAIS comme etat cible.
  when:
    - "apim_teams_assert | default(true) | bool"
    - "not (apim_teams_enabled | bool)"
