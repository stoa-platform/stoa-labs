---
# roles/apim_team_onboard/tasks/resolve.yml — quelle equipe, et quels noms.
#
# La garde du nom n'est pas de la validation de confort. Le nom d'equipe sert
# SIMULTANEMENT de segment de chemin Vault, de nom de policy et de nom de team :
# `team: ../autre` produirait le chemin `deploy/../autre/wm-admin`, c'est-a-dire
# les creds d'une AUTRE equipe. C'est une evasion de chemin.

- name: "Providers : charger la source declarative"
  ansible.builtin.include_vars:
    file: "{{ apim_onb_providers_file }}"
    name: onb_src

- name: "Providers : entree de l'equipe ciblee"
  ansible.builtin.set_fact:
    onb_entry: >-
      {{ (onb_src.providers | default([])
          | selectattr('team', 'equalto', apim_onb_team)
          | list | first) | default({}) }}

- name: "Providers : FAIL-CLOSED — l'equipe doit etre declaree"
  ansible.builtin.assert:
    that: "onb_entry | length > 0"
    fail_msg: >-
      TEAM_NOT_DECLARED : '{{ apim_onb_team }}' est absente de
      {{ apim_onb_providers_file }}. Une equipe s'onboarde par une entree revue
      dans ce fichier, pas par un parametre de ligne de commande.

- name: "Nom d'equipe : FAIL-CLOSED — forme imposee"
  # \Z, pas $ : en Python (regex du module `match`), `$` matche aussi juste
  # avant un `\n` final — "banking-demo\n" passerait le filtre alors que ce
  # `\n` n'a rien de legitime dans un segment de chemin Vault. \Z ancre sur la
  # fin de chaine stricte, sans cette exception.
  ansible.builtin.assert:
    that: "onb_entry.team is match('^[a-z0-9][a-z0-9-]{1,30}\\Z')"
    fail_msg: >-
      TEAM_NAME_INVALID : '{{ onb_entry.team }}' — attendu
      ^[a-z0-9][a-z0-9-]{1,30}\Z. Ce nom devient un segment de chemin Vault, un
      nom de policy et un nom de team : tout caractere hors de cette forme est
      une evasion de chemin en puissance.
    success_msg: "TEAM_NAME_OK : '{{ onb_entry.team }}'"

- name: "Derivations : les quatre noms, depuis les gabarits"
  ansible.builtin.set_fact:
    onb: >-
      {{ onb_entry | combine({
           'user':   apim_onb_user_tpl,
           'group':  apim_onb_group_tpl,
           'kv_sub': apim_onb_kv_tpl,
           'policy': apim_onb_policy_tpl }) }}
  vars:
    team: "{{ onb_entry.team }}"

# FAIL-CLOSED, AVANT TOUT USAGE de onb.kv_sub (correctif de la re-revue, I4bis
# 2026-08-04). tasks/vault.yml derive le perimetre de la policy du DOSSIER
# PARENT de la feuille que kv_sub designe (deploy/<team>/wm-admin ->
# deploy/<team>) — une derivation legitime UNIQUEMENT si ce dossier parent se
# termine par le nom d'equipe. Un gabarit apim_onb_kv_tpl surcharge qui ne
# respecte pas cette forme casse cette hypothese SANS LE DIRE :
#   - gabarit imbriquant le nom en dur ailleurs que comme dossier parent
#     (ex. "secret_DEV/flat-{{ team }}-admin", un seul segment de feuille) ->
#     le dossier parent devient "secret_DEV", PARTAGE par TOUTES les equipes.
#     La policy deploy-<team> accorderait alors `read` sur le KV de chaque
#     AUTRE equipe — la douve (preuve 3 de test-onboard-team.sh) tombe : 200
#     au lieu de 403.
#   - gabarit a PLAT, sans aucun `/` (cas reel documente en
#     apim_common/defaults/main.yml : « l'entree peut vivre a PLAT a la racine
#     du mount ») -> le dossier parent est VIDE, donc apres composition avec
#     apim_ss_vault_prefix la policy accorde `read` sur TOUT le prefixe —
#     y compris secret/data/stoa/gateways/* (creds admin de la gateway).
# Les deux cas remplacent un refus fail-closed (403 bruyant, l'ancien
# comportement code en dur) par un acces TROP LARGE et silencieux — pire que
# le defaut qu'ils corrigent. On refuse donc ICI, avant que vault.yml ne s'en
# serve, plutot que de laisser la policy se poser sur une hypothese fausse.
- name: "Derivations : FAIL-CLOSED — le gabarit KV doit imbriquer l'equipe comme dossier parent"
  ansible.builtin.assert:
    that: "(onb.kv_sub.split('/')[:-1] | last | default('')) == onb.team"
    fail_msg: >-
      TENANT_ROOT_UNSAFE : le gabarit KV '{{ onb.kv_sub }}' (apim_onb_kv_tpl)
      ne place pas '{{ onb.team }}' comme DERNIER SEGMENT de son dossier
      parent. tasks/vault.yml derive le perimetre de la policy Vault de ce
      dossier parent : s'il n'est pas nomme exactement par l'equipe (gabarit
      a plat, ou nom d'equipe encode dans le nom de fichier plutot que dans
      un dossier), la policy borne un sous-arbre PARTAGE par d'autres
      equipes — voire tout le prefixe Vault — au lieu du sous-arbre de CETTE
      equipe. Corriger apim_onb_kv_tpl pour qu'il imbrique l'equipe comme
      dossier parent (forme "deploy/<team>/wm-admin"), jamais comme
      fragment d'un nom de feuille ("flat-<team>-admin") ni omis (gabarit a plat).
    success_msg: "TENANT_ROOT_OK : '{{ onb.kv_sub }}' imbrique bien '{{ onb.team }}' comme dossier parent."

- name: "Derivations : journalisees (aucun secret)"
  ansible.builtin.debug:
    msg: >-
      equipe={{ onb.team }} user={{ onb.user }} groupe={{ onb.group }}
      kv={{ onb.kv_sub }} policy={{ onb.policy }}
