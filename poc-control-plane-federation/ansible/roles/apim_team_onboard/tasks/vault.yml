---
# roles/apim_team_onboard/tasks/vault.yml — le secret, le KV, la policy.
#
# VAULT AVANT LA GATEWAY, et ce n'est pas cosmetique. Le mot de passe n'existe
# qu'une fois. Genere, pose sur la gateway, puis ecriture Vault en echec => un
# compte VIVANT dont le secret est PERDU, a reinitialiser a la main. Dans
# l'autre sens, un secret ecrit dont le compte n'existe pas est inoffensif : le
# run suivant le reprend.
#
# LE SECRET N'EST GENERE QUE S'IL EST ABSENT. Un re-run ne fait pas tourner le
# mot de passe — sinon rejouer l'onboarding casserait tous les jobs de l'equipe.
# La rotation est un geste separe, jamais un effet de bord.

- name: "Vault : chemins effectifs (prefixe optionnel, meme convention que secrets.yml)"
  ansible.builtin.set_fact:
    onb_kv_path: "{{ apim_ss_vault_kv_mount }}/data/{{ [apim_ss_vault_prefix, onb.kv_sub] | select | join('/') }}"
    onb_kv_logical: "{{ [apim_ss_vault_prefix, onb.kv_sub] | select | join('/') }}"

- name: "Vault : l'entree existe-t-elle deja ?"
  ansible.builtin.uri:
    url: "{{ apim_ss_vault_addr }}/v1/{{ onb_kv_path }}"
    headers: { X-Vault-Token: "{{ apim_ss_vault_token }}" }
    status_code: [200, 404]
    ca_path: "{{ apim_ss_ca_path | default('') or omit }}"
  register: onb_kv_get
  delegate_to: localhost
  changed_when: false
  no_log: true

- name: "Vault : generer le mot de passe UNIQUEMENT s'il est absent"
  ansible.builtin.set_fact:
    onb_password: "{{ lookup('password', '/dev/null length=' ~ (apim_onb_password_bytes | int * 2) ~ ' chars=hexdigits') }}"
    onb_password_created: true
  no_log: true
  when: "onb_kv_get.status == 404"

- name: "Vault : sinon reprendre celui qui est stocke (aucune rotation au re-run)"
  ansible.builtin.set_fact:
    onb_password: "{{ onb_kv_get.json.data.data[apim_ss_vault_wm_password_key] }}"
    onb_password_created: false
  no_log: true
  when: "onb_kv_get.status == 200"

- name: "Vault : ecrire l'entree KV v2 (username + password)"
  # Les noms de CHAMPS sont dynamiques (apim_ss_vault_wm_user_key/_password_key,
  # knobs client). ECRIRE "{{ var }}": valeur comme cle de mapping YAML NE LES
  # TEMPLATE PAS — Jinja ne re-templite pas une cle ecrite comme chaine
  # litterale "{{ ... }}" a l'interieur d'un dict YAML : la cle POSEE serait
  # alors le texte "{{ apim_ss_vault_wm_user_key }}", pas "username" (constate
  # a la contre-epreuve : Vault recevait des champs nommes litteralement
  # "{{ ... }}"). Construire le dict en Jinja natif — variables NUES comme cles
  # dans une SEULE expression {{ }} — est la forme qui fonctionne.
  ansible.builtin.uri:
    url: "{{ apim_ss_vault_addr }}/v1/{{ onb_kv_path }}"
    method: POST
    headers: { X-Vault-Token: "{{ apim_ss_vault_token }}" }
    body_format: json
    body: "{{ {'data': {apim_ss_vault_wm_user_key: onb.user, apim_ss_vault_wm_password_key: onb_password}} }}"
    status_code: [200, 204]
    ca_path: "{{ apim_ss_ca_path | default('') or omit }}"
  delegate_to: localhost
  no_log: true
  when: "onb_password_created | bool"

# La policy borne le perimetre au SEUL sous-arbre de l'equipe. C'est la douve :
# se reclamer de l'equipe X exige de savoir lire deploy/X/wm-admin (ADR-077).
#
# ⚠ FORME REPRISE VERBATIM de l'ancienne boucle de scripts/setup-vault-userpass.sh
# (retiree par ce meme commit — cf. son historique git — qui creait deja cette
# policy avant ce role). L'ECRITURE sur apps/* n'est PAS decorative :
# c'est le mode OAuth2 `internal`, ou celui qui deploie une application de son
# tenant y stocke le client genere par la gateway. Une policy en LECTURE SEULE
# — ce que ce plan proposait avant la revue du 2026-08-04 — casserait ces
# deploiements EN SILENCE, et le symptome apparaitrait loin de la cause.
# CORRECTION INTER-TACHES (Task 8, ansible-core 2.19.4 — meme classe que
# main.yml:31, cf. son commentaire). `onb.policy` remplace par `apim_onb_team`
# (le parametre d'entree, disponible des le parse) plutot que de recomposer le
# gabarit `apim_onb_policy_tpl` ici (dupliquerait sa forme, divergerait si le
# gabarit est surcharge cote client) — un nom de tache est cosmetique, le
# perimetre reel de la policy est dans son HCL plus bas, jamais dans son nom.
- name: "Vault : policy deploy de l'equipe '{{ apim_onb_team }}' (lecture du sous-arbre, ecriture bornee a apps/)"
  vars:
    # DERIVE de onb.kv_sub, JAMAIS reconstruit (I4, revue finale 2026-08-04).
    # Avant ce correctif, onb_tenant_root recomposait le chemin en dur
    # ([apim_ss_vault_prefix, 'deploy', onb.team]) au lieu de le deriver du
    # gabarit onb.kv_sub (apim_onb_kv_tpl, documente SURCHARGEABLE en
    # defaults/main.yml). Chez un client dont la disposition KV differe,
    # surcharger ce gabarit deplacait alors l'entree KV mais PAS le perimetre
    # de la policy : le token de l'equipe perdait le droit de lire son propre
    # secret, sans qu'aucun assert ne le signale (verify.yml relit avec le
    # token ROOT, jamais avec la policy) — symptome : un 403 loin de sa cause.
    # Ici le "sous-arbre du tenant" est le dossier PARENT de la feuille que
    # kv_sub designe (deploy/<team>/wm-admin -> deploy/<team>) : ne jamais
    # denormaliser ici ce qui se derive la-bas (le gabarit, resolve.yml).
    onb_tenant_root: "{{ ([apim_ss_vault_prefix] + onb.kv_sub.split('/')[:-1]) | select | join('/') }}"
  ansible.builtin.uri:
    url: "{{ apim_ss_vault_addr }}/v1/sys/policies/acl/{{ onb.policy }}"
    method: PUT
    headers: { X-Vault-Token: "{{ apim_ss_vault_token }}" }
    body_format: json
    body:
      policy: |
        # Perimetre de deploiement du tenant {{ onb.team }}.
        # LECTURE sur tout le sous-arbre du tenant ; ECRITURE limitee au seul
        # sous-arbre apps/ (mode OAuth2 internal : celui qui deploie une app de
        # SON tenant y stocke le client genere par la gateway — jamais ailleurs,
        # jamais un autre tenant). La segregation reste ENFORCEE ici, pas dans
        # le pipeline.
        path "{{ apim_ss_vault_kv_mount }}/data/{{ onb_tenant_root }}/*"          { capabilities = ["read"] }
        path "{{ apim_ss_vault_kv_mount }}/metadata/{{ onb_tenant_root }}/*"      { capabilities = ["read", "list"] }
        path "{{ apim_ss_vault_kv_mount }}/data/{{ onb_tenant_root }}/apps/*"     { capabilities = ["create", "update", "read"] }
        path "{{ apim_ss_vault_kv_mount }}/metadata/{{ onb_tenant_root }}/apps/*" { capabilities = ["read", "list"] }
    status_code: [200, 204]
    ca_path: "{{ apim_ss_ca_path | default('') or omit }}"
  delegate_to: localhost
  # no_log : cet appel porte X-Vault-Token dans ses headers, comme tout uri
  # de ce fichier — convention deja tenue par apim_common/tasks/secrets.yml.
  # Sans lui, un echec (mauvais code HTTP, reseau, body malforme) imprime
  # invocation.module_args dans la sortie du run, TOKEN EN CLAIR (root, au lab).
  no_log: true

- name: "Vault : etat (aucun secret dans le message)"
  ansible.builtin.debug:
    msg: >-
      KV={{ onb_kv_logical }}
      ({{ 'secret genere' if onb_password_created | bool else 'secret existant repris' }}),
      policy={{ onb.policy }}
