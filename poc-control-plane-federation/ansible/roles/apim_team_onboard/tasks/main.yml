---
# roles/apim_team_onboard/tasks/main.yml — onboarding d'UNE equipe.
#
# ORDRE NON NEGOCIABLE : resolve -> vault -> gateway -> verify.
# Vault avant la gateway parce qu'un secret orphelin est inoffensif alors qu'un
# compte vivant au secret perdu ne l'est pas (cf. en-tete de vault.yml).
#
# La sonde Teams ne conditionne RIEN ici : users, groupes et accessProfiles sont
# des objets RBAC qui existent independamment du cloisonnement. Le role les pose
# dans tous les cas et DIT ce qu'il en est — c'est ce qui permet d'onboarder
# pendant qu'un correctif attend sa validation.

- name: "Onboarding : resoudre l'equipe et ses noms derives"
  ansible.builtin.import_tasks: resolve.yml

- name: "Onboarding : secrets d'admin gateway (Vault, fallback PoC)"
  ansible.builtin.import_role:
    name: apim_common
    tasks_from: secrets.yml

- name: "Onboarding — equipe '{{ onb.team }}'"
  module_defaults:
    ansible.builtin.uri: "{{ apim_ss_uri_defaults }}"
  block:
    # ECART AU BRIEF (declare, correctif) : le brief place cet import_role
    # HORS du bloc module_defaults, avec `apim_ss_require_team: false` en var.
    # Constate a la contre-epreuve (mock 18093) : GET /configurations/extended
    # part alors SANS les headers/auth basic (apim_ss_uri_defaults ne
    # s'applique qu'aux taches DANS ce bloc) -> HTTP 401, TEAMS_PROBE_FAILED,
    # l'onboarding entier avorte. Deplacer l'import DANS le bloc (module_defaults
    # couvre l'appel) corrige ce premier piege.
    #
    # DEUXIEME BUG (revue post-Task 7, 2026-08-04) : la premiere correction
    # posait `apim_teams_required: false`, en pensant "je ne depends pas de la
    # feature". Faux repos : ce parametre commande une POLITIQUE de derogation
    # (les 3 asserts de teams-feature.yml), pas juste un etat — et sa 3e
    # assertion REFUSE (TEAMS_DEROGATION_STALE) des que la feature redevient
    # active alors qu'une derogation est posee. L'onboarding cassait donc tres
    # exactement le jour ou le correctif client (qui rallume Teams) passe en
    # prod — jamais vu au lab, ou la feature est toujours restee eteinte.
    # `apim_team_onboard` ne veut que l'ETAT (`apim_teams_enabled`, message
    # informatif) : il ne cloisonne rien lui-meme, donc n'a AUCUNE derogation a
    # faire perimer. `apim_teams_assert: false` (et non plus
    # `apim_teams_required`) exprime exactement ca — cf. teams-feature.yml,
    # section « ETAT != POLITIQUE » pour le detail des deux parametres.
    - name: "Onboarding : etat de la feature Teams (informatif ici)"
      ansible.builtin.import_role:
        name: apim_common
        tasks_from: teams-feature.yml
      vars:
        apim_teams_assert: false     # ETAT seulement — l'onboarding n'arbitre aucune politique
    - ansible.builtin.import_tasks: vault.yml
    - ansible.builtin.import_tasks: gateway.yml
    - ansible.builtin.import_tasks: verify.yml

- name: "Onboarding : etat de cloisonnement de l'equipe posee"
  ansible.builtin.debug:
    msg: >-
      {{ 'Equipe ' ~ onb.team ~ ' posee et ACTIVE : la feature Teams est allumee.'
         if apim_teams_enabled | bool
         else 'Equipe ' ~ onb.team ~ ' posee ; feature Teams ETEINTE — les objets '
              ~ 'existent, leur effet de cloisonnement est DORMANT jusqu a '
              ~ 'reactivation. Rien a rejouer le moment venu.' }}
