---
# roles/apim_team_onboard/defaults/main.yml
#
# LES GABARITS SONT LA CONVENTION. Elle n'existait nulle part : elle etait
# encodee deux fois dans un `cut -d/ -f2` (Jenkinsfile.selfservice:191,
# Jenkinsfile.publish-api:153) que rien ne nommait. La declarer ici la rend
# ASSERTABLE, et garantit que ce que l'onboarding pose et ce que le runtime
# derive ne peuvent pas diverger.
#
# Chez un client dont la disposition KV differe, surcharger apim_onb_kv_tpl —
# et poser APIM_TEAM dans le CI, puisque la derivation par cut ne s'applique
# plus.
apim_onb_user_tpl: "svc-{{ team }}"
apim_onb_group_tpl: "{{ team }}-devs"
apim_onb_kv_tpl: "deploy/{{ team }}/wm-admin"
apim_onb_policy_tpl: "deploy-{{ team }}"

# Groupe systeme dont l'appartenance conditionne l'acces a l'API d'admin
# (sinon 403 sur GET /apis). Distinct de la team : deux gestes, pas un.
apim_onb_system_group: "API-Gateway-Providers"

# Bitmask de privileges. Defaut = celui du profil systeme API-Gateway-Providers,
# comme le bootstrap F4. Le retrait de POST /apis (D6) n'est PAS tranche : il
# exige de lire les noms en console puis un bit-flip sur un profil JETABLE, avec
# capture du bitmask d'avant comme rollback. Le jour ou c'est tranche, cette
# valeur suffit a propager.
apim_onb_privilege: "111100101101100000001"

# Source declarative, relative au repertoire ansible/.
apim_onb_providers_file: "providers.dev.yml"

# Equipe ciblee. resolve.yml exige une correspondance EXACTE avec une entree
# de apim_onb_providers_file — vide ne balaie PAS tout le fichier, ca echoue
# juste TEAM_NOT_DECLARED (aucune entree n'a team: ""). Le playbook d'onboarding
# rend cette variable obligatoire par construction (-e apim_onb_team=<equipe>) :
# ce defaut n'est qu'un filet, pas une valeur destinee a servir telle quelle.
apim_onb_team: ""

# Longueur du mot de passe genere (hex, donc 2 caracteres par octet).
apim_onb_password_bytes: 12

# Mode VAULT-SEUL (apim_onb_gateway=false) : pose la policy + l'entree KV,
# SAUTE gateway.yml (huit appels HTTP sur apim_ss_api_base) et la relecture
# des objets gateway en verify.yml. Sert au bootstrap qui n'a besoin que du
# perimetre Vault d'une equipe (scripts/setup-vault-userpass.sh) — un
# onboarding complet, distinct, pose ensuite le user/groupe/team/groupe
# systeme. Defaut true : le comportement existant (onboarding complet,
# gateway comprise) reste inchange pour tout appelant qui ne surcharge pas
# ce booleen.
apim_onb_gateway: true

# G4 (ADR-082) : paliers ou le tenant a le DROIT D'ECRIRE ses secrets d'app
# (deploy/<t>/apps/<app>/<env>/...). Defaut FAIL-CLOSED : le palier d'authoring
# seul. Le playbook onboard-team.yml derive la vraie liste d'env_chain_nonprod
# — le terminus n'y entre JAMAIS (une ecriture d'app au terminus meurt en 403,
# structurellement : c'est la retention de credential, pas un if).
apim_onb_write_envs: ["dev"]
