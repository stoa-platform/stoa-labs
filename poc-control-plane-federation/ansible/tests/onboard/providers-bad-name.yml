---
# Le nom d'equipe sert de segment de chemin Vault, de nom de policy ET de nom
# de team. `../autre` sortirait du chemin KV : c'est une evasion de chemin qui
# donnerait a une equipe les creds d'une autre, pas une coquetterie.
providers:
  - team: "../insurance-demo"
    description: "evasion de chemin"
    repo: "x/y"
    approvers: []
  # \n final : en Python `$` matche aussi juste avant un \n de fin de chaine —
  # `is match('^[a-z0-9][a-z0-9-]{1,30}$')` laisserait donc passer ce nom. La
  # garde doit ancrer sur \Z (fin de chaine stricte), pas $.
  - team: "banking-demo\n"
    description: "evasion via \\n final ($ vs \\Z)"
    repo: "x/y"
    approvers: []
