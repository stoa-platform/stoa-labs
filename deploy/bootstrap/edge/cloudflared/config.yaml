tunnel: 1ee00e23-1705-4451-b4b4-e79ffc2d56e2
credentials-file: /etc/cloudflared/creds/credentials.json
metrics: 0.0.0.0:2000
no-autoupdate: true

# cloudflared joint les Services par leur nom DNS interne. Aucun Ingress
# n'est créé, aucun port n'est ouvert : la connexion vers Cloudflare est
# SORTANTE. La contre-épreuve F3 (« aucun Ingress dans wm, ClusterIP only »)
# reste donc vraie telle qu'elle a été prouvée.
ingress:
  - hostname: gitea.labs.gostoa.dev
    service: http://gitea.ci.svc.cluster.local:3000

  - hostname: jenkins.labs.gostoa.dev
    service: http://jenkins.ci.svc.cluster.local:8080

  # Console d'administration webMethods.
  - hostname: wm.labs.gostoa.dev
    service: http://wm-apigateway.wm.svc.cluster.local:9072

  # REST d'administration webMethods — cible de la collection Postman
  # (gwUrl=https://wm-api.labs.gostoa.dev, gwBasePath=/rest/apigateway).
  # Attendre des 502 pendant ~3 min toutes les 20 min : c'est le CronJob
  # de licence `wm-restarter`, pas le tunnel.
  - hostname: wm-api.labs.gostoa.dev
    service: http://wm-apigateway.wm.svc.cluster.local:5555

  # Tout nom non listé est refusé plutôt que routé par défaut.
  - service: http_status:404
