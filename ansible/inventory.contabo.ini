# inventory.contabo.ini — flotte Contabo (labs)
#
# AUCUNE IP EN GIT. Les hôtes sont désignés par leurs ALIAS ~/.ssh/config, qui
# portent HostName, User et IdentityFile. Cohérent avec la règle en vigueur
# (cf. scripts/ops/vps-inventory.sh du repo `stoa` : « IPs sourced from env vars »)
# et avec l'allowlist gitleaks, qui ne tolère les IP que sous deploy/vps/.
#
# Prérequis : les alias worker-1..5 résolus par ~/.ssh/config, et un agent SSH
# chargé (ou IdentityFile en clair dans la config).

# Nœuds au repos — cible par DÉFAUT du bench : mesure propre, aucune charge à
# perturber.
[contabo_idle]
worker-1
worker-2
worker-4

# Nœuds portant une charge vivante. Le rôle REFUSE de s'y exécuter tant que le
# load average dépasse le seuil ; c'est volontaire. Ne forcer qu'en fenêtre.
[contabo_cluster]
worker-3      # k3s agent + webMethods 10.15 + Elasticsearch (Docker) + Caddy
worker-5      # k3s control-plane

[contabo:children]
contabo_idle
contabo_cluster

# ---------------------------------------------------------------------------
# Cluster k3s CIBLE (cluster.yml). Distinct des groupes de bench ci-dessus.
#
# Topologie : 1 plan de contrôle + N agents, datastore kine/SQLite, PAS d'etcd
# en HA — écarté par la mesure fsync du 2026-07-27 (p99 sur le seuil amont).
#
# Le plan de contrôle est placé sur worker-1 et non sur worker-5 : à méthode
# identique (dd, écriture synchrone 2300 o), worker-1 mesure 2,67 ms/op contre
# 6,53 ms/op pour worker-5. Le composant le plus sensible au fsync de toute la
# pile était posé sur la machine la plus lente mesurée.
# Réserve honnête : worker-5 était aussi le seul chargé au moment de la mesure,
# donc « lent » et « occupé » n'y sont pas séparables — mais dans les deux cas
# un nœud vide au disque mesuré meilleur est strictement préférable.
[k3s_server]
worker-1

# worker-3 et worker-5 rejoindront ce groupe APRÈS la bascule du trafic et la
# dépose de l'ancien cluster ; ils portent encore une charge en service.
#
# ══ worker-2 est VOLONTAIREMENT ABSENT — contrainte réseau de l'hébergeur ══
#
# Mesuré le 2026-07-27, matrice de joignabilité TCP/22 (port explicitement
# autorisé « from Anywhere » par ufw sur les deux machines) :
#
#   worker-1  ↔  worker-2    BLOQUÉ (dans les deux sens)
#   worker-1  ↔  worker-4    OK
#   worker-2  ↔  worker-4    OK
#
# worker-1 et worker-2 sont les deux SEULES machines de la flotte à partager un
# même sous-réseau /18 ; les autres sont chacune dans une plage distincte.
# (Les adresses ne sont pas reproduites ici : elles vivent dans ~/.ssh/config,
# conformément à la règle « aucune IP en Git » énoncée en tête de ce fichier.
# Pour rejouer la mesure : `vps_verify` puis un test TCP entre alias.)
#
# Le blocage est EXTÉRIEUR aux VM — ufw autorise le port des deux côtés, et le
# trafic part vers la passerelle du segment, qui le jette : Contabo isole les
# VPS clients d'un même segment L2. Aucun réglage invité n'y remédie.
#
# Conséquence d'architecture : flannel exige une connectivité de PAIRE À PAIRE
# entre tous les nœuds. worker-1 et worker-2 ne peuvent donc PAS appartenir au
# même cluster. Le cluster plafonne à 4 nœuds : un seul de {worker-1, worker-2},
# plus worker-3, worker-4, worker-5 (chacun dans une plage distincte).
#
# Ceci explique rétrospectivement la « dérive » du cluster précédent :
# deploy/k3s-gateways/setup.sh vise « w1 + w2 » — une topologie qui n'a JAMAIS
# pu fonctionner. La réalité « w5 + w3 » n'était pas de la négligence, elle était
# imposée par le réseau. Le script est faux, pas l'exploitation.
#
# worker-2 n'est pas perdu : il reste disponible pour toute charge qui n'exige
# pas l'appartenance au cluster (exécuteur de CI, banc de mesure, lab isolé).
#
# Contournement possible mais NON INSTRUIT : un réseau overlay (Headscale/
# Netbird/Tailscale) relaierait w1↔w2. Cela relève de l'hypothèse H2, restée
# sans preuve dans la recherche du 27/07 — à ne pas improviser ici.
[k3s_agents]
worker-4

[k3s_cluster:children]
k3s_server
k3s_agents

# Hôte portant Caddy, terminaison TLS et point d'entrée du trafic public.
# C'est lui qui décide quel cluster sert : la bascule (cutover.yml) ne change
# qu'une ligne de son Caddyfile, sans toucher au DNS — les quatre noms k3s
# résolvent déjà vers cette machine, proxy Cloudflare désactivé.
[caddy]
worker-3

[contabo:vars]
ansible_user=hegemon
ansible_python_interpreter=/usr/bin/python3

[k3s_cluster:vars]
ansible_user=hegemon
ansible_python_interpreter=/usr/bin/python3
