---
# roles/cluster_backup/defaults/main.yml
#
# Sauvegarde du plan de contrôle — ce qui rend le cluster réellement récupérable.
#
# POURQUOI CE RÔLE EXISTE. Toute la décision d'écarter la haute disponibilité
# repose sur une phrase : « le cluster est reconstructible depuis Git ». Elle est
# vraie des charges — les overlays et les Applications Argo CD la rendent vraie.
# Elle est FAUSSE d'au moins un objet : `stoa-gateway-secrets`, créé à la main,
# absent de tout dépôt, et qui n'existe plus qu'ici depuis la mise au rebut de
# l'ancien cluster. Sans sauvegarde, perdre worker-1 c'est perdre définitivement
# trois identifiants que rien ne régénère.
#
# CE QU'IL FAUT POUR RESTAURER, et pourquoi les deux sont indispensables :
#   - `state.db` : le datastore kine/SQLite, qui contient TOUS les objets, dont
#     les Secrets ;
#   - `server/cred/` : notamment `encryption-config.json`. Le cluster tourne avec
#     `--secrets-encryption` (aescbc), donc les Secrets sont chiffrés AU REPOS
#     dans state.db. Une sauvegarde du seul datastore serait illisible — un faux
#     sentiment de sécurité, la pire des sauvegardes.
#   - `server/token` : nécessaire pour que les agents rejoignent après restauration.
#
# CE N'EST PAS un remplacement du rebuild-from-Git, c'est son complément : Git
# reconstruit la forme, la sauvegarde restitue ce que Git ignore.

k3s_data_dir: "/var/lib/rancher/k3s/server"
backup_dir: "/var/lib/k3s-backups"

# Copie hors-nœud. Une sauvegarde qui ne survit pas à la perte de la machine
# qu'elle sauvegarde ne sert à rien. Cible : worker-2 — HORS cluster (isolation
# L2 Contabo w1↔w2), donc il survit à la perte de n'importe quel nœud du
# cluster. Joignabilité et espace (361 Go) mesurés le 2026-07-29 (F2). Le
# transfert relaie par le poste de contrôle : les workers ne se font toujours
# pas confiance en SSH entre eux.
backup_offsite_host: "worker-2"
backup_offsite_dir: "/var/lib/k3s-backups/offsite"

# Staging local des archives PVC sur leur nœud porteur : la fenêtre de
# quiescence dure le temps d'un tar sur disque local (secondes), pas le temps
# d'un transfert WAN via le poste de contrôle (minutes).
backup_pvc_staging_dir: "/var/lib/k3s-backups/pvc"

# Rétention (nombre d'archives conservées de chaque côté).
backup_keep: 7

# ATTENTION — l'archive contient la clé de chiffrement des Secrets ET les
# kubeconfigs d'administration. Elle vaut un accès cluster-admin complet.
# Elle est donc créée en 0600 root, et ne doit JAMAIS être versionnée,
# téléversée, ni sortie de la flotte sans chiffrement supplémentaire.
backup_mode: "0600"

# Namespaces dont les PVC local-path sont sauvegardés.
#
# `wm` ajouté par F5 : la bascule Caddy fait du PVC ES du ns wm la seule source
# de vérité de la gateway PUBLIQUE. Le sauvegarder est un prérequis BLOQUANT de
# la bascule, pas une amélioration — jusqu'ici ce PVC n'avait aucune copie.
#
# Attention : ce paramètre pilote DEUX choses — les PVC archivés, et les
# namespaces dont toutes les charges sont quiescées puis redémarrées. Y ajouter
# un namespace quiesce donc tout ce qu'il contient.
backup_pvc_namespaces:
  - ci
  - wm
# Racine des volumes local-path sur les nœuds.
backup_localpath_root: "/var/lib/rancher/k3s/storage"

# Charges NON quiescées pendant la sauvegarde (format kind/name, en minuscules).
# Vault y est tant que la détention des parts de descellement n'est pas prouvée
# (handoff F1) : un Vault redémarré revient SCELLÉ, et sans parts le socle est
# mort. Son PVC est archivé à chaud sous garde d'empreinte (voir pvc.yml).
# Quand l'exploitant aura prouvé la détention (procédure non destructive du
# handoff F1), vider cette liste restitue la quiescence pleine.
#
# F5 : l'ES du ns `wm` n'est PAS ici, et c'est délibéré. Contrairement à Vault,
# il ne revient pas scellé d'un redémarrage — il est donc pleinement quiesçable.
# Et le pod gateway est de toute façon interrompu 150 s toutes les 20 min par le
# cycle trial : la fenêtre ne coûte aucune indisponibilité qui n'existe pas déjà.
backup_hot_workloads:
  - statefulset/vault

# Applications Argo CD dont l'auto-sync est suspendu pendant la fenêtre de
# sauvegarde : selfHeal revert la mise à zéro des répliques en ~5 s (mesuré au
# lot 1) — la fenêtre de synchronisation est la vraie réponse, la garde
# post-archive n'est plus qu'une défense en profondeur.
#
# TOUTE Application dont une charge est quiescée doit figurer ici, sinon
# selfHeal remonte les répliques pendant l'archivage. Les trois Applications du
# ns `wm` sont donc listées : F5 y quiesce ES, la gateway et le backend.
# La capture d'état échoue FERMÉE si une Application nommée ici n'existe pas
# (`kubectl get application <nom>` sans ignore_errors) — c'est voulu : une
# fenêtre qui laisse une Application non suspendue serait silencieusement
# inefficace. Corollaire : ne pas jouer la sauvegarde avant que la PR posant
# `wm-backend-dev` soit mergée et synchronisée.
backup_sync_window_apps:
  - ci-gitea
  - ci-jenkins
  - ci-vault
  - wm-elasticsearch
  - wm-apigateway
  - wm-backend-dev
backup_argocd_namespace: "argocd"
