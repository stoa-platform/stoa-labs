---
# roles/k3s_agent/tasks/main.yml
#
# Idempotent, fail-closed, read-back-assert. Le nœud n'est déclaré joint que
# lorsque le PLAN DE CONTRÔLE le voit Ready — pas quand l'installeur sort 0.

- name: "Collecter les faits"
  ansible.builtin.setup:
    gather_subset:
      - network
      - hardware

# --- Garde : hôte vide --------------------------------------------------------
- name: "Garde : conteneurs Docker en service"
  ansible.builtin.command:
    cmd: docker ps -q
  register: k3s_agent_docker_ps
  changed_when: false
  failed_when: false

- name: "Garde : REFUSER de joindre un hôte qui porte une charge"
  ansible.builtin.assert:
    that:
      - (k3s_agent_docker_ps.stdout | default('') | trim) == ''
    fail_msg: >-
      REFUS : {{ inventory_hostname }} porte une charge Docker en service.
      Sur worker-3 (webMethods 10.15 + Elasticsearch + Caddy), la jonction n'est
      légitime qu'à l'étape de bascule, en levant explicitement la garde :
      -e k3s_require_empty_host=false
    success_msg: "hôte vide — OK"
  when: k3s_require_empty_host and not k3s_force

- name: "Garde : RAM libre suffisante"
  ansible.builtin.assert:
    that:
      - ansible_memfree_mb | int >= k3s_min_free_mb
    fail_msg: "REFUS : {{ ansible_memfree_mb }} Mo libres < {{ k3s_min_free_mb }} Mo exigés."

# --- Prérequis WireGuard (identique au serveur) -------------------------------
- name: "Charger le module noyau wireguard"
  community.general.modprobe:
    name: wireguard
    state: present
  become: true

- name: "Read-back : module wireguard chargé"
  ansible.builtin.command:
    cmd: lsmod
  register: k3s_agent_lsmod
  changed_when: false

- name: "Assert : wireguard chargé (sinon trafic de pods EN CLAIR sur IP publiques)"
  ansible.builtin.assert:
    that:
      - "'wireguard' in k3s_agent_lsmod.stdout"
    fail_msg: "REFUS : module wireguard absent sur {{ inventory_hostname }}."

- name: "Rendre le chargement persistant au reboot"
  ansible.builtin.copy:
    dest: /etc/modules-load.d/wireguard.conf
    content: "wireguard\n"
    owner: root
    group: root
    mode: "0644"
  become: true

# --- Jonction ------------------------------------------------------------------
- name: "Résoudre l'URL du serveur et le jeton depuis le plan de contrôle"
  ansible.builtin.set_fact:
    k3s_url: "{{ hostvars[groups[k3s_server_group][0]]['k3s_server_url'] }}"
    k3s_token: "{{ hostvars[groups[k3s_server_group][0]]['k3s_join_token'] }}"
  no_log: true

- name: "Assert : jeton et URL disponibles (le play serveur doit avoir tourné)"
  ansible.builtin.assert:
    that:
      - k3s_url is defined and k3s_url | length > 0
      - k3s_token is defined and k3s_token | length > 0
    fail_msg: >-
      Jeton ou URL de jonction indisponible. Le play `k3s_server` doit s'exécuter
      dans la MÊME invocation (les faits vivent en mémoire, jamais sur disque).

- name: "Installer et joindre l'agent k3s (version épinglée)"
  ansible.builtin.shell:
    cmd: >-
      curl -sfL https://get.k3s.io |
      INSTALL_K3S_VERSION='{{ k3s_version }}'
      K3S_URL='{{ k3s_url }}'
      K3S_TOKEN='{{ k3s_token }}'
      INSTALL_K3S_EXEC='agent
      --node-name={{ k3s_node_name }}
      --node-external-ip={{ ansible_default_ipv4.address }}'
      sh -s -
  args:
    creates: /usr/local/bin/k3s
  become: true
  no_log: true

- name: "Attendre que le service k3s-agent soit actif"
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
  become: true

# --- Read-back-assert DEPUIS LE PLAN DE CONTRÔLE ------------------------------
# On ne demande pas à l'agent s'il va bien : on demande au serveur s'il le voit.
# Deux temps, et c'est nécessaire : `kubectl wait` échoue IMMÉDIATEMENT avec
# « nodes "x" not found » si l'objet n'existe pas encore — il attend qu'une
# condition devienne vraie, pas qu'une ressource apparaisse. On attend donc
# d'abord l'enregistrement du nœud, puis sa condition Ready.
# (Piège vécu : l'agent mettait 90 s à s'enregistrer, `wait` sortait en 0,3 s.)
- name: "Read-back 1/2 : attendre que le nœud s'enregistre auprès du serveur"
  ansible.builtin.command:
    cmd: k3s kubectl get node {{ k3s_node_name }}
  become: true
  delegate_to: "{{ groups[k3s_server_group][0] }}"
  register: k3s_agent_registered
  until: k3s_agent_registered.rc == 0
  retries: 30
  delay: 10
  failed_when: false
  changed_when: false

- name: "Assert : le nœud s'est enregistré (sinon : réseau inter-nœuds bloqué)"
  ansible.builtin.assert:
    that:
      - k3s_agent_registered.rc == 0
    fail_msg: >-
      {{ k3s_node_name }} ne s'est jamais enregistré auprès du plan de contrôle.
      Cause la plus fréquente : le trafic vers le port 6443 du serveur est
      bloqué. Vérifier (a) les règles ufw des deux hôtes, et (b) que les deux
      machines ne partagent PAS un sous-réseau Contabo — les VPS d'un même
      segment L2 sont isolés par l'hébergeur, et aucun réglage invité n'y remédie
      (cf. le commentaire de topologie dans inventory.contabo.ini).

- name: "Read-back 2/2 : attendre la condition Ready"
  ansible.builtin.command:
    cmd: k3s kubectl wait --for=condition=Ready node/{{ k3s_node_name }} --timeout=300s
  become: true
  delegate_to: "{{ groups[k3s_server_group][0] }}"
  register: k3s_agent_ready
  changed_when: false

- name: "Assert : nœud joint et Ready, vu par le plan de contrôle"
  ansible.builtin.assert:
    that:
      - "'condition met' in k3s_agent_ready.stdout"
    fail_msg: "{{ k3s_node_name }} n'est pas Ready vu du plan de contrôle après 5 min."
    success_msg: "{{ k3s_node_name }} joint et Ready"
