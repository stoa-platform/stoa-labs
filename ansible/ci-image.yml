---
- name: "Déclarer le registre Gitea sur tous les nœuds"
  hosts: k3s_cluster
  gather_facts: false
  become: true
  # Un nœud à la fois : redémarrages k3s séquencés, jamais tout le plan de
  # contrôle et les agents en même temps.
  serial: 1
  roles:
    - registry_config

- name: "Construire l'image Jenkins (worker-3, seul nœud avec Docker)"
  hosts: worker-3
  gather_facts: false
  roles:
    - jenkins_image
